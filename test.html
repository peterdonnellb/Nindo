<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NINDO — Shadow Arts</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
<style>
/* ─── full original styles from the user's file (unchanged) ─── */
:root {
  --ink: #0a0a0f;
  --ink2: #12121a;
  --ink3: #1a1a26;
  --paper: #e8dcc8;
  --paper2: #d4c4a0;
  --blood: #8b1a1a;
  --crimson: #c0392b;
  --crimson-bright: #e74c3c;
  --gold: #c9a227;
  --gold-bright: #f0c040;
  --jade: #2e7d5e;
  --jade-bright: #3daa7d;
  --shadow: #252535;
  --mist: #6b7080;
  --steel: #8899aa;
  --white: #f0e8d8;
  --tier-common: #aabbcc;
  --tier-uncommon: #44cc66;
  --tier-rare: #4488ff;
  --tier-legendary: #aa44ff;
  --tier-epic: #ff8800;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--ink);
  color: var(--white);
  font-family: 'Crimson Text', serif;
  font-size: 16px;
  min-height: 100vh;
  height: 100%;
  overflow-x: hidden;
  background-image:
    radial-gradient(ellipse at 20% 80%, rgba(139,26,26,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(42,42,70,0.3) 0%, transparent 50%);
}

#app { min-height: 100vh; height: 100%; position: relative; }

.screen { display: none; min-height: 100vh; animation: fadeIn 0.3s ease; }
.screen.active { display: block; min-height: 100vh; }
#screen-menu.active { display: flex; }
#screen-hub.active { display: flex; }
#screen-combat.active { display: flex; }
#screen-create.active { display: flex; }
#screen-pvp.active { display: flex; position: fixed; inset: 0; z-index: 50; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--ink2); }
::-webkit-scrollbar-thumb { background: var(--blood); border-radius: 3px; }

/* ===== TYPOGRAPHY ===== */
h1, h2, h3 { font-family: 'Cinzel Decorative', serif; letter-spacing: 0.05em; }
h4, h5, .label { font-family: 'Cinzel', serif; letter-spacing: 0.08em; }

/* ===== MAIN MENU ===== */
#screen-menu {
  align-items: center; justify-content: center; flex-direction: column;
  position: relative; overflow: hidden;
}
.menu-bg {
  position: absolute; inset: 0; overflow: hidden;
}
.menu-bg-kanji {
  position: absolute; font-size: 20vw; color: rgba(139,26,26,0.04);
  font-family: serif; user-select: none; line-height: 1;
}
.menu-bg-kanji:nth-child(1) { top: -5%; left: -5%; transform: rotate(-15deg); }
.menu-bg-kanji:nth-child(2) { top: 30%; right: -3%; transform: rotate(10deg); font-size: 15vw; color: rgba(201,162,39,0.03); }
.menu-bg-kanji:nth-child(3) { bottom: -5%; left: 20%; transform: rotate(5deg); font-size: 25vw; color: rgba(30,30,50,0.3); }

.menu-seal {
  width: 120px; height: 120px; border: 3px solid var(--blood);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 60px; margin-bottom: 1.5rem; position: relative;
  box-shadow: 0 0 30px rgba(192,57,43,0.3), inset 0 0 30px rgba(139,26,26,0.1);
  animation: sealPulse 3s ease-in-out infinite;
}
@keyframes sealPulse {
  0%, 100% { box-shadow: 0 0 30px rgba(192,57,43,0.3), inset 0 0 30px rgba(139,26,26,0.1); }
  50% { box-shadow: 0 0 60px rgba(192,57,43,0.5), inset 0 0 40px rgba(139,26,26,0.2); }
}
.menu-seal::before {
  content: ''; position: absolute; inset: 5px; border-radius: 50%;
  border: 1px solid rgba(201,162,39,0.3);
}

.menu-title {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(3rem, 8vw, 6rem); font-weight: 900;
  color: var(--white); letter-spacing: 0.15em;
  text-shadow: 0 0 40px rgba(192,57,43,0.5), 0 4px 0 rgba(0,0,0,0.5);
  margin-bottom: 0.3rem;
}
.menu-subtitle {
  font-family: 'Cinzel', serif; font-size: 0.9rem; letter-spacing: 0.4em;
  color: var(--gold); text-transform: uppercase; margin-bottom: 3rem;
}
.menu-line {
  width: 200px; height: 1px; background: linear-gradient(90deg, transparent, var(--blood), transparent);
  margin-bottom: 3rem;
}
.menu-options { display: flex; flex-direction: column; gap: 0.8rem; width: 280px; z-index: 1; }
.menu-btn {
  background: transparent; border: 1px solid rgba(201,162,39,0.2);
  color: var(--white); font-family: 'Cinzel', serif; font-size: 0.85rem;
  letter-spacing: 0.2em; padding: 0.9rem 2rem; cursor: pointer;
  transition: all 0.2s; position: relative; text-transform: uppercase;
  clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
}
.menu-btn::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(139,26,26,0) 0%, rgba(139,26,26,0) 100%);
  transition: all 0.2s;
  clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
}
.menu-btn:hover { border-color: var(--gold); color: var(--gold); letter-spacing: 0.3em; }
.menu-btn:hover::before { background: linear-gradient(135deg, rgba(139,26,26,0.3) 0%, rgba(139,26,26,0.1) 100%); }
.menu-btn.primary { border-color: var(--blood); background: rgba(139,26,26,0.15); }
.menu-btn.primary:hover { background: rgba(139,26,26,0.3); }

/* ===== HUB ===== */
#screen-hub { flex-direction: column; }

.hub-nav {
  background: var(--ink2); border-bottom: 1px solid rgba(201,162,39,0.15);
  display: flex; align-items: center; padding: 0 0.8rem; height: 44px; gap: 0.25rem;
  position: sticky; top: 0; z-index: 100; flex-wrap: nowrap; overflow-x: auto;
}
.hub-logo {
  font-family: 'Cinzel Decorative', serif; font-size: 1.1rem;
  color: var(--gold); letter-spacing: 0.08em; margin-right: 0.5rem; white-space: nowrap;
}
.hub-logo span { color: var(--crimson); }
.nav-btn {
  background: transparent; border: 1px solid transparent;
  color: var(--mist); font-family: 'Cinzel', serif; font-size: 0.6rem;
  letter-spacing: 0.08em; padding: 0.2rem 0.45rem; cursor: pointer;
  transition: all 0.2s; text-transform: uppercase; white-space: nowrap;
  clip-path: polygon(4px 0%, 100% 0%, calc(100% - 4px) 100%, 0% 100%);
}
.nav-btn:hover { border-color: rgba(201,162,39,0.4); color: var(--gold); }
.gold-display {
  font-family: 'Cinzel', serif; font-size: 0.7rem; color: var(--gold);
  background: rgba(201,162,39,0.1); border: 1px solid rgba(201,162,39,0.3);
  padding: 0.18rem 0.5rem; display: flex; align-items: center; gap: 0.3rem; white-space: nowrap;
}

.hub-content { flex: 1; padding: 1.5rem; }
.hub-section { display: none; }
.hub-section.active { display: block; animation: fadeIn 0.2s ease; }

/* ===== CLAN ROSTER ===== */
.section-title {
  font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.4em;
  color: var(--gold); text-transform: uppercase; margin-bottom: 1.5rem;
  display: flex; align-items: center; gap: 1rem;
}
.section-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(201,162,39,0.4), transparent); }

.clan-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
.ninja-card {
  background: var(--ink2); border: 1px solid rgba(255,255,255,0.06);
  padding: 1.2rem; position: relative; cursor: pointer;
  clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
  transition: all 0.2s;
}
.ninja-card:hover { border-color: rgba(201,162,39,0.3); transform: translateY(-2px); }
.ninja-card.training { opacity: 0.6; }
.ninja-card-header { display: flex; align-items: flex-start; gap: 1rem; margin-bottom: 1rem; }
.ninja-avatar {
  width: 56px; height: 56px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 2.1rem; line-height: 1; flex-shrink: 0; border: 2px solid transparent;
  overflow: hidden;
}
.ninja-info { flex: 1; }
.ninja-name { font-family: 'Cinzel', serif; font-size: 1rem; color: var(--white); }
.ninja-class { font-size: 0.75rem; color: var(--mist); margin-top: 0.1rem; }
.ninja-level { font-family: 'Cinzel', serif; font-size: 0.7rem; color: var(--gold); margin-top: 0.2rem; }

.stat-bars { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 0.8rem; }
.stat-row { display: flex; align-items: center; gap: 0.6rem; }
.stat-label { font-family: 'Cinzel', serif; font-size: 0.6rem; color: var(--mist); width: 20px; text-align: right; letter-spacing: 0.05em; }
.stat-bar { flex: 1; height: 6px; background: rgba(255,255,255,0.07); border-radius: 3px; overflow: hidden; }
.stat-fill { height: 100%; border-radius: 3px; transition: width 0.4s; }
.stat-fill.hp { background: linear-gradient(90deg, #c0392b, #e74c3c); }
.stat-fill.stamina { background: linear-gradient(90deg, #2e7d5e, #3daa7d); }
.stat-fill.chi { background: linear-gradient(90deg, #2255aa, #4488ff); }
.stat-val { font-size: 0.65rem; color: var(--steel); width: 36px; text-align: right; font-family: monospace; }

.ninja-card-footer { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.weapon-badge {
  font-size: 0.6rem; font-family: 'Cinzel', serif; letter-spacing: 0.1em;
  padding: 0.2rem 0.5rem; border-radius: 2px; border: 1px solid;
}
.training-badge {
  font-size: 0.6rem; font-family: 'Cinzel', serif; letter-spacing: 0.1em;
  padding: 0.2rem 0.5rem; background: rgba(201,162,39,0.1);
  border: 1px solid rgba(201,162,39,0.3); color: var(--gold);
}
.add-ninja-card {
  background: transparent; border: 1px dashed rgba(255,255,255,0.1);
  padding: 1.2rem; display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 0.5rem; cursor: pointer; min-height: 160px;
  transition: all 0.2s; color: var(--mist);
  clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
}
.add-ninja-card:hover { border-color: rgba(201,162,39,0.3); color: var(--gold); }

/* ===== MISSIONS ===== */
.missions-layout { display: grid; grid-template-columns: 1fr 320px; gap: 1.5rem; }
.mission-list { display: flex; flex-direction: column; gap: 0.8rem; }
.mission-card {
  background: var(--ink2); border: 1px solid rgba(255,255,255,0.06);
  padding: 1.2rem; cursor: pointer; transition: all 0.2s;
  clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
  display: flex; gap: 1rem; align-items: flex-start;
}
.mission-card:hover:not(.locked) { border-color: rgba(201,162,39,0.3); transform: translateX(4px); }
.mission-card.locked { opacity: 0.4; cursor: not-allowed; }
.mission-card.completed { opacity: 0.5; }
.mission-card.mission-card-selected { transform: translateX(4px); }
.mission-type-icon { font-size: 2rem; flex-shrink: 0; width: 44px; text-align: center; }
.mission-details { flex: 1; }
.mission-name { font-family: 'Cinzel', serif; font-size: 0.95rem; color: var(--white); margin-bottom: 0.3rem; }
.mission-desc { font-size: 0.8rem; color: var(--mist); line-height: 1.5; margin-bottom: 0.6rem; }
.mission-meta { display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap; }
.mission-tag {
  font-size: 0.6rem; font-family: 'Cinzel', serif; letter-spacing: 0.1em;
  padding: 0.2rem 0.5rem; border: 1px solid; border-radius: 1px;
}
.tag-assassination { border-color: var(--blood); color: var(--crimson-bright); }
.tag-theft { border-color: #aa8800; color: #ddaa00; }
.tag-espionage { border-color: #2255aa; color: #4488ff; }
.tag-agitation { border-color: #554400; color: #aa7700; }
.tag-recruit { border-color: var(--jade); color: var(--jade-bright); }
.difficulty-pip { display: inline-flex; gap: 2px; }
.pip { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.1); }
.pip.active { background: var(--gold); }
.mission-reward { font-family: 'Cinzel', serif; font-size: 0.75rem; color: var(--gold); }

.mission-sidebar { background: var(--ink2); border: 1px solid rgba(255,255,255,0.06); padding: 1.2rem; height: fit-content; }
.party-select { margin-top: 1rem; }
.party-slot {
  display: flex; align-items: center; gap: 0.8rem; padding: 0.6rem;
  border: 1px solid rgba(255,255,255,0.05); margin-bottom: 0.5rem;
  background: rgba(0,0,0,0.2); cursor: pointer; transition: all 0.2s;
}
.party-slot:hover { border-color: rgba(201,162,39,0.3); }
.party-slot.selected { border-color: var(--gold); background: rgba(201,162,39,0.05); }
.party-slot-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; }
.party-slot-info { flex: 1; }
.party-slot-name { font-family: 'Cinzel', serif; font-size: 0.75rem; }
.party-slot-class { font-size: 0.65rem; color: var(--mist); }

/* ===== COMBAT ===== */
#screen-combat { flex-direction: column; }
.combat-layout { display: flex; flex: 1; gap: 0; overflow: hidden; }

/* ── Compact strip sidebars ── */
.combat-sidebar-left {
  width: 112px; background: var(--ink2); border-right: 1px solid rgba(255,255,255,0.06);
  padding: 0.5rem 0.4rem; overflow-y: auto; flex-shrink: 0;
  display: flex; flex-direction: column; gap: 0.3rem;
}
.combat-sidebar-right {
  width: 112px; background: var(--ink2); border-left: 1px solid rgba(255,255,255,0.06);
  padding: 0.5rem 0.4rem; overflow-y: auto; flex-shrink: 0;
  display: flex; flex-direction: column;
}

/* Compact unit strip cards */
.combatant-strip {
  background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.06);
  padding: 0.3rem 0.35rem; cursor: pointer; transition: all 0.15s;
  border-radius: 2px; position: relative;
}
.combatant-strip:hover { border-color: rgba(201,162,39,0.4); background: rgba(201,162,39,0.04); }
.combatant-strip.active-turn { border-color: var(--gold); background: rgba(201,162,39,0.07); }
.combatant-strip.selected-strip { border-color: var(--jade-bright); background: rgba(61,170,125,0.06); }
.combatant-strip.dead-strip { opacity: 0.28; pointer-events: none; }
.strip-name {
  font-family: 'Cinzel', serif; font-size: 0.58rem; color: var(--white);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  display: flex; align-items: center; gap: 3px; margin-bottom: 2px;
}
.strip-vals { font-size: 0.52rem; color: var(--mist); font-family: monospace; display: flex; gap: 3px; }
.strip-hp-bar { height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px; margin-top: 3px; overflow: hidden; }
.strip-hp-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
.strip-chi { font-size: 0.48rem; color: #88aaff; margin-top: 1px; }

/* Sidebar mini-label */
.sidebar-label {
  font-family: 'Cinzel', serif; font-size: 0.48rem; letter-spacing: 0.25em;
  color: rgba(201,162,39,0.5); text-transform: uppercase; padding: 0.1rem 0;
  border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 0.3rem;
}

/* Mini combat log in right sidebar */
.combat-log-mini {
  flex: 1; overflow-y: auto; font-size: 0.55rem; color: var(--steel);
  line-height: 1.5; min-height: 0;
}
.combat-log-mini .log-entry { font-size: 0.55rem; padding: 0.05rem 0; border-bottom: 1px solid rgba(255,255,255,0.03); }

.combat-main { flex: 1; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; padding: 0; background: var(--ink); position: relative; overflow: auto; }

/* ══════════════════════════════════════════
   HOVER INSPECT OVERLAY
══════════════════════════════════════════ */
#hoverInspect {
  position: fixed; z-index: 500; pointer-events: none;
  background: rgba(8, 8, 14, 0.97);
  border: 1px solid rgba(201,162,39,0.35);
  padding: 0.65rem 0.8rem;
  min-width: 180px; max-width: 240px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.04) inset;
  clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
  animation: inspectFadeIn 0.12s ease;
  display: none;
}
@keyframes inspectFadeIn {
  from { opacity: 0; transform: translateY(-4px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
#hoverInspect.visible { display: block; }
.inspect-header {
  display: flex; align-items: center; gap: 0.45rem;
  margin-bottom: 0.45rem; padding-bottom: 0.35rem;
  border-bottom: 1px solid rgba(255,255,255,0.07);
}
.inspect-emoji { font-size: 1.3rem; line-height: 1; }
.inspect-title-block { flex: 1; min-width: 0; }
.inspect-name {
  font-family: 'Cinzel', serif; font-size: 0.8rem; color: var(--white);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.inspect-class { font-size: 0.6rem; color: var(--mist); }
.inspect-type-badge {
  font-size: 0.5rem; font-family: 'Cinzel', serif; letter-spacing: 0.1em;
  padding: 0.1rem 0.3rem; border-radius: 1px; flex-shrink: 0;
}
.inspect-type-ally { border: 1px solid rgba(61,170,125,0.5); color: var(--jade-bright); background: rgba(61,170,125,0.08); }
.inspect-type-enemy { border: 1px solid rgba(192,57,43,0.5); color: var(--crimson-bright); background: rgba(192,57,43,0.08); }

.inspect-stat-row {
  display: flex; align-items: center; gap: 0.4rem;
  margin-bottom: 0.25rem;
}
.inspect-stat-label {
  font-family: 'Cinzel', serif; font-size: 0.5rem; color: rgba(201,162,39,0.7);
  letter-spacing: 0.08em; width: 22px; flex-shrink: 0; text-transform: uppercase;
}
.inspect-stat-bar {
  flex: 1; height: 5px; background: rgba(255,255,255,0.07); border-radius: 3px; overflow: hidden;
}
.inspect-stat-fill { height: 100%; border-radius: 3px; }
.inspect-stat-fill.hp-fill { background: linear-gradient(90deg, var(--crimson), #e74c3c); }
.inspect-stat-fill.chi-fill { background: linear-gradient(90deg, #2255aa, #4488ff); }
.inspect-stat-fill.stam-fill { background: linear-gradient(90deg, var(--jade), var(--jade-bright)); }
.inspect-stat-val { font-size: 0.58rem; color: var(--steel); font-family: monospace; min-width: 30px; text-align: right; }

.inspect-divider { height: 1px; background: rgba(255,255,255,0.06); margin: 0.35rem 0; }

.inspect-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.18rem; }
.inspect-row-label { font-size: 0.55rem; color: var(--mist); }
.inspect-row-val { font-size: 0.58rem; color: var(--white); font-family: 'Cinzel', serif; }

.inspect-special {
  background: rgba(68,136,255,0.07); border: 1px solid rgba(68,136,255,0.2);
  padding: 0.3rem 0.4rem; margin-top: 0.35rem; border-radius: 1px;
}
.inspect-special-name { font-family: 'Cinzel', serif; font-size: 0.62rem; color: #88aaff; }
.inspect-special-desc { font-size: 0.55rem; color: var(--mist); margin-top: 0.1rem; line-height: 1.4; }

.inspect-terrain {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0.2rem 0.5rem;
  margin-top: 0.3rem;
}
.inspect-terrain-tag {
  font-size: 0.52rem; color: var(--mist);
  display: flex; align-items: center; gap: 2px;
}
.inspect-terrain-tag span { color: var(--steel); }

.inspect-status {
  display: flex; gap: 0.25rem; flex-wrap: wrap; margin-top: 0.3rem;
}
.inspect-status-pill {
  font-size: 0.5rem; font-family: 'Cinzel', serif; letter-spacing: 0.06em;
  padding: 0.1rem 0.35rem; border-radius: 10px;
  border: 1px solid rgba(255,200,50,0.4); color: #ffd060;
  background: rgba(255,200,50,0.08);
}

/* ── Active action mode banner ── */
#actionModeBanner {
  display: none; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  z-index: 30; pointer-events: none;
  background: rgba(8,8,14,0.9); border: 1px solid rgba(201,162,39,0.4);
  border-top: none; padding: 0.2rem 1.2rem;
  font-family: 'Cinzel', serif; font-size: 0.62rem; letter-spacing: 0.25em;
  color: var(--gold); text-transform: uppercase;
  clip-path: polygon(0 0, 100% 0, calc(100% - 6px) 100%, 6px 100%);
}
#actionModeBanner.visible { display: block; }
#actionModeBanner.mode-move { border-color: rgba(61,170,125,0.5); color: var(--jade-bright); }
#actionModeBanner.mode-attack { border-color: rgba(192,57,43,0.5); color: var(--crimson-bright); }
#actionModeBanner.mode-special { border-color: rgba(68,136,255,0.5); color: #88aaff; }

/* ── Phase transition banner ── */
#phaseBanner {
  position: absolute; inset: 0; z-index: 40; pointer-events: none;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.15s;
}
#phaseBanner.show { opacity: 1; }
.phase-banner-inner {
  font-family: 'Cinzel Decorative', serif; font-size: 2rem; letter-spacing: 0.2em;
  text-shadow: 0 0 40px currentColor;
  animation: phasePop 0.5s ease;
}
@keyframes phasePop {
  0% { transform: scale(0.7) translateY(12px); opacity: 0; }
  40% { transform: scale(1.05); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}

/* ── Keyboard shortcut badges on action buttons ── */
.action-btn { position: relative; }
.kbd-hint {
  position: absolute; top: -6px; right: -4px; z-index: 2;
  background: rgba(20,20,30,0.95); border: 1px solid rgba(255,255,255,0.15);
  color: rgba(201,162,39,0.8); font-family: monospace; font-size: 0.48rem;
  padding: 0.06rem 0.28rem; border-radius: 2px; letter-spacing: 0;
  pointer-events: none;
}
.action-btn:hover .kbd-hint { border-color: rgba(201,162,39,0.5); color: var(--gold); }
.action-btn:disabled .kbd-hint { opacity: 0.35; }

/* ── Improved combat controls bar ── */
.combat-controls {
  background: var(--ink2); border-top: 1px solid rgba(255,255,255,0.06);
  padding: 0.55rem 0.8rem; display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; justify-content: center;
  position: relative;
}
.controls-active-label {
  position: absolute; top: 0; left: 50%; transform: translate(-50%, -50%);
  font-family: 'Cinzel', serif; font-size: 0.55rem; letter-spacing: 0.2em;
  color: var(--gold); background: var(--ink2);
  padding: 0.1rem 0.6rem; border: 1px solid rgba(201,162,39,0.3);
  white-space: nowrap; display: none;
}
.controls-active-label.visible { display: block; }

/* ── Improved combat header ── */
.combat-header {
  background: var(--ink2); border-bottom: 1px solid rgba(255,255,255,0.06);
  padding: 0.4rem 0.8rem; display: flex; align-items: center; gap: 0.7rem;
  font-family: 'Cinzel', serif; font-size: 0.7rem; color: var(--mist);
  position: relative;
}
.phase-indicator {
  display: flex; align-items: center; gap: 0.4rem;
  background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.07);
  padding: 0.2rem 0.6rem; border-radius: 1px;
}
.phase-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--jade-bright); box-shadow: 0 0 6px currentColor;
  flex-shrink: 0; transition: background 0.3s;
}
.phase-dot.enemy { background: var(--crimson-bright); }
.phase-dot.waiting { background: var(--gold); }

/* Turn counter styled */
.turn-counter {
  font-family: 'Cinzel Decorative', serif; font-size: 0.75rem; color: var(--gold);
  background: rgba(201,162,39,0.08); border: 1px solid rgba(201,162,39,0.2);
  padding: 0.15rem 0.5rem;
}

/* ── HP bar color tiers ── */
.hp-high { background: linear-gradient(90deg, var(--crimson), #e74c3c); }
.hp-mid { background: linear-gradient(90deg, #aa7700, #ddaa00); }
.hp-low { background: linear-gradient(90deg, var(--blood), #cc2222); }

#combatCanvas {
  border: 2px solid rgba(201,162,39,0.2);
  box-shadow: 0 0 40px rgba(0,0,0,0.8);
  cursor: pointer; display: block;
  image-rendering: pixelated;
}

.combat-header {
  background: var(--ink2); border-bottom: 1px solid rgba(255,255,255,0.05);
  padding: 0.5rem 1rem; display: flex; align-items: center; gap: 1rem;
  font-family: 'Cinzel', serif; font-size: 0.7rem; color: var(--mist);
}
.turn-display { color: var(--gold); font-size: 0.8rem; }
.phase-display { color: var(--steel); }
.combat-controls {
  background: var(--ink2); border-top: 1px solid rgba(255,255,255,0.05);
  padding: 0.7rem 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; justify-content: center;
}
.action-btn {
  background: transparent; border: 1px solid rgba(255,255,255,0.1);
  color: var(--white); font-family: 'Cinzel', serif; font-size: 0.65rem;
  letter-spacing: 0.1em; padding: 0.4rem 0.9rem; cursor: pointer;
  transition: all 0.2s; text-transform: uppercase;
  clip-path: polygon(5px 0%, 100% 0%, calc(100% - 5px) 100%, 0% 100%);
}
.action-btn:hover:not(:disabled) { border-color: rgba(201,162,39,0.5); color: var(--gold); }
.action-btn.attack { border-color: rgba(192,57,43,0.4); }
.action-btn.attack:hover { border-color: var(--crimson); color: var(--crimson-bright); }
.action-btn.special { border-color: rgba(68,136,255,0.4); color: #88aaff; }
.action-btn.special:hover { border-color: #4488ff; color: #88aaff; }
.action-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.action-btn.end-turn { border-color: rgba(201,162,39,0.4); color: var(--gold); }

/* CT / ATB queue */
.ct-slot {
  display: flex; flex-direction: column; align-items: center;
  width: 36px; flex-shrink: 0;
  padding: 2px 2px 3px;
  border: 1px solid rgba(255,255,255,0.08);
  font-size: 0.55rem;
}
.ct-slot.active { border-color: var(--gold); background: rgba(201,162,39,0.12); }
.ct-slot.ally { }
.ct-slot.enemy { opacity: 0.85; }
.ct-emoji { font-size: 0.85rem; line-height: 1; }
.ct-name { font-family: 'Cinzel',serif; font-size: 0.44rem; color: var(--mist); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 34px; text-align: center; }
.ct-bar-wrap { width: 30px; height: 3px; background: rgba(255,255,255,0.1); margin-top: 2px; }
.ct-bar-fill { height: 3px; transition: width 0.3s; }

/* CT progress bars in sidebar */
.ctb-row { display: flex; align-items: center; gap: 3px; margin-bottom: 2px; }
.ctb-label { font-size: 0.75rem; width: 16px; flex-shrink: 0; text-align: center; }
.ctb-track { flex: 1; height: 5px; background: rgba(255,255,255,0.08); border-radius: 1px; }
.ctb-fill { height: 5px; border-radius: 1px; transition: width 0.3s; min-width: 1px; }
.ctb-fill.ctb-active { box-shadow: 0 0 4px currentColor; }

@keyframes doom-pulse {
  from { opacity: 1; }
  to   { opacity: 0.45; }
}
.facing-btn {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.12);
  color: var(--steel);
  font-size: 0.55rem;
  width: 18px; height: 18px;
  padding: 0; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.facing-btn:hover:not(:disabled) { background: rgba(201,162,39,0.15); border-color: var(--gold); color: var(--gold); }
.facing-btn.active { background: rgba(201,162,39,0.22); border-color: var(--gold); color: var(--gold); }
.facing-btn:disabled { opacity: 0.25; cursor: not-allowed; }

.combat-log {
  background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05);
  padding: 0.6rem; height: 120px; overflow-y: auto; margin-top: 0.5rem;
}
.log-entry { font-size: 0.65rem; color: var(--steel); line-height: 1.6; padding: 0.1rem 0; }
.log-entry.damage { color: var(--crimson-bright); }
.log-entry.heal { color: var(--jade-bright); }
.log-entry.special { color: #88aaff; }
.log-entry.system { color: var(--gold); font-family: 'Cinzel', serif; font-size: 0.6rem; letter-spacing: 0.1em; }
.log-entry.death { color: #ff4444; font-weight: bold; }

/* Legacy combatant-card — used in mobile overlay panels */
.combatant-card {
  background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05);
  padding: 0.5rem; margin-bottom: 0.4rem; font-size: 0.7rem;
  cursor: pointer; transition: all 0.15s;
}
.combatant-card.active-turn { border-color: var(--gold); background: rgba(201,162,39,0.05); }
.combatant-card.selected { border-color: var(--jade-bright); }
.combatant-card.dead { opacity: 0.3; }
.combatant-name { font-family: 'Cinzel', serif; font-size: 0.7rem; display: flex; align-items: center; gap: 0.4rem; }
.combatant-mini-hp { height: 3px; border-radius: 2px; background: rgba(255,255,255,0.1); margin-top: 0.3rem; }
.combatant-mini-hp-fill { height: 100%; border-radius: 2px; background: var(--crimson); transition: width 0.3s; }

/* ===== DOOM VIGNETTE PULSE ===== */
#doomVignette {
  position: fixed; inset: 0; pointer-events: none; z-index: 450;
  border: 0px solid rgba(220, 30, 30, 0);
  box-shadow: inset 0 0 0px rgba(220, 30, 30, 0);
  transition: box-shadow 0.2s, border-width 0.2s;
}
#doomVignette.doom-active {
  animation: doomPulseVignette 0.9s ease-in-out infinite;
}
@keyframes doomPulseVignette {
  0%, 100% { box-shadow: inset 0 0 40px rgba(220,30,30,0.12); }
  50%       { box-shadow: inset 0 0 80px rgba(220,30,30,0.32); }
}

/* ===== TURN SUMMARY STRIP ===== */
#turnSummary {
  position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%) translateY(20px);
  z-index: 35; pointer-events: none; white-space: nowrap;
  background: rgba(8,8,14,0.92); border: 1px solid rgba(201,162,39,0.25);
  padding: 0.28rem 1.2rem;
  font-family: 'Cinzel', serif; font-size: 0.6rem; letter-spacing: 0.15em;
  color: var(--mist);
  transition: transform 0.22s ease, opacity 0.22s ease;
  opacity: 0;
  clip-path: polygon(6px 0%, 100% 0%, calc(100% - 6px) 100%, 0% 100%);
}
#turnSummary.visible {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

/* ===== MISSION CARD SELECTED EXPAND ===== */
.mission-card-detail {
  margin-top: 0.8rem; padding: 0.8rem;
  background: rgba(0,0,0,0.2); border: 1px solid rgba(201,162,39,0.15);
  animation: fadeIn 0.15s ease;
}
.mission-detail-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-bottom: 0.7rem;
}
.mission-detail-stat {
  font-size: 0.65rem;
}
.mission-detail-stat .label { color: var(--mist); font-family: 'Cinzel', serif; font-size: 0.55rem; letter-spacing: 0.1em; display: block; margin-bottom: 0.1rem; }
.mission-detail-stat .val { color: var(--white); }
.float-dmg {
  position: fixed; pointer-events: none; z-index: 600;
  font-family: 'Cinzel Decorative', serif; font-weight: 900;
  text-shadow: 0 2px 8px rgba(0,0,0,0.9), 0 0 12px currentColor;
  animation: floatDmgAnim 1.1s ease-out forwards;
  user-select: none;
}
@keyframes floatDmgAnim {
  0%   { transform: translateY(0) scale(1);   opacity: 1; }
  15%  { transform: translateY(-6px) scale(1.2); opacity: 1; }
  80%  { transform: translateY(-40px) scale(0.9); opacity: 0.85; }
  100% { transform: translateY(-60px) scale(0.7); opacity: 0; }
}
.float-dmg.crit { animation: floatCritAnim 1.3s ease-out forwards; }
@keyframes floatCritAnim {
  0%   { transform: translateY(0) scale(1.4) rotate(-4deg); opacity: 1; }
  15%  { transform: translateY(-10px) scale(1.6) rotate(3deg); opacity: 1; }
  70%  { transform: translateY(-55px) scale(1.1) rotate(-1deg); opacity: 0.9; }
  100% { transform: translateY(-80px) scale(0.8) rotate(0); opacity: 0; }
}
.float-dmg.heal { animation: floatHealAnim 1.2s ease-out forwards; }
@keyframes floatHealAnim {
  0%   { transform: translateY(0) scale(1);   opacity: 1; }
  15%  { transform: translateY(6px) scale(1.15); opacity: 1; }
  80%  { transform: translateY(-30px) scale(0.9); opacity: 0.85; }
  100% { transform: translateY(-50px) scale(0.7); opacity: 0; }
}
.float-dmg.miss { font-size: 0.85rem; opacity: 0.7; }

/* ===== IMPROVED ACTION BUTTON ACTIVE STATE ===== */
.action-btn.mode-active {
  background: rgba(201,162,39,0.12) !important;
  border-color: var(--gold) !important;
  color: var(--gold) !important;
  box-shadow: 0 0 12px rgba(201,162,39,0.2), inset 0 0 8px rgba(201,162,39,0.05);
}
.action-btn.mode-active.attack {
  background: rgba(192,57,43,0.18) !important;
  border-color: var(--crimson-bright) !important;
  color: var(--crimson-bright) !important;
  box-shadow: 0 0 12px rgba(192,57,43,0.25), inset 0 0 8px rgba(192,57,43,0.08);
}
.action-btn.mode-active.special {
  background: rgba(68,136,255,0.15) !important;
  border-color: #4488ff !important;
  color: #88aaff !important;
  box-shadow: 0 0 12px rgba(68,136,255,0.2), inset 0 0 8px rgba(68,136,255,0.06);
}

/* ===== IMPROVED NINJA CARD ===== */
.ninja-card {
  background: var(--ink2); border: 1px solid rgba(255,255,255,0.06);
  padding: 1.2rem; position: relative; cursor: pointer;
  clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);

}
.ninja-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;

}
.ninja-card:hover::before { opacity: 1; }
.ninja-card:hover { border-color: rgba(201,162,39,0.3); transform: translateY(-2px);

.ninja-card-header { display: flex; align-items: flex-start; gap: 1rem; margin-bottom: 0.8rem; }

.ninja-xp-ring {

.ninja-info { flex: 1; }

.ninja-xp-label { font-size: 0.48rem; color: rgba(201,162,39,0.5); font-family: 'Cinzel', serif; margin-top: 1px; }

/* ===== HUB NAV ACTIVE TAB INDICATOR ===== */
.nav-btn { position: relative; overflow: visible; }
.nav-btn.active {
  border-color: rgba(201,162,39,0.5) !important;
  color: var(--gold) !important;

}

/* Ready training badge in training list */
.training-ready-btn {
  background: linear-gradient(135deg,rgba(61,170,125,0.3),rgba(61,170,125,0.1));
  border: 1px solid var(--jade-bright); color: var(--jade-bright);
  font-family:'Cinzel',serif; font-size:0.6rem; letter-spacing:0.1em;
  padding:0.25rem 0.7rem; cursor:pointer; transition:all 0.15s; margin-top:0.5rem;
}

/* Clan readiness bar */

/* Heal all button */
.heal-all-btn {
  background:rgba(61,170,125,0.12); border:1px solid rgba(61,170,125,0.3);
  color:var(--jade-bright); font-family:'Cinzel',serif; font-size:0.6rem;

}

/* Mission turn limit badge */
.mission-turn-badge {
  font-size:0.55rem; font-family:'Cinzel',serif; color:var(--crimson);

/* ===== MINI TURN ORDER (CT queue) improvements ===== */
.ct-slot {
  display: flex; flex-direction: column; align-items: center;
  width: 34px; flex-shrink: 0;
  padding: 2px 2px 3px;
  border: 1px solid rgba(255,255,255,0.07);
  font-size: 0.55rem; border-radius: 2px; transition: all 0.15s;
}
.ct-slot.active { border-color: var(--gold); background: rgba(201,162,39,0.12);

/* ===== SECTION TITLE upgrade ===== */
.section-title {
  font-family: 'Cinzel', serif; font-size: 0.68rem; letter-spacing: 0.35em;

.item-name { font-family: 'Cinzel', serif; font-size: 0.85rem; margin-bottom: 0.3rem; }
.tier-common .item-name { color: var(--tier-common); }
.tier-uncommon .item-name { color: var(--tier-uncommon); }
.tier-rare .item-name { color: var(--tier-rare); }
.tier-legendary .item-name { color: var(--tier-legendary); }
.tier-epic .item-name { color: var(--tier-epic); }
.item-stats { font-size: 0.7rem; color: var(--mist); margin-bottom: 0.5rem; line-height: 1.6; }

.remove-btn { background: none; border: none; color: var(--crimson); cursor: pointer; font-size: 0.8rem; }
.buy-btn {
  background: linear-gradient(135deg, rgba(139,26,26,0.3), rgba(139,26,26,0.1));
  border: 1px solid var(--blood); color: var(--white);
  font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.15em;
  padding: 0.6rem 1.5rem; cursor: pointer; transition: all 0.2s; width: 100%; margin-top: 1rem;
  text-transform: uppercase;
}
.buy-btn:hover { background: linear-gradient(135deg, rgba(139,26,26,0.5), rgba(139,26,26,0.2)); }

/* ===== TRAINING ===== */
.training-layout { display: grid; grid-template-columns: 1fr 280px; gap: 1.5rem; align-items: start; }
.training-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
.training-type-card {
  background: var(--ink2); border: 1px solid rgba(255,255,255,0.05);
  padding: 1rem; cursor: pointer; transition: all 0.2s;
}
.training-type-card:hover { border-color: rgba(201,162,39,0.3); }
.training-type-card.selected { border-color: var(--jade); }
.training-type-icon { font-size: 2rem; margin-bottom: 0.5rem; }
.training-type-name { font-family: 'Cinzel', serif; font-size: 0.9rem; margin-bottom: 0.3rem; }
.training-type-desc { font-size: 0.75rem; color: var(--mist); line-height: 1.5; }
.training-type-time { font-family: 'Cinzel', serif; font-size: 0.7rem; color: var(--gold); margin-top: 0.5rem; }

.assign-training-btn {
  background: linear-gradient(135deg, rgba(46,125,94,0.3), rgba(46,125,94,0.1));
  border: 1px solid var(--jade); color: var(--white);
  font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.15em;
  padding: 0.5rem 1.2rem; cursor: pointer; transition: all 0.2s;
  text-transform: uppercase;
}
.assign-training-btn:hover { background: linear-gradient(135deg, rgba(46,125,94,0.5), rgba(46,125,94,0.2)); }

/* ===== EXCHANGE SHOP ===== */
.exchange-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
.exchange-card {
  background: var(--ink2); border: 1px solid rgba(201,162,39,0.15);
  padding: 1.5rem; text-align: center; cursor: pointer; transition: all 0.2s;
  clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
}
.exchange-card:hover { border-color: var(--gold); transform: translateY(-3px); box-shadow: 0 8px 30px rgba(201,162,39,0.1); }
.exchange-card.featured { border-color: rgba(201,162,39,0.4); background: linear-gradient(135deg, rgba(201,162,39,0.08), var(--ink2)); }
.exchange-gold-amount { font-family: 'Cinzel Decorative', serif; font-size: 2.5rem; color: var(--gold); }
.exchange-bonus { font-size: 0.7rem; color: var(--jade-bright); margin: 0.3rem 0; font-family: 'Cinzel', serif; }
.exchange-price { font-family: 'Cinzel', serif; font-size: 1.1rem; color: var(--white); margin-top: 0.8rem; }
.exchange-note { font-size: 0.6rem; color: var(--mist); margin-top: 1rem; font-style: italic; text-align: center; }

/* ===== CHARACTER CREATE ===== */
#screen-create { align-items: center; justify-content: center; }
.create-panel {
  background: var(--ink2); border: 1px solid rgba(201,162,39,0.15);
  padding: 2rem; max-width: 860px; width: 100%;
  clip-path: polygon(16px 0%, 100% 0%, calc(100% - 16px) 100%, 0% 100%);
}
.create-title { font-family: 'Cinzel Decorative', serif; font-size: 1.8rem; color: var(--gold); margin-bottom: 0.5rem; }
.create-subtitle { font-size: 0.8rem; color: var(--mist); margin-bottom: 2rem; font-family: 'Cinzel', serif; letter-spacing: 0.2em; }
.class-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; margin-bottom: 1.5rem; }
.class-card {
  background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05);
  padding: 1rem; cursor: pointer; transition: all 0.2s; text-align: center;
}
.class-card:hover { border-color: rgba(201,162,39,0.3); }
.class-card.selected { border-color: var(--gold); background: rgba(201,162,39,0.05); }
.class-emoji { font-size: 2.5rem; display: block; margin-bottom: 0.5rem; }
.class-name { font-family: 'Cinzel', serif; font-size: 0.85rem; color: var(--white); margin-bottom: 0.3rem; }
.class-desc { font-size: 0.68rem; color: var(--mist); line-height: 1.5; }
.class-stats-mini { display: flex; gap: 0.4rem; margin-top: 0.5rem; justify-content: center; flex-wrap: wrap; }
.mini-stat { font-size: 0.6rem; font-family: 'Cinzel', serif; padding: 0.15rem 0.4rem; border-radius: 2px; }
.mini-stat.hp { background: rgba(192,57,43,0.2); color: #e74c3c; border: 1px solid rgba(192,57,43,0.3); }
.mini-stat.stam { background: rgba(46,125,94,0.2); color: #3daa7d; border: 1px solid rgba(46,125,94,0.3); }
.mini-stat.chi { background: rgba(68,136,255,0.2); color: #88aaff; border: 1px solid rgba(68,136,255,0.3); }

.name-input {
  background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
  color: var(--white); font-family: 'Cinzel', serif; font-size: 1.1rem;
  padding: 0.7rem 1rem; width: 100%; margin-bottom: 1.5rem; outline: none;
  letter-spacing: 0.1em;
}
.name-input:focus { border-color: rgba(201,162,39,0.4); }
.name-input::placeholder { color: rgba(255,255,255,0.2); }

.confirm-btn {
  background: linear-gradient(135deg, rgba(139,26,26,0.4), rgba(139,26,26,0.15));
  border: 1px solid var(--blood); color: var(--white);
  font-family: 'Cinzel', serif; font-size: 0.8rem; letter-spacing: 0.2em;
  padding: 0.8rem 2.5rem; cursor: pointer; transition: all 0.2s; text-transform: uppercase;
  clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
}
.confirm-btn:hover { background: linear-gradient(135deg, rgba(139,26,26,0.6), rgba(139,26,26,0.3)); letter-spacing: 0.25em; }

/* ===== MODAL ===== */
#codexOverlay::-webkit-scrollbar { width: 6px; }
#codexOverlay::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); }
#codexOverlay::-webkit-scrollbar-thumb { background: rgba(201,162,39,0.3); border-radius: 3px; }

.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85);
  display: none; align-items: center; justify-content: center; z-index: 1000;
  padding: 0.5rem;
}
.modal-overlay.open { display: flex; animation: fadeIn 0.2s; }
.modal {
  background: var(--ink2); border: 1px solid rgba(201,162,39,0.2);
  padding: 1.5rem 1.5rem 1.2rem;
  max-width: 560px; width: 100%;
  max-height: calc(100dvh - 1rem);
  display: flex; flex-direction: column;
  clip-path: polygon(12px 0%, 100% 0%, calc(100% - 12px) 100%, 0% 100%);
  animation: slideUp 0.3s ease;
}
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-title { font-family: 'Cinzel', serif; font-size: 1.1rem; color: var(--gold); margin-bottom: 0.8rem; flex-shrink: 0; }
.modal-body {
  font-size: 0.85rem; color: var(--mist); line-height: 1.7;
  margin-bottom: 1rem;
  overflow-y: auto; flex: 1;
  scrollbar-width: thin; scrollbar-color: rgba(201,162,39,0.3) transparent;
}
.modal-body::-webkit-scrollbar { width: 4px; }
.modal-body::-webkit-scrollbar-track { background: transparent; }
.modal-body::-webkit-scrollbar-thumb { background: rgba(201,162,39,0.3); border-radius: 2px; }
.modal-actions { display: flex; gap: 0.8rem; justify-content: flex-end; flex-shrink: 0; padding-top: 0.5rem; border-top: 1px solid rgba(255,255,255,0.05); }
.modal-btn {
  background: transparent; border: 1px solid rgba(255,255,255,0.15);
  color: var(--white); font-family: 'Cinzel', serif; font-size: 0.7rem;
  letter-spacing: 0.1em; padding: 0.5rem 1.2rem; cursor: pointer; transition: all 0.2s;
}
.modal-btn:hover { border-color: var(--gold); color: var(--gold); }
.modal-btn.danger { border-color: var(--blood); color: var(--crimson-bright); }
.modal-btn.confirm { border-color: var(--jade); color: var(--jade-bright); }

/* ===== NOTIFICATIONS ===== */
.toast {
  position: fixed; top: 80px; right: 20px; z-index: 2000;
  background: var(--ink3); border: 1px solid rgba(201,162,39,0.3);
  padding: 0.8rem 1.2rem; font-family: 'Cinzel', serif; font-size: 0.75rem;
  color: var(--gold); letter-spacing: 0.1em; animation: toastIn 0.3s ease;
  clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
  max-width: 300px;
}
.toast.error { border-color: rgba(192,57,43,0.5); color: var(--crimson-bright); }
.toast.success { border-color: rgba(46,125,94,0.5); color: var(--jade-bright); }
@keyframes toastIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }


/* ===== LOADOUT MODAL ===== */
.loadout-panel { display: flex; flex-direction: column; gap: 0.8rem; margin-top: 0.5rem; }
.loadout-section-title { font-family: "Cinzel", serif; font-size: 0.6rem; letter-spacing: 0.16em; color: var(--gold); text-transform: uppercase; margin-bottom: 0.35rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(201,162,39,0.12); padding-bottom: 0.2rem; }
.weapon-choice-list { display: flex; flex-direction: column; gap: 0.22rem; max-height: 150px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(201,162,39,0.25) transparent; }
.weapon-choice-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.32rem 0.5rem; border: 1px solid rgba(255,255,255,0.06); background: rgba(0,0,0,0.2); cursor: pointer; transition: all 0.15s; font-size: 0.7rem; }
.weapon-choice-item:hover { border-color: rgba(201,162,39,0.35); background: rgba(201,162,39,0.05); }
.weapon-choice-item.equipped-now { border-color: rgba(201,162,39,0.6); background: rgba(201,162,39,0.08); }
.weapon-choice-item.unequip-slot { border-color: rgba(255,255,255,0.06); color: var(--mist); }
.wci-tier { width: 3px; border-radius: 2px; align-self: stretch; flex-shrink: 0; }
.wci-info { flex: 1; min-width: 0; }
.wci-name { font-family: "Cinzel", serif; font-size: 0.68rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wci-stats { font-size: 0.58rem; color: var(--mist); }
/* Armor — compact horizontal strip, no large square */
.armor-slot-strip { display: flex; align-items: center; gap: 0.6rem; padding: 0.35rem 0.5rem; border: 1px solid rgba(255,255,255,0.08); background: rgba(0,0,0,0.2); cursor: pointer; transition: all 0.15s; }
.armor-slot-strip:hover { border-color: rgba(201,162,39,0.4); }
.armor-slot-strip.filled { border-color: rgba(201,162,39,0.35); background: rgba(201,162,39,0.04); }
.armor-slot-strip .aslot-img { width: 30px; height: 30px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; }
.armor-slot-strip .aslot-info { flex: 1; min-width: 0; }
.armor-slot-strip .aslot-name { font-family: "Cinzel", serif; font-size: 0.66rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.armor-slot-strip .aslot-dur { font-size: 0.56rem; margin-top: 1px; }
.armor-slot-strip .aslot-unequip { font-size: 0.55rem; color: var(--crimson); margin-left: auto; flex-shrink: 0; padding-left: 0.4rem; }
/* Field kit — compact 4 squares */
.carry-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.3rem; margin-bottom: 0.35rem; }
.carry-slot { aspect-ratio: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1px; cursor: pointer; position: relative; transition: all 0.15s; border-radius: 2px; }
.carry-slot:hover { border-color: rgba(192,57,43,0.4); }
.carry-slot.filled { border-color: rgba(201,162,39,0.25); }
.carry-slot-icon { font-size: 1.1rem; line-height: 1; }
.carry-slot-label { font-size: 0.42rem; color: var(--mist); text-align: center; line-height: 1.1; font-family: "Cinzel", serif; padding: 0 1px; }
.carry-slot-remove { position: absolute; top: 1px; right: 2px; font-size: 0.5rem; color: var(--crimson); display: none; }
.carry-slot:hover .carry-slot-remove { display: block; }
.carry-empty { font-size: 1.2rem; opacity: 0.2; }
/* Stash items */
.stash-item-list { display: flex; flex-direction: column; gap: 0.22rem; max-height: 130px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent; }
.stash-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.28rem 0.5rem; border: 1px solid rgba(255,255,255,0.06); background: rgba(0,0,0,0.2); cursor: pointer; transition: all 0.15s; }
.stash-item:hover { border-color: rgba(61,170,125,0.4); background: rgba(61,170,125,0.04); }
.stash-item.full { opacity: 0.35; cursor: not-allowed; }
.stash-item-icon { font-size: 1rem; flex-shrink: 0; }
.stash-item-info { flex: 1; min-width: 0; }
.stash-item-name { font-family: "Cinzel", serif; font-size: 0.63rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stash-item-desc { font-size: 0.55rem; color: var(--mist); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stash-item-owned { font-size: 0.57rem; color: var(--steel); margin-left: auto; flex-shrink: 0; white-space: nowrap; padding-left: 0.3rem; }
.use-item-list { display: flex; flex-direction: column; gap: 0.4rem; }
.use-item-btn { display: flex; align-items: center; gap: 0.7rem; padding: 0.5rem 0.8rem; border: 1px solid rgba(61,170,125,0.25); background: rgba(61,170,125,0.05); cursor: pointer; transition: all 0.15s; }
.use-item-btn:hover { border-color: rgba(61,170,125,0.55); background: rgba(61,170,125,0.1); }
.party-loadout-bar { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-top: 0.3rem; }
.loadout-pip { font-size: 0.65rem; border: 1px solid rgba(255,255,255,0.08); padding: 0.1rem 0.35rem; border-radius: 2px; color: var(--mist); }
.loadout-pip.weapon { border-color: rgba(201,162,39,0.3); color: var(--gold); }
.configure-btn { background: transparent; border: 1px solid rgba(201,162,39,0.25); color: var(--gold); font-family: "Cinzel", serif; font-size: 0.6rem; letter-spacing: 0.1em; padding: 0.2rem 0.6rem; cursor: pointer; margin-left: auto; flex-shrink: 0; transition: all 0.15s; }
.configure-btn:hover { border-color: var(--gold); background: rgba(201,162,39,0.08); }
/* ===== SPECIAL MOVE DISPLAY ===== */
.special-move-info {
  background: rgba(68,136,255,0.05); border: 1px solid rgba(68,136,255,0.2);
  padding: 0.6rem; margin-top: 0.5rem;
}
.special-move-name { font-family: 'Cinzel', serif; font-size: 0.7rem; color: #88aaff; }
.special-move-desc { font-size: 0.65rem; color: var(--mist); margin-top: 0.2rem; }

/* ===== INVENTORY ===== */
.inventory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.3rem; }
.inv-slot {
  aspect-ratio: 1; background: rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.05); display: flex;
  align-items: center; justify-content: center; font-size: 1.2rem;
  cursor: pointer; position: relative; transition: all 0.15s;
}
.inv-slot:hover { border-color: rgba(201,162,39,0.3); }
.inv-slot.equipped { border-color: rgba(201,162,39,0.5); background: rgba(201,162,39,0.05); }
.inv-slot-count { position: absolute; bottom: 1px; right: 2px; font-size: 0.55rem; color: var(--mist); font-family: monospace; }

/* ===== MISC UTILS ===== */
.flex { display: flex; } .gap-1 { gap: 0.5rem; } .gap-2 { gap: 1rem; }
.mt-1 { margin-top: 0.5rem; } .mt-2 { margin-top: 1rem; } .mt-3 { margin-top: 1.5rem; }
.mb-1 { margin-bottom: 0.5rem; } .mb-2 { margin-bottom: 1rem; }
.text-gold { color: var(--gold); } .text-crimson { color: var(--crimson-bright); }
.text-jade { color: var(--jade-bright); } .text-mist { color: var(--mist); }
.text-sm { font-size: 0.75rem; } .text-xs { font-size: 0.65rem; }
.font-cinzel { font-family: 'Cinzel', serif; }
.w-full { width: 100%; }
.separator { height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent); margin: 1rem 0; }

/* =============================================
   RESPONSIVE / MOBILE
   ============================================= */

/* Mobile nav bottom bar */
.mobile-nav {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  background: var(--ink2); border-top: 1px solid rgba(201,162,39,0.2);
  padding: 0 0 env(safe-area-inset-bottom, 0);
}
.mobile-nav-inner {
  display: flex; align-items: stretch; height: 56px;
}
.mob-nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 2px; background: none; border: none;
  color: var(--mist); cursor: pointer; font-family: 'Cinzel', serif;
  font-size: 0.48rem; letter-spacing: 0.06em; text-transform: uppercase;
  padding: 4px 0; transition: color 0.15s; border-top: 2px solid transparent;
  -webkit-tap-highlight-color: transparent;
}
.mob-nav-btn .icon { font-size: 1.2rem; line-height: 1; }
.mob-nav-btn.active { color: var(--gold); border-top-color: var(--gold); }
.mob-nav-gold {
  display: none; position: absolute; top: 8px; right: 12px;
  font-family: 'Cinzel', serif; font-size: 0.7rem; color: var(--gold);
  background: rgba(201,162,39,0.1); border: 1px solid rgba(201,162,39,0.3);
  padding: 0.2rem 0.6rem;
}

/* Combat mobile overlay panels */
.combat-panel-toggle {
  display: none; position: absolute; z-index: 10;
  background: var(--ink2); border: 1px solid rgba(201,162,39,0.3);
  color: var(--gold); font-family: 'Cinzel', serif; font-size: 0.6rem;
  letter-spacing: 0.1em; padding: 0.3rem 0.6rem; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.combat-panel-toggle.left { top: 8px; left: 8px; }
.combat-panel-toggle.right { top: 8px; right: 8px; }
.combat-overlay-panel {
  display: none; position: absolute; top: 0; bottom: 0; z-index: 20;
  background: rgba(10,10,18,0.97); width: 220px; overflow-y: auto;
  padding: 0.8rem; border: 1px solid rgba(201,162,39,0.2);
  animation: slideInPanel 0.2s ease;
}
.combat-overlay-panel.left-panel { left: 0; }
.combat-overlay-panel.right-panel { right: 0; }
.combat-overlay-panel.open { display: block; }
@keyframes slideInPanel {
  from { opacity: 0; transform: translateX(-10px); }
  to { opacity: 1; transform: translateX(0); }
}
.close-panel-btn {
  display: block; width: 100%; background: none;
  border: none; border-bottom: 1px solid rgba(255,255,255,0.06);
  color: var(--mist); font-family: 'Cinzel', serif; font-size: 0.6rem;
  text-align: right; padding: 0 0 0.4rem; cursor: pointer; margin-bottom: 0.6rem;
}

@media (max-width: 900px) {
  .hub-nav { padding: 0 0.4rem; gap: 0.15rem; height: 40px; }
  .hub-nav .nav-btn { font-size: 0.52rem; padding: 0.18rem 0.35rem; letter-spacing: 0.05em; }
  .hub-logo { font-size: 1rem; }
  .gold-display { font-size: 0.7rem; padding: 0.25rem 0.5rem; }
  .hub-content { padding: 1rem 0.8rem; }
}

@media (max-width: 700px) {
  .hub-nav .nav-btn, .hub-nav .hub-logo { display: none; }
  .hub-nav .nav-btn.menu-btn-mobile { display: flex !important; }
  .hub-nav { justify-content: flex-end; height: 44px; padding: 0 0.8rem; background: var(--ink2); }
  .gold-display { font-size: 0.75rem; }
  .mobile-nav { display: block; }
  .hub-content { padding: 0.8rem 0.75rem; padding-bottom: 70px; }

  .create-panel {
    padding: 1.2rem 1rem; margin: 0;
    clip-path: none; border-radius: 0;
    min-height: 100dvh; overflow-y: auto;
    display: flex; flex-direction: column;
  }
  #screen-create { align-items: flex-start; }
  .create-title { font-size: 1.3rem; }
  .create-subtitle { font-size: 0.7rem; margin-bottom: 1rem; }
  .class-grid { grid-template-columns: repeat(2, 1fr); gap: 0.6rem; margin-bottom: 1rem; }
  .class-card { padding: 0.7rem; }
  .class-emoji { font-size: 1.8rem; }
  .class-name { font-size: 0.78rem; }
  .class-desc { font-size: 0.6rem; }

  .clan-grid { grid-template-columns: 1fr; gap: 0.8rem; }
  .ninja-card { clip-path: none; }

  .missions-layout { grid-template-columns: 1fr; gap: 1rem; }
  .mission-sidebar {
    position: fixed; bottom: 56px; left: 0; right: 0; z-index: 150;
    border-radius: 0; border-left: none; border-right: none; border-bottom: none;
    max-height: 55dvh; overflow-y: auto; padding: 0.8rem;
    background: var(--ink2); border-top: 2px solid rgba(201,162,39,0.25);
    transform: translateY(100%); transition: transform 0.25s ease;
  }
  .mission-sidebar.open { transform: translateY(0); }
  .mission-sidebar-handle {
    display: block; width: 40px; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.2); margin: 0 auto 0.8rem;
  }
  .deploy-fab {
    display: flex !important; position: fixed; bottom: 72px; right: 16px; z-index: 160;
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--blood); border: 2px solid rgba(192,57,43,0.6);
    align-items: center; justify-content: center; font-size: 1.4rem;
    box-shadow: 0 4px 20px rgba(139,26,26,0.5); cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .mission-type-icon { font-size: 1.5rem; width: 32px; }
  .mission-name { font-size: 0.85rem; }
  .mission-desc { font-size: 0.75rem; }

  .training-grid { grid-template-columns: 1fr 1fr; gap: 0.6rem; }
  .training-layout { grid-template-columns: 1fr !important; }
  .training-sidebar { position: static !important; width: 100% !important; margin-top: 1rem; }

  .shop-layout { grid-template-columns: 1fr; gap: 0.8rem; }
  .shop-grid { grid-template-columns: repeat(2, 1fr); gap: 0.6rem; }
  .shop-cart {
    position: static; transform: none; max-height: none;
    border: 1px solid rgba(201,162,39,0.25); border-radius: 0;
    margin-top: 0; padding: 1rem;
  }
  .shop-cart .mission-sidebar-handle { display: none !important; }
  .cart-fab { display: none !important; }

  .exchange-grid { grid-template-columns: repeat(2, 1fr); gap: 0.7rem; }
  .exchange-gold-amount { font-size: 1.8rem; }
  .exchange-card { padding: 1rem; }

  .modal-overlay { align-items: flex-end; padding: 0; }
  .modal {
    max-width: 100%; width: 100%; border-radius: 0;
    max-height: 90dvh;
    clip-path: none;
    padding: 1.2rem 1rem 1rem;
    border-bottom: none;
  }
  .modal {
    max-width: 100%; width: 100%; max-height: 92dvh; overflow-y: auto;
    border-radius: 0; clip-path: none;
    border-left: none; border-right: none; border-bottom: none;
    border-top: 2px solid rgba(201,162,39,0.3);
    padding: 1.2rem 1rem 1.5rem;
    padding-bottom: calc(1.5rem + env(safe-area-inset-bottom, 0));
    animation: slideUpModal 0.25s ease;
  }
  @keyframes slideUpModal { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-title { font-size: 1rem; }
  .modal-actions { flex-wrap: wrap; gap: 0.5rem; }
  .modal-btn { flex: 1; min-width: 0; text-align: center; padding: 0.6rem 0.5rem; font-size: 0.7rem; }

  .loadout-panel { grid-template-columns: 1fr; }

  .toast { left: 12px; right: 12px; max-width: none; font-size: 0.7rem; }

  .section-title { font-size: 0.6rem; }
}

/* Combat: full mobile layout */
@media (max-width: 700px) {
  #screen-combat { height: 100dvh; overflow: hidden; }
  .combat-layout { flex-direction: column; overflow: hidden; }
  .combat-sidebar-left, .combat-sidebar-right { display: none; }
  .combat-main { padding: 0; flex: 1; justify-content: flex-start; overflow: auto; }
  .combat-panel-toggle { display: block; }
  #combatCanvas { display: block; }
  .combat-header { padding: 0.3rem 0.6rem; gap: 0.3rem; flex-wrap: wrap; font-size: 0.58rem; }
  .turn-counter { font-size: 0.6rem; }

  .combat-controls {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 52px;
    gap: 0.3rem;
    padding: 0.5rem 0.5rem;
    padding-bottom: calc(0.5rem + env(safe-area-inset-bottom, 0px));
    background: rgba(8,8,20,0.97);
    border-top: 1px solid rgba(201,162,39,0.18);
  }
  .action-btn {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 0.25rem 0.2rem; font-size: 0.58rem;
    letter-spacing: 0.03em; clip-path: none;
    border-radius: 4px; min-height: 48px;
    gap: 2px; line-height: 1.2;
  }
  #btnMove::before    { content: '🦶'; font-size: 1.1rem; line-height: 1; }
  #btnAttack::before  { content: '⚔'; font-size: 1.1rem; line-height: 1; }
  #btnSpecial::before { content: '✦'; font-size: 1.1rem; line-height: 1; }
  #btnItem::before    { content: '🎒'; font-size: 1.1rem; line-height: 1; }
  #btnUndoMove::before   { content: '↩'; font-size: 1.1rem; line-height: 1; }
  #btnEndTurn::before    { content: '⊳'; font-size: 1.1rem; line-height: 1; }
  #btnPvpEndPhase::before{ content: '⚔'; font-size: 1.1rem; line-height: 1; }
  #btnMove .kbd-hint, #btnAttack .kbd-hint, #btnSpecial .kbd-hint,
  #btnItem .kbd-hint, #btnUndoMove .kbd-hint, #btnEndTurn .kbd-hint { display: none; }
  .combat-controls > div[style*="width:1px"] { display: none; }
  .facing-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 2px; }
  .facing-btn { width: 100%; height: 22px; font-size: 0.75rem; border-radius: 3px; }
  #btnEndTurn    { grid-column: span 2; background: rgba(61,170,125,0.15); border-color: rgba(61,170,125,0.4); color: var(--jade-bright); }
  #btnUndoMove   { grid-column: span 1; }
  #btnPvpEndPhase{ grid-column: span 2; }
  .kbd-hint { display: none; }
  #actionLabel { font-size: 0.55rem; }
  #facingLabel { font-size: 0.5rem; }
  #hoverInspect { display: none !important; }
  #actionModeBanner { font-size: 0.52rem; padding: 0.12rem 0.7rem; }
}

/* Medium phones / landscape */
@media (max-width: 480px) {
  .class-grid { grid-template-columns: 1fr 1fr; }
  .shop-grid { grid-template-columns: 1fr 1fr; }
  .training-grid { grid-template-columns: 1fr; }
  .exchange-grid { grid-template-columns: 1fr 1fr; }
  .menu-options { width: 240px; }
  .menu-btn { font-size: 0.75rem; padding: 0.8rem 1.2rem; }
  .hub-content { padding: 0.6rem 0.6rem; padding-bottom: 70px; }
}

/* Tiny phones */
@media (max-width: 360px) {
  .class-grid { grid-template-columns: 1fr; }
  .shop-grid { grid-template-columns: 1fr; }
  .action-btn { padding: 0.5rem 0.4rem; font-size: 0.55rem; min-width: 44px; }
  .facing-btn { width: 20px; height: 20px; font-size: 0.6rem; }
}
/* ── HONORS HALL ── */
.honors-hall { padding: 1rem 1.2rem 2rem; max-width: 900px; margin: 0 auto; }
.honors-title { font-family: 'Cinzel Decorative', serif; font-size: 1.1rem; color: var(--gold); text-align: center; letter-spacing: 0.12em; margin-bottom: 0.2rem; }
.honors-subtitle { text-align: center; font-size: 0.65rem; color: var(--mist); letter-spacing: 0.1em; margin-bottom: 1.4rem; opacity: 0.7; }
.honors-summary { display: flex; gap: 1.2rem; justify-content: center; margin-bottom: 1.4rem; flex-wrap: wrap; }
.honors-stat { background: rgba(201,162,39,0.07); border: 1px solid rgba(201,162,39,0.18); border-radius: 4px; padding: 0.4rem 1rem; text-align: center; }
.honors-stat-num { font-family: 'Cinzel', serif; font-size: 1.3rem; color: var(--gold); }
.honors-stat-lbl { font-size: 0.55rem; color: var(--mist); letter-spacing: 0.08em; text-transform: uppercase; }
.honors-category { margin-bottom: 1.6rem; }
.honors-cat-title { font-family: 'Cinzel', serif; font-size: 0.68rem; color: var(--gold); letter-spacing: 0.14em; text-transform: uppercase; border-bottom: 1px solid rgba(201,162,39,0.2); padding-bottom: 0.3rem; margin-bottom: 0.8rem; }
.badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 0.7rem; }
.badge-card { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; padding: 0.6rem 0.3rem; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 6px; cursor: default; transition: transform 0.15s, border-color 0.15s; position: relative; }
.badge-card.earned { border-color: rgba(201,162,39,0.35); background: rgba(201,162,39,0.06); }
.badge-card.earned:hover { transform: translateY(-2px); border-color: rgba(201,162,39,0.6); }
.badge-card.earned .badge-name { color: var(--gold); }
.badge-canvas { width: 60px; height: 60px; display: block; }
.badge-name { font-family: 'Cinzel', serif; font-size: 0.5rem; color: var(--mist); text-align: center; letter-spacing: 0.04em; line-height: 1.3; }
.badge-locked-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.55); border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; opacity: 0.6; }
.badge-tooltip { display: none; position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: rgba(10,10,18,0.97); border: 1px solid rgba(201,162,39,0.3); border-radius: 4px; padding: 0.4rem 0.6rem; font-size: 0.58rem; color: var(--mist); white-space: nowrap; z-index: 100; pointer-events: none; min-width: 120px; text-align: center; }
.badge-card:hover .badge-tooltip { display: block; }
.badge-card.earned .badge-tooltip { color: #ddd; }
@media (max-width: 600px) { .badge-grid { grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 0.5rem; } .badge-canvas { width: 52px; height: 52px; } }
/* ── Item/weapon PNG images ── */
/* Generic fill rule: every img or span inside an image-host div fills it */
.item-emoji,
.carry-slot-icon,
.stash-item-icon,
.aslot-img,
.wci-icon,
.ninja-avatar {
  overflow: hidden;
}

.item-emoji { display:flex; align-items:center; justify-content:center; }
.item-emoji img,
.item-emoji span[data-iimg] { width:100%; height:100%; object-fit:contain; display:block; }

.shop-item .item-emoji { width:52px; height:52px; flex-shrink:0; }

.carry-slot-icon {
  display:flex; align-items:center; justify-content:center;
  width:100%; flex:1; min-height:0;
}
.carry-slot-icon img,
.carry-slot-icon span[data-iimg] { width:100%; height:100%; object-fit:contain; display:block; }

.stash-item-icon {
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; width:36px; height:36px;
}
.stash-item-icon img,
.stash-item-icon span[data-iimg] { width:36px; height:36px; object-fit:contain; display:block; }

.aslot-img {
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; width:36px; height:36px;
}
.aslot-img img,
.aslot-img span[data-iimg] { width:36px; height:36px; object-fit:contain; display:block; }

/* Character avatar — emoji or PNG fills the full circle */
.ninja-avatar {
  position:relative;
  display:flex; align-items:center; justify-content:center;
}
.ninja-avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; display:block; }
.ninja-avatar span[data-iimg],
.ninja-avatar > span:not(.ninja-xp-ring) { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:inherit; }

.weapon-badge img,
.wpn-badge-img { vertical-align:middle; width:18px; height:18px; object-fit:contain; }
.wci-img { vertical-align:middle; width:22px; height:22px; object-fit:contain; }
[data-iimg] { display:inline-flex !important; align-items:center; justify-content:center; }
</style>
</head>
<body>

<div id="app">
  <!-- MAIN MENU -->
  <div id="screen-menu" class="screen active">
    <div class="menu-bg">
      <div class="menu-bg-kanji">忍</div>
      <div class="menu-bg-kanji">道</div>
      <div class="menu-bg-kanji">影</div>
    </div>
    <div class="menu-seal">🥷</div>
    <h1 class="menu-title">NINDO</h1>
    <div class="menu-subtitle">Shadow Arts · 影の技</div>
    <div class="menu-line"></div>
    <div class="menu-options">
      <button class="menu-btn primary" onclick="startGame()">▶ Begin Journey</button>
      <button class="menu-btn" onclick="loadGame()">◈ Continue</button>
      <button class="menu-btn" onclick="showScreen('pvp')" style="border-color:rgba(80,160,255,0.4);color:#88ccff">⚔ Online PvP</button>
      <button class="menu-btn" onclick="openCodex()">☰ Codex</button>
    </div>
    <div style="position:absolute;bottom:1.5rem;font-size:0.6rem;color:rgba(255,255,255,0.2);font-family:'Cinzel',serif;letter-spacing:0.3em">v1.0 · SHADOW ARTS EDITION</div>
  </div>

  <!-- CHARACTER CREATE -->
  <div id="screen-create" class="screen">
    <div class="create-panel">
      <h2 class="create-title">Forge Your Shadow</h2>
      <p class="create-subtitle">Choose your path · Select your discipline</p>
      <div class="class-grid" id="classGrid"></div>
      <input class="name-input" id="charName" placeholder="Enter your ninja name..." maxlength="20" />
      <div class="flex gap-1">
        <button class="confirm-btn" onclick="createCharacter()">⚡ Begin Training</button>
        <button class="modal-btn" style="margin-left:auto" onclick="showScreen('menu')">← Back</button>
      </div>
    </div>
  </div>

  <!-- HUB -->
  <div id="screen-hub" class="screen">
    <nav class="hub-nav">
      <div class="hub-logo">NIN<span>DO</span></div>
      <div id="lastSavedDisplay" style="font-family:Cinzel,serif;font-size:0.55rem;color:var(--mist);letter-spacing:0.05em;display:flex;align-items:center;gap:0.3rem;opacity:0.7"></div>
      <button class="nav-btn" onclick="showHubSection('clan')" id="nav-clan">Clan</button>
      <button class="nav-btn" onclick="showHubSection('recruit')" id="nav-recruit">Recruit</button>
      <button class="nav-btn" onclick="showHubSection('missions')" id="nav-missions">Missions</button>
      <button class="nav-btn" onclick="showHubSection('training')" id="nav-training">Training</button>
      <button class="nav-btn" onclick="showHubSection('jobs')" id="nav-jobs">Skills</button>
      <button class="nav-btn" onclick="showHubSection('weaponShop')" id="nav-weaponShop">Armory</button>
      <button class="nav-btn" onclick="showHubSection('itemShop')" id="nav-itemShop">Supplies</button>
      <button class="nav-btn" onclick="showHubSection('exchange')" id="nav-exchange">Exchange</button>
      <button class="nav-btn" onclick="showHubSection('honors')" id="nav-honors">Honors</button>
      <button class="nav-btn" onclick="openCodex()" id="nav-codex">Codex</button>
      <button onclick="saveGame(false)" title="Save game" style="background:transparent;border:1px solid rgba(255,255,255,0.1);color:var(--mist);font-family:'Cinzel',serif;font-size:0.6rem;letter-spacing:0.08em;padding:0.25rem 0.7rem;cursor:pointer;transition:all 0.2s" onmouseover="this.style.borderColor='rgba(201,162,39,0.4)';this.style.color='var(--gold)'" onmouseout="this.style.borderColor='rgba(255,255,255,0.1)';this.style.color='var(--mist)'">&#128190; Save</button>
      <div class="gold-display">⚜ <span id="goldDisplay">0</span> Gold</div>
      <button class="nav-btn menu-btn-mobile" onclick="showScreen('menu')" style="margin-left:0.5rem;color:var(--blood)">⬡ Menu</button>
    </nav>
    <div class="hub-content">
      <div id="section-clan" class="hub-section"></div>
      <div id="section-recruit" class="hub-section"></div>
      <div id="section-missions" class="hub-section"></div>
      <div id="section-training" class="hub-section"></div>
      <div id="section-jobs" class="hub-section"></div>
      <div id="section-weaponShop" class="hub-section"></div>
      <div id="section-itemShop" class="hub-section"></div>
      <div id="section-exchange" class="hub-section"></div>
      <div id="section-codex" class="hub-section" style="display:none!important"></div>
      <div id="section-honors" class="hub-section"></div>
    </div>
    <!-- Mobile bottom nav -->
    <nav class="mobile-nav" id="mobileNav">
      <div class="mobile-nav-inner">
        <button class="mob-nav-btn" id="mob-clan" onclick="showHubSection('clan')"><span class="icon">🥷</span>Clan</button>
        <button class="mob-nav-btn" id="mob-recruit" onclick="showHubSection('recruit')"><span class="icon">⊕</span>Recruit</button>
        <button class="mob-nav-btn" id="mob-missions" onclick="showHubSection('missions')"><span class="icon">⚔️</span>Missions</button>
        <button class="mob-nav-btn" id="mob-training" onclick="showHubSection('training')"><span class="icon">☯️</span>Train</button>
        <button class="mob-nav-btn" id="mob-jobs" onclick="showHubSection('jobs')"><span class="icon">★</span>Skills</button>
        <button class="mob-nav-btn" id="mob-weaponShop" onclick="showHubSection('weaponShop')"><span class="icon">🗡️</span>Armory</button>
        <button class="mob-nav-btn" id="mob-itemShop" onclick="showHubSection('itemShop')"><span class="icon">🧪</span>Supply</button>
        <button class="mob-nav-btn" id="mob-exchange" onclick="showHubSection('exchange')"><span class="icon">💰</span>Shop</button>
        <button class="mob-nav-btn" id="mob-codex" onclick="openCodex()"><span class="icon">📜</span>Codex</button>
        <button class="mob-nav-btn" id="mob-honors" onclick="showHubSection('honors')"><span class="icon">🏅</span>Honors</button>
      </div>
    </nav>
  </div>

  <!-- COMBAT -->
  <div id="screen-combat" class="screen">
    <div class="combat-header">
      <span style="font-size:0.85rem;color:var(--gold);font-family:'Cinzel Decorative',serif;letter-spacing:0.1em">NINDO</span>
      <div class="turn-counter" id="turnDisplay">Turn 1</div>
      <div class="phase-indicator">
        <div class="phase-dot" id="phaseDot"></div>
        <span id="phaseDisplay" style="font-size:0.65rem">Player Phase</span>
      </div>
      <span id="missionNameDisplay" style="color:var(--steel);font-size:0.62rem;letter-spacing:0.05em;opacity:0.8"></span>
      <span id="objectiveDisplay" style="font-family:'Cinzel',serif;font-size:0.6rem;padding:0 0.3rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
      <div id="ctQueue" style="display:flex;gap:2px;align-items:center;overflow:hidden;max-width:260px"></div>
      <button class="nav-btn" onclick="confirmFleeMission()" style="margin-left:auto;color:var(--crimson);flex-shrink:0">✗ Retreat</button>
    </div>
    <div class="combat-layout" style="position:relative">
      <div class="combat-sidebar-left">
        <div class="sidebar-label">Allies</div>
        <div id="allyList"></div>
        <div style="margin-top:0.5rem;border-top:1px solid rgba(255,255,255,0.05);padding-top:0.4rem">
          <div class="sidebar-label">CT</div>
          <div id="ctBars" style="padding:0.1rem 0"></div>
        </div>
      </div>
      <div class="combat-main" id="combatMainArea" style="position:relative">
        <!-- Mobile panel toggles -->
        <button class="combat-panel-toggle left" onclick="toggleCombatPanel('left')">🥷 Allies</button>
        <button class="combat-panel-toggle right" onclick="toggleCombatPanel('right')">⚔ Log</button>
        <!-- Mobile overlay panels -->
        <div class="combat-overlay-panel left-panel" id="combatPanelLeft">
          <button class="close-panel-btn" onclick="closeCombatPanel('left')">✕ Close</button>
          <div class="section-title" style="font-size:0.55rem">Allies</div>
          <div id="allyListMobile"></div>
          <div class="separator"></div>
          <div class="section-title" style="font-size:0.55rem">Selected</div>
          <div id="selectedInfoMobile"></div>
        </div>
        <div class="combat-overlay-panel right-panel" id="combatPanelRight">
          <button class="close-panel-btn" onclick="closeCombatPanel('right')">✕ Close</button>
          <div class="section-title" style="font-size:0.55rem">Enemies</div>
          <div id="enemyListMobile"></div>
          <div class="separator"></div>
          <div class="section-title" style="font-size:0.55rem">Battle Log</div>
          <div class="combat-log" id="combatLogMobile" style="height:160px"></div>
        </div>
        <!-- Phase transition banner -->
        <div id="phaseBanner">
          <div class="phase-banner-inner" id="phaseBannerText"></div>
        </div>
        <!-- Action mode banner (top-center of canvas) -->
        <div id="actionModeBanner"></div>
        <!-- Turn summary (bottom-center, fades in on end turn) -->
        <div id="turnSummary"></div>
        <div id="combatScrollWrap" style="overflow:auto;width:100%;height:100%;display:flex;align-items:flex-start;justify-content:flex-start;">
          <canvas id="combatCanvas" style="flex-shrink:0;display:block;cursor:crosshair;"></canvas>
        </div>
      </div>
      <div class="combat-sidebar-right">
        <div class="sidebar-label">Enemies</div>
        <div id="enemyList"></div>
        <div style="margin-top:0.5rem;border-top:1px solid rgba(255,255,255,0.05);padding-top:0.4rem;flex:1;display:flex;flex-direction:column;min-height:0">
          <div class="sidebar-label">Log</div>
          <div class="combat-log-mini" id="combatLog"></div>
        </div>
      </div>
      <!-- HIDDEN legacy: selectedInfo lives here but is not shown in sidebar anymore — used by JS -->
      <div id="selectedInfo" style="display:none"></div>
    </div>
    <div class="combat-controls">
      <div class="controls-active-label" id="controlsActiveLabel"></div>
      <button class="action-btn" id="btnMove" onclick="setAction('move')">⊕ Move<span class="kbd-hint">M</span></button>
      <button class="action-btn attack" id="btnAttack" onclick="setAction('attack')">⚔ Attack<span class="kbd-hint">A</span></button>
      <button class="action-btn special" id="btnSpecial" onclick="setAction('special')">✦ Special<span class="kbd-hint">S</span></button>
      <button class="action-btn" id="btnItem" onclick="setAction('item')">⊛ Item<span class="kbd-hint">I</span></button>
      <button class="action-btn special" id="btnObjective" onclick="performObjectiveAction()" style="display:none;border-color:rgba(255,140,0,0.5);color:#ffaa33">⚑ Objective</button>
      <button id="btnDiscardWeapon" onclick="combatDiscardWeapon()" style="display:none;background:transparent;border:1px solid rgba(255,255,255,0.15);color:var(--mist);font-family:'Cinzel',serif;font-size:0.6rem;letter-spacing:0.05em;padding:0.35rem 0.7rem;cursor:pointer;transition:all 0.2s" onmouseover="this.style.background='rgba(192,57,43,0.12)'" onmouseout="this.style.background='transparent'">✕ Discard Weapon</button>
      <div style="width:1px;height:28px;background:rgba(255,255,255,0.1)"></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:1px">
        <button class="facing-btn" id="facingN" onclick="setFacing('north')" title="Face North">▲</button>
        <div style="display:flex;gap:1px">
          <button class="facing-btn" id="facingW" onclick="setFacing('west')" title="Face West">◀</button>
          <button class="facing-btn" id="facingS" onclick="setFacing('south')" title="Face South">▼</button>
          <button class="facing-btn" id="facingE" onclick="setFacing('east')" title="Face East">▶</button>

function initWeapon(templateWeapon, typeKey) {
  const w = { ...templateWeapon, type: typeKey };
  w.usesLeft = WEAPON_USES[w.tier] || 20;
  if (typeKey === 'thrown') w.ammo = THROWN_COUNTS[w.tier] || 5;
  if (typeKey === 'ranged') { w.ammo = QUIVER_SIZES[w.tier] || 10; w.quiverEmpty = false; }
  return w;
}

function migrateWeapon(w) {
  if (!w) return w;
  if (w.usesLeft === undefined) w.usesLeft = WEAPON_USES[w.tier] || 20;
  if (!w.type) w.type = Object.keys(WEAPONS).find(k => WEAPONS[k].items.find(i => i.id === w.id)) || 'blades';
  if (w.type === 'thrown' && w.ammo === undefined) w.ammo = THROWN_COUNTS[w.tier] || 5;
  if (w.type === 'ranged' && w.ammo === undefined) { w.ammo = QUIVER_SIZES[w.tier] || 10; w.quiverEmpty = false; }
  return w;
}

function consumeWeaponUse(ally, count) {
  count = count || 1;
  const w = ally.weapon;
  if (!w) return false;
  if (w.type === 'thrown') {
    w.ammo = Math.max(0, (w.ammo || 1) - count);
    if (w.ammo <= 0) {
      addLog(ally.name + "'s " + w.name + " — last projectile used. Destroyed!", 'system');
      ally.weapon = null;
      const gn = GS.clan.find(x => x.id === ally.id);
      if (gn) gn.weapon = null;
      return true;
    }
    return false;
  }
  if (w.type === 'ranged') {
    w.ammo = Math.max(0, (w.ammo || 1) - count);
    if (w.ammo <= 0) {
      w.quiverEmpty = true;
      addLog(ally.name + "'s " + w.name + " — quiver empty! Bow unusable.", 'system');
    }
    return false;
  }
  w.usesLeft = Math.max(0, (w.usesLeft || 1) - count);
  if (w.usesLeft <= 0) {
    addLog(ally.name + "'s " + w.name + " — weapon broken!", 'system');
    ally.weapon = null;
    const gn = GS.clan.find(x => x.id === ally.id);
    if (gn) gn.weapon = null;
    return true;
  }
  return false;
}

function weaponUsable(ally) {
  const w = ally.weapon;
  if (!w) return false;
  if (w.type === 'ranged' && w.quiverEmpty) return false;
  return true;
}

function weaponStatusLabel(w) {
  if (!w) return 'Unarmed';
  if (w.type === 'thrown') return w.ammo + ' left';
  if (w.type === 'ranged') return w.quiverEmpty ? 'Empty quiver' : w.ammo + ' arrows';
  return w.usesLeft + ' uses left';
}
