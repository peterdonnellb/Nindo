function renderRecruitShop() {
  const el = document.getElementById('section-recruit');
  if (!el) return;

  // Generate roster if empty or expired
  if (!GS.recruitRoster || !GS.recruitRoster.length) {
    generateRecruitRoster();
  }

  const now = Date.now();
  const timeLeft = Math.max(0, GS.recruitNextRefresh - now);
  const mins = Math.floor(timeLeft / 60000);
  const secs = Math.floor((timeLeft % 60000) / 1000);
  const timerStr = mins > 0 ? mins + 'm ' + secs + 's' : secs + 's';

  const clanSize = GS.clan.length;
  const maxClan = 12;

  const rosterCards = GS.recruitRoster.map(n => {
    const cls = CLASSES[n.class];
    const canAfford = GS.gold >= n.hireCost;
    const clanFull = clanSize >= maxClan;
    const alreadyHired = GS.clan.some(c => c.name === n.name);
    const blocked = clanFull || alreadyHired;
    const tierC = n.level >= 5 ? 'var(--tier-legendary)' : n.level >= 3 ? 'var(--tier-uncommon)' : 'var(--tier-common)';

    return '<div style="background:var(--ink2);border:1px solid rgba(255,255,255,0.07);padding:1rem;display:flex;flex-direction:column;gap:0.5rem">'
      + '<div style="display:flex;align-items:center;gap:0.7rem">'
      + '<div style="font-size:1.8rem;background:' + cls.color + '22;border:1px solid ' + cls.color + ';width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0">' + cls.emoji + '</div>'
      + '<div style="flex:1">'
      + '<div style="font-family:Cinzel,serif;font-size:0.85rem">' + n.name + '</div>'
      + '<div style="font-size:0.65rem;color:' + cls.color + '">' + cls.name + '</div>'
      + '<div style="font-size:0.6rem;color:' + tierC + '">Level ' + n.level
      + (n.weapon ? ' · ' + n.weapon.icon + ' ' + n.weapon.name : '') + '</div>'
      + '</div>'
      + '<div style="text-align:right">'
      + '<div style="font-family:Cinzel,serif;font-size:0.85rem;color:' + (canAfford && !blocked ? 'var(--gold)' : 'var(--mist)') + '">G ' + n.hireCost + '</div>'
      + '</div>'
      + '</div>'
      + '<div style="font-size:0.62rem;color:var(--mist);font-style:italic">"' + n.hireTrait + '"</div>'
      + '<div style="display:flex;gap:0.5rem;flex-wrap:wrap">'
      + '<span style="font-size:0.58rem;color:var(--crimson-bright)">HP ' + n.hp + '</span>'
      + '<span style="font-size:0.58rem;color:#88aaff">CHI ' + n.chi + '</span>'
      + '<span style="font-size:0.58rem;color:var(--jade-bright)">SPD ' + (CLASSES[n.class].baseStats.spd || 5) + '</span>'
      + '<span style="font-size:0.58rem;color:var(--steel)">✦ ' + n.specialMove.name + '</span>'
      + '</div>'
      + (blocked
        ? '<div style="font-size:0.6rem;color:var(--mist)">' + (clanFull ? 'Clan is full (max ' + maxClan + ').' : 'Already in clan.') + '</div>'
        : '<button class="nav-btn' + (canAfford ? ' confirm' : '') + '" '
          + (canAfford ? '' : 'disabled style="opacity:0.4" ')
          + 'onclick="hireNinja(\'' + n.id + '\')">'
          + (canAfford ? 'Hire for G ' + n.hireCost : 'Need G ' + n.hireCost) + '</button>'
      )
      + '</div>';
  }).join('');

  el.innerHTML = '<div class="section-title">Shadow Tavern · Recruitment</div>'
    + renderRepWidget()
    + '<div style="display:flex;align-items:center;gap:0.8rem;margin-bottom:1rem;flex-wrap:wrap">'
    + '<div class="text-xs text-mist">Clan: ' + clanSize + '/' + maxClan + ' ninja</div>'
    + '<div class="text-xs text-mist">Auto-refresh in: <span style="color:var(--gold)">' + timerStr + '</span></div>'
    + '<button class="nav-btn" onclick="refreshRecruitRoster()">↺ Refresh (G ' + RECRUIT_REFRESH_COST + ')</button>'
    + '<button class="nav-btn confirm" onclick="openCustomRecruitModal()" style="margin-left:auto">⊕ Custom Recruit (G ' + RECRUIT_BASE_COST + ')</button>'
    + '</div>'
    + (GS.recruitRoster.length
      ? '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:0.8rem">' + rosterCards + '</div>'
      : '<div class="text-xs text-mist">No recruits available. Click Refresh to bring in new candidates.</div>'
    );
}


// Jump to Missions section with this ninja pre-selected in the party
function _quickDeployNinja(ninjaId) {
  // Add to party if not already in it (up to 3)
  if (!selectedParty.includes(ninjaId)) {
    if (selectedParty.length < 3) {
      selectedParty.push(ninjaId);
    } else {
      // Replace last party member
      selectedParty[selectedParty.length - 1] = ninjaId;
    }
  }
  showHubSection('missions');
}

function healAllClan() {
  const toHeal = GS.clan.filter(n => !n.training && n.hp < n.maxHp);
  if (!toHeal.length) { toast('All ninja are already at full HP.', 'error'); return; }
  const cost = toHeal.reduce((sum, n) => sum + Math.max(5, Math.floor((n.maxHp - n.hp) * 0.2)), 0);
  if (GS.gold < cost) { toast(`Not enough gold! Need G${cost} to heal all.`, 'error'); return; }
  GS.gold -= cost;
  toHeal.forEach(n => { n.hp = n.maxHp; });
  updateGoldDisplay();
  saveGame();
  toast(`✚ All ninja healed to full HP (G${cost} spent).`, 'success');
  renderClan();
}

function renderClan() {
  const el = document.getElementById('section-clan');
  const clanCards = GS.clan.map(n => ninjaCard(n)).join('');

  // Readiness summary
  const total = GS.clan.length;
  const ready = GS.clan.filter(n => !n.training && n.hp >= n.maxHp * 0.5).length;
  const injured = GS.clan.filter(n => !n.training && n.hp < n.maxHp * 0.5).length;
  const training = GS.clan.filter(n => n.training).length;
  const unarmed = GS.clan.filter(n => !n.weapon && !n.training).length;
  const unarmored = GS.clan.filter(n => !n.equippedArmor && !n.training).length;
  const healCost = GS.clan.filter(n => !n.training && n.hp < n.maxHp).reduce((sum, n) => {
    const missing = n.maxHp - n.hp;
    return sum + Math.max(5, Math.floor(missing * 0.2));
  }, 0);
  const anyInjured = GS.clan.some(n => !n.training && n.hp < n.maxHp);
  const avgLevel = total ? (GS.clan.reduce((s, n) => s + (n.level || 1), 0) / total).toFixed(1) : '—';

  el.innerHTML = `
    <div class="section-title">Clan Roster · ${total} Shadow${total !== 1 ? 's' : ''}</div>
    ${renderRepWidget()}
    <div class="readiness-bar">
      <div class="readiness-stat">⚔ <span class="val">${total}</span> ninja</div>
      <div class="readiness-stat">✓ <span class="val ${ready < total - training ? 'warn' : ''}">${ready}</span> ready</div>
      ${injured ? `<div class="readiness-stat">🩸 <span class="val warn">${injured}</span> injured</div>` : ''}
      ${training ? `<div class="readiness-stat">⌛ <span class="val">${training}</span> training</div>` : ''}
      ${unarmed ? `<div class="readiness-stat">⚠ <span class="val warn">${unarmed}</span> unarmed</div>` : ''}
      ${unarmored ? `<div class="readiness-stat">🛡 <span class="val warn">${unarmored}</span> unarmored</div>` : ''}
      <div class="readiness-stat" style="margin-left:auto">★ Avg Lv <span class="val">${avgLevel}</span></div>
      ${anyInjured ? `<button class="heal-all-btn" onclick="healAllClan()" style="margin-left:0.5rem" title="Spend gold to heal all injured ninja to full HP (G${healCost})">✚ Heal All · G${healCost}</button>` : ''}
    </div>
    <div class="clan-grid">
      ${clanCards}
      <div class="add-ninja-card" onclick="showHubSection('recruit')">
        <span style="font-size:2rem">⊕</span>
        <span class="font-cinzel text-xs text-mist">Recruit a Ninja</span>
      </div>
    </div>
  `;
}

function ninjaCard(n) {
  const cls = CLASSES[n.class];
  const hpPct = Math.round((n.hp / n.maxHp) * 100);
  const stmPct = Math.round((n.stamina / n.maxStamina) * 100);
  const chiPct = Math.round((n.chi / n.maxChi) * 100);
  const xpPct = Math.round((n.exp / n.expToNext) * 100);
  const jobData = getNinjaJobData(n);
  const trainingInfo = n.training ? `<div style="margin-top:0.5rem"><span class="training-badge">⌛ ${n.training.type} · ${getTrainingTimeLeft(n)}</span></div>` : '';
  const wpnBadge = n.weapon
    ? `<span class="weapon-badge" style="border-color:${tierColor(n.weapon.tier)};color:${tierColor(n.weapon.tier)}">${itemImgAsync(n.weapon,"16px","vertical-align:middle","wpn-badge-img")} ${n.weapon.name}</span>`
    : `<span class="weapon-badge" style="border-color:rgba(255,255,255,0.1);color:var(--mist)">✕ Unarmed</span>`;
  const armorBadge = n.equippedArmor
    ? `<span class="weapon-badge" style="border-color:${tierColor(n.equippedArmor.tier)};color:${tierColor(n.equippedArmor.tier)}">${n.equippedArmor.icon} ${n.equippedArmor.name}</span>`
    : `<span class="weapon-badge" style="border-color:rgba(255,255,255,0.05);color:rgba(255,255,255,0.25)">🛡 No Armor</span>`;
  const hpColor = hpPct > 60 ? '#e74c3c' : hpPct > 30 ? '#ddaa00' : '#cc2222';
  const accentColor = cls.color;

  return `
    <div class="ninja-card ${n.training ? 'training' : ''}" onclick="openNinjaDetail('${n.id}')" style="--card-accent:${accentColor}">
      <div class="ninja-card-header">
        <div class="ninja-avatar" style="background:${accentColor}22;border-color:${accentColor}">
          ${classImgOrEmoji(n.class, 36)}
          <div class="ninja-xp-ring" style="--xp-pct:${xpPct * 3.6}deg"></div>
        </div>
        <div class="ninja-info">
          <div class="ninja-name">${n.name}${n.training ? ' <span style="font-size:0.55rem;color:var(--gold);opacity:0.7">⌛</span>' : ''}</div>
          <div class="ninja-class">${cls.name}</div>
          <div class="ninja-level-row">
            <span class="ninja-lvl-badge">Lv ${n.level}</span>
            <div class="ninja-xp-bar-wrap">
              <div class="ninja-xp-bar-track"><div class="ninja-xp-bar-fill" style="width:${xpPct}%"></div></div>
              <div class="ninja-xp-label">${n.exp} / ${n.expToNext} XP</div>
            </div>
          </div>
          <div style="font-size:0.55rem;color:rgba(201,162,39,0.6);margin-top:2px;font-family:'Cinzel',serif">SP Lv ${jobData.level} · ${jobData.jp} pts</div>
        </div>
      </div>
      <div class="stat-bars">
        <div class="stat-row"><span class="stat-label">HP</span><div class="stat-bar"><div class="stat-fill hp" style="width:${hpPct}%;background:linear-gradient(90deg,${hpColor},${hpColor}cc)"></div></div><span class="stat-val">${n.hp}/${n.maxHp}</span></div>
        <div class="stat-row"><span class="stat-label">STM</span><div class="stat-bar"><div class="stat-fill stamina" style="width:${stmPct}%"></div></div><span class="stat-val">${n.stamina}/${n.maxStamina}</span></div>
        <div class="stat-row"><span class="stat-label">CHI</span><div class="stat-bar"><div class="stat-fill chi" style="width:${chiPct}%"></div></div><span class="stat-val">${n.chi}/${n.maxChi}</span></div>
      </div>
      <div class="ninja-card-footer" style="margin-top:0.7rem;flex-direction:column;gap:0.3rem">
        <div style="display:flex;gap:0.4rem;flex-wrap:wrap">${wpnBadge}${armorBadge}</div>
        ${trainingInfo}
        ${!n.training ? `<button onclick="event.stopPropagation();_quickDeployNinja('${n.id}')" style="background:transparent;border:1px solid rgba(139,26,26,0.4);color:var(--crimson);font-family:'Cinzel',serif;font-size:0.55rem;letter-spacing:0.1em;padding:0.2rem 0.5rem;cursor:pointer;align-self:flex-end;transition:all 0.15s" onmouseover="this.style.background='rgba(139,26,26,0.15)'" onmouseout="this.style.background='transparent'" title="Jump to Missions with this ninja selected">⚔ Deploy</button>` : ''}
      </div>
      <div class="special-move-info" style="margin-top:0.6rem">
        <div class="special-move-name">✦ ${n.specialMove.name} <span style="color:rgba(136,170,255,0.6);font-size:0.6rem">χ${n.specialMove.chi}</span></div>
        <div class="special-move-desc">${n.specialMove.desc}</div>
      </div>
    </div>
  `;
}

function tierColor(tier) {
  return { common: 'var(--tier-common)', uncommon: 'var(--tier-uncommon)', rare: 'var(--tier-rare)', legendary: 'var(--tier-legendary)', epic: 'var(--tier-epic)' }[tier] || '#fff';
}

function openNinjaDetail(id) {
  _loadoutNinjaId = id;
  renderLoadoutModal(id);
}

let _loadoutNinjaId = null;

// Refresh the missions party panel immediately if that section is currently visible.
// Called after any loadout change (equip/unequip weapon, add/remove item) so party
// slot badges update without requiring the player to navigate away and back.
function _refreshMissionsIfActive() {
  const mSection = document.getElementById('section-missions');
  if (mSection && mSection.classList.contains('active')) {
    renderMissions();
  }
}

function renderLoadoutModal(id) {
  const n = GS.clan.find(x => x.id === id);
  if (!n) return;
  const cls = CLASSES[n.class];
  if (!n.carriedItems) n.carriedItems = [];

  // Weapon list: currently equipped + weapon stash
  const weaponList = buildWeaponChoiceHTML(n);
  // Carry grid
  const carryHTML = buildCarryGridHTML(n);
  // Stash items
  const stashHTML = buildStashItemsHTML(n);
  // Use items outside combat
  const useHTML = buildUseItemsHTML(n);

  const body = `
    <div style="font-size:0.78rem;color:var(--mist);margin-bottom:0.4rem">
      Lv${n.level} · HP ${n.hp}/${n.maxHp} · Chi ${n.chi}/${n.maxChi} · STM ${n.stamina}/${n.maxStamina}
    </div>
    <div style="font-size:0.72rem;color:var(--steel);margin-bottom:0.2rem">
      ✦ <b>${n.specialMove.name}</b> — ${n.specialMove.desc}
    </div>
    <div style="font-size:0.65rem;color:var(--gold);margin-bottom:0.5rem">
      ${(() => { const s = getEquippedSlots(n); const parts = [];
        if (s.reaction && JOB_ABILITIES[s.reaction]) parts.push('⚡ ' + JOB_ABILITIES[s.reaction].name);
        if (s.support && JOB_ABILITIES[s.support]) parts.push('🛡 ' + JOB_ABILITIES[s.support].name);
        if (s.movement && JOB_ABILITIES[s.movement]) parts.push('👟 ' + JOB_ABILITIES[s.movement].name);
        return parts.length ? parts.join(' · ') : 'No abilities equipped'; })()}
    </div>
    <div class="loadout-panel">
      <div>
        <div class="loadout-section-title">⚔ Weapon Slot</div>
        ${weaponList}
      </div>
      <div>
        ${carryHTML}
        <div class="loadout-section-title" style="margin-top:0.8rem">From Stash</div>
        ${stashHTML}
      </div>
    </div>
    ${useHTML}
  `;
  openModal(`${cls.emoji} ${n.name} — ${cls.name}`, body,
    [{ label: 'Done', fn: () => {
      closeModal();
      renderClan();
      saveGame();
      // Refresh mission party cards immediately so loadout changes show
      _refreshMissionsIfActive();
    }, cls: 'confirm' }]
  );
}

function buildWeaponChoiceHTML(n) {
  const stash = GS.weaponStash || [];
  let html = '';

  // Unequip option
  if (n.weapon) {
    html += `<div class="weapon-choice-item unequip-slot" onclick="ninjaUnequipWeapon('${n.id}')">
      <div class="wci-tier" style="background:rgba(255,255,255,0.1)"></div>
      <div class="wci-info"><div class="wci-name">— Unequip (return to stash)</div></div>
    </div>`;
  }

  // Currently equipped
  if (n.weapon) {
    const ew = n.weapon;
    const eStatus = weaponStatusLabel(ew);
    const eBroken = ew.quiverEmpty || ew.usesLeft <= 0 || ew.ammo <= 0;
    const eWarning = ew.quiverEmpty ? ' style="color:var(--crimson)"' : (ew.usesLeft <= 5 || ew.ammo <= 2 ? ' style="color:#ddaa00"' : '');
    const discardBtn = eBroken
      ? `<button onclick="ninjaDiscardWeapon('${n.id}')" style="font-size:0.55rem;background:rgba(192,57,43,0.15);border:1px solid rgba(192,57,43,0.4);color:var(--crimson-bright);padding:0.15rem 0.4rem;cursor:pointer;font-family:Cinzel,serif;margin-top:0.3rem">✕ Discard</button>`
      : '';
    html += `<div class="weapon-choice-item equipped-now">
      <div class="wci-tier" style="background:${tierColor(ew.tier)}"></div>
      <div class="wci-icon" style="width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center">${itemImgAsync(ew,'28px','object-fit:contain;display:block')}</div>
      <div class="wci-info">
        <div class="wci-name">${ew.name} ✓${eBroken ? ' <span style="color:var(--crimson);font-size:0.55rem">DEPLETED</span>' : ''}</div>
        <div class="wci-stats">DMG ${ew.dmg[0]}-${ew.dmg[1]}${ew.range ? ' · Range '+ew.range : ''} · ${ew.tier.toUpperCase()}<br><span${eWarning}>${eStatus}</span></div>
        ${discardBtn}
      </div>
    </div>`;
  }

  // Stash weapons
  stash.forEach((w, i) => {
    const sStatus = weaponStatusLabel(w);
    const sBroken = w.quiverEmpty || w.usesLeft <= 0 || w.ammo <= 0;
    const sCanUse = ninjaCanUseWeapon(n, w);
    // Sell button always shown; discard only for broken
    const sDiscardBtn = sBroken
      ? `<button onclick="event.stopPropagation();stashDiscardWeapon(${i})" style="font-size:0.55rem;background:rgba(192,57,43,0.15);border:1px solid rgba(192,57,43,0.4);color:var(--crimson-bright);padding:0.15rem 0.4rem;cursor:pointer;font-family:Cinzel,serif;margin-top:0.3rem">✕ Discard</button>`
      : '';
    const _sSellBase = (WEAPON_SELL_PRICE || {})[w.tier] || 15;
    const _sSellFinal = sBroken ? Math.floor(_sSellBase * 0.5) : _sSellBase;
    const sSellBtn = '<button onclick="event.stopPropagation();stashSellWeapon(' + i + ')" style="font-size:0.55rem;background:rgba(201,162,39,0.12);border:1px solid rgba(201,162,39,0.35);color:var(--gold);padding:0.15rem 0.5rem;cursor:pointer;font-family:Cinzel,serif;margin-top:0.3rem;margin-left:0.2rem" onmouseover="this.style.background=\'rgba(201,162,39,0.22)\'" onmouseout="this.style.background=\'rgba(201,162,39,0.12)\'">&#9837; Sell ' + _sSellFinal + 'G</button>';
    const sSellPrice = (window.WEAPON_SELL_PRICE || {})[w.tier] || 15;
    const sSellFinal = sBroken ? Math.floor(sSellPrice * 0.5) : sSellPrice;
    const sRestricted = !sCanUse && !sBroken;
    const sClickable = !sBroken && sCanUse;
    html += `<div class="weapon-choice-item" style="opacity:${sRestricted ? '0.45' : '1'}" ${sClickable ? `onclick="ninjaEquipWeapon('${n.id}', ${i})"` : ''}>
      <div class="wci-tier" style="background:${tierColor(w.tier)}"></div>
      <div class="wci-icon" style="width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center">${itemImgAsync(w,'28px','object-fit:contain;display:block')}</div>
      <div class="wci-info">
        <div class="wci-name">${w.name}${sBroken ? ' <span style="color:var(--crimson);font-size:0.55rem">DEPLETED</span>' : ''}${sRestricted ? ' <span style="color:var(--mist);font-size:0.5rem">🔒 Class locked</span>' : ''}</div>
        <div class="wci-stats">DMG ${w.dmg[0]}-${w.dmg[1]}${w.range ? ' · Range '+w.range : ''} · ${w.tier.toUpperCase()} · ${WEAPONS[w.type]?.label || w.type}<br><span style="color:var(--mist)">${sStatus}</span></div>
        ${sDiscardBtn}${sSellBtn}
      </div>
    </div>`;
  });

  if (!n.weapon && stash.length === 0) {
    html = '<div class="text-xs text-mist">No weapons available. Visit the Armory.</div>';
  }
  return `<div class="weapon-choice-list">${html}</div>`;
}

function buildCarryGridHTML(n) {
  // \u2500\u2500 Armor slot \u2014 compact horizontal strip \u2500\u2500
  let html = '<div class="loadout-section-title">\u{1F6E1} Body Armor</div>';
  if (n.equippedArmor) {
    const a = n.equippedArmor;
    const dur = a.durability !== undefined ? a.durability : (ARMOR_DURABILITY[a.tier] || 5);
    const maxDur = a.maxDurability || ARMOR_DURABILITY[a.tier] || 5;
    const durCol = dur <= 2 ? 'var(--crimson-bright)' : dur <= Math.ceil(maxDur / 2) ? '#ddaa00' : 'var(--jade-bright)';
    html += '<div class="armor-slot-strip filled" onclick="unequipArmor(\'' + n.id + '\')" title="' + a.name + ' \u2014 click to unequip" style="border-color:' + tierColor(a.tier) + '44">'
      + '<div class="aslot-img">' + itemImgAsync(a, '28px') + '</div>'
      + '<div class="aslot-info">'
      + '<div class="aslot-name" style="color:' + tierColor(a.tier) + '">' + a.name + '</div>'
      + '<div class="aslot-dur" style="color:' + durCol + '">' + dur + '/' + maxDur + ' \u{1F6E1} durability</div>'
      + '</div>'
      + '<div class="aslot-unequip">\u2715 unequip</div></div>';
  } else {
    html += '<div class="armor-slot-strip" style="opacity:0.45;cursor:default">'
      + '<div class="aslot-img" style="opacity:0.3">\u{1F6E1}</div>'
      + '<div class="aslot-info"><div class="aslot-name" style="color:var(--mist)">No armor equipped</div>'
      + '<div class="aslot-dur" style="color:var(--mist)">Equip from stash below</div></div></div>';
  }
  // \u2500\u2500 Field kit \u2500\u2500
  html += '<div class="loadout-section-title" style="margin-top:0.7rem">\u{1F392} Field Kit <span style="color:var(--mist);font-size:0.58rem;font-family:sans-serif;font-weight:normal">' + n.carriedItems.length + '/' + MAX_CARRY + '</span></div>';
  html += '<div class="carry-grid">';
  for (let i = 0; i < MAX_CARRY; i++) {
    const item = n.carriedItems[i];
    if (item) {
      html += '<div class="carry-slot filled" title="' + item.name + ' \u2014 click to remove" onclick="removeItemFromCarry(\'' + n.id + '\', ' + i + ')">'
        + '<div class="carry-slot-icon">' + itemImgAsync(item, '26px') + '</div>'
        + '<div class="carry-slot-label">' + item.name.split(' ')[0] + '</div>'
        + '<div class="carry-slot-remove">\u2715</div></div>';
    } else {
      html += '<div class="carry-slot"><div class="carry-empty">+</div></div>';
    }
  }
  html += '</div><div style="font-size:0.52rem;color:var(--mist);margin-top:0.2rem">Click to remove &middot; max ' + MAX_CARRY + ' consumables</div>';
  return html;
}

function buildStashItemsHTML(n) {
  const isFull = n.carriedItems.length >= MAX_CARRY;
  let html = '<div class="stash-item-list">';
  let hasAny = false;

  // ── Armor items (go to armor slot) ──
  const armorItems = ITEMS.armor;
  const armorBlocked = !!n.equippedArmor;
  armorItems.forEach(item => {
    const owned = (GS.inventory['armor'] || []).filter(x => x.id === item.id).length;
    if (owned === 0) return;
    hasAny = true;
    const blocked = armorBlocked;
    const durInfo = ' \u00b7 \ud83d\udee1' + (ARMOR_DURABILITY[item.tier] || 5) + ' dur';
    const clickAttr = blocked ? '' : ('addItemToCarry(\'' + n.id + '\',\'armor\',\'' + item.id + '\')');
    const titleAttr = blocked ? 'Unequip current armor first' : 'Equip to armor slot';
    html += '<div class="stash-item ' + (blocked ? 'full' : '') + '"'
          + ' onclick="' + clickAttr + '"'
          + ' title="' + titleAttr + '">'
          + '<div class="stash-item-icon">' + itemImgAsync(item, '32px') + '</div>'
          + '<div class="stash-item-info">'
          + '<div class="stash-item-name">' + item.name
          + ' <span style="color:rgba(201,162,39,0.6);font-size:0.55rem">' + item.tier.toUpperCase() + '</span></div>'
          + '<div class="stash-item-desc">' + item.desc + durInfo + '</div>'
          + '</div>'
          + '<div class="stash-item-owned">' + owned + ' owned</div>'
          + '</div>';
  });

  // ── Consumable items (go to field kit) ──
  const consumables = [...ITEMS.healing, ...ITEMS.tactical];
  consumables.forEach(item => {
    const cat = getCategoryForItem(item);
    const owned = (GS.inventory[cat] || []).filter(x => x.id === item.id).length;
    if (owned === 0) return;
    hasAny = true;
    const blocked = isFull;
    const clickAttr = blocked ? '' : ('addItemToCarry(\'' + n.id + '\',\'' + cat + '\',\'' + item.id + '\')');
    html += '<div class="stash-item ' + (blocked ? 'full' : '') + '"'
          + ' onclick="' + clickAttr + '">'
          + '<div class="stash-item-icon">' + itemImgAsync(item, '32px') + '</div>'
          + '<div class="stash-item-info">'
          + '<div class="stash-item-name">' + item.name + '</div>'
          + '<div class="stash-item-desc">' + item.desc + '</div>'
          + '</div>'
          + '<div class="stash-item-owned">' + owned + ' avail</div>'
          + '</div>';
  });

  if (!hasAny) html += '<div class="text-xs text-mist">Stash empty. Visit Supplies.</div>';
  html += '</div>';
  return html;
}


function buildUseItemsHTML(n) {
  if (!n.carriedItems.length) return '';
  const healItems = n.carriedItems.filter(i => i.effect === 'heal' || i.effect === 'full_heal');
  if (!healItems.length) return '';
  if (n.hp >= n.maxHp) return '<div class="text-xs text-mist mt-1">HP is full — no healing needed.</div>';

  let html = '<div class="separator"></div><div class="loadout-section-title">Use Item Now (outside mission)</div><div class="use-item-list">';
  n.carriedItems.forEach((item, i) => {
    if (item.effect !== 'heal' && item.effect !== 'full_heal') return;
    html += `<div class="use-item-btn" onclick="useItemOutsideMission('${n.id}', ${i})">
      <span style="font-size:1.2rem">${itemImgAsync(item, '1.2rem')}</span>
      <div><div class="stash-item-name">${item.name}</div><div class="stash-item-desc">+${item.value} HP · Current: ${n.hp}/${n.maxHp}</div></div>
    </div>`;
  });
  html += '</div>';
  return html;
}

function ninjaCanUseWeapon(ninja, weapon) {
  const cls = CLASSES[ninja.class];
  if (!cls) return true;
  const allowed = cls.primaryWeapons || [];
  if (allowed.includes(weapon.type)) return true;
  // Check job ability unlock
  const slots = getEquippedSlots(ninja);
  if (slots.support) {
    const ab = JOB_ABILITIES[slots.support];
    if (ab?.effect === 'unlock_weapon' && ab.weaponType === weapon.type) return true;
  }
  return false;
}

function ninjaEquipWeapon(ninjaId, stashIndex) {
  const n = GS.clan.find(x => x.id === ninjaId);
  if (!n) return;
  if (!GS.weaponStash) GS.weaponStash = [];
  const w = GS.weaponStash[stashIndex];
  if (!w) return;
  // Class restriction check
  if (!ninjaCanUseWeapon(n, w)) {
    const cls = CLASSES[n.class];
    const allowed = (cls?.primaryWeapons || []).map(t => WEAPONS[t]?.label || t).join(', ');
    toast(n.name + ' cannot use ' + (WEAPONS[w.type]?.label || w.type) + '. Class uses: ' + allowed, 'error');
    return;
  }
  // Return current weapon to stash if any
  if (n.weapon) GS.weaponStash.push({ ...n.weapon });
  n.weapon = { ...w };
  GS.weaponStash.splice(stashIndex, 1);
  toast(n.name + ' equipped ' + w.name, 'success');
  renderLoadoutModal(ninjaId);
  _refreshMissionsIfActive();
}

function ninjaUnequipWeapon(ninjaId) {
  const n = GS.clan.find(x => x.id === ninjaId);
  if (!n || !n.weapon) return;
  if (!GS.weaponStash) GS.weaponStash = [];

}


function ninjaDiscardWeapon(ninjaId) {

const WEAPON_SELL_PRICE = { common: 20, uncommon: 45, rare: 90, legendary: 175, epic: 300 };

function stashSellWeapon(stashIdx) {
  const stash = GS.weaponStash || [];
  const w = stash[stashIdx];
  if (!w) return;
  const sellPrice = WEAPON_SELL_PRICE[w.tier] || 15;
  // Depleted weapons sell for half
  const broken = w.quiverEmpty || w.usesLeft <= 0 || (w.ammo !== undefined && w.ammo <= 0);
  const finalPrice = broken ? Math.floor(sellPrice * 0.5) : sellPrice;
  openModal(
    'Sell Weapon?',
    '<div style="font-size:1.2rem;margin-bottom:0.4rem">' + itemImgAsync(w,'1.2rem') + ' ' + w.name + '</div>' +
    '<div style="font-size:0.75rem;color:var(--mist);margin-bottom:0.7rem">' + (w.tier||'common').toUpperCase() + ' · DMG ' + w.dmg[0] + '-' + w.dmg[1] + '</div>' +
    (broken ? '<div style="font-size:0.65rem;color:var(--crimson-bright);margin-bottom:0.5rem">Weapon is depleted — selling at 50% value</div>' : '') +
    'Sell for <b style="color:var(--gold)">' + finalPrice + ' Gold</b>?',
    [
      {
        label: 'Sell (' + finalPrice + 'G)',
        cls: 'confirm',
        fn: () => {
          GS.weaponStash.splice(stashIdx, 1);

          updateGoldDisplay();
          saveGame();
          closeModal();
          // Re-open the loadout modal if it was open

          if (openNinjaId) openNinjaDetail(openNinjaId);
          toast('+' + finalPrice + 'G — ' + w.name + ' sold.', 'success');

      },
      { label: 'Keep', cls: '', fn: closeModal }

}

function addItemToCarry(ninjaId, category, itemId) {
  const n = GS.clan.find(x => x.id === ninjaId);
  if (!n) return;
  if (!n.carriedItems) n.carriedItems = [];
  const inv = GS.inventory[category] || [];
  const idx = inv.findIndex(x => x.id === itemId);
  if (idx === -1) { toast('Item not in stash.', 'error'); return; }
  const item = inv[idx];
  // Armor goes to the dedicated armor slot, not the field kit
  if (item.isArmor) {
    if (n.equippedArmor) { toast('Unequip your current armor first.', 'error'); return; }
    const prepared = initArmorItem(item);
    n.equippedArmor = prepared;
    inv.splice(idx, 1);
    renderLoadoutModal(ninjaId);
    _refreshMissionsIfActive();
    return;
  }
  // Normal items go to field kit
  if (n.carriedItems.length >= MAX_CARRY) { toast('Field kit full!', 'error'); return; }
  const prepared = { ...item };
  n.carriedItems.push(prepared);
  inv.splice(idx, 1);
  renderLoadoutModal(ninjaId);
  _refreshMissionsIfActive();
}

function unequipArmor(ninjaId) {
  const n = GS.clan.find(x => x.id === ninjaId);
  if (!n || !n.equippedArmor) return;
  const cat = 'armor';
  if (!GS.inventory[cat]) GS.inventory[cat] = [];
  GS.inventory[cat].push({ ...n.equippedArmor });
  n.equippedArmor = null;
  toast('Armor returned to stash.', 'success');
  renderLoadoutModal(ninjaId);
  _refreshMissionsIfActive();
}

function removeItemFromCarry(ninjaId, carryIndex) {
  const n = GS.clan.find(x => x.id === ninjaId);
  if (!n || !n.carriedItems) return;
  const item = n.carriedItems[carryIndex];
  if (!item) return;
  const cat = getCategoryForItem(item);
  if (!GS.inventory[cat]) GS.inventory[cat] = [];
  GS.inventory[cat].push({ ...item });
  n.carriedItems.splice(carryIndex, 1);
  toast(`${item.name} returned to stash`, 'success');
  renderLoadoutModal(ninjaId);
  _refreshMissionsIfActive();
}

function useItemOutsideMission(ninjaId, carryIndex) {
  const n = GS.clan.find(x => x.id === ninjaId);
  if (!n || !n.carriedItems) return;
  const item = n.carriedItems[carryIndex];
  if (!item) return;
  if (n.hp >= n.maxHp) { toast(`${n.name} is already at full HP.`, 'error'); return; }
  n.hp = Math.min(n.maxHp, n.hp + (item.value || 0));
  if (item.effect === 'full_heal' && item.clearPoison) n.status = null;
  n.carriedItems.splice(carryIndex, 1);
  toast(`${n.name} used ${item.name}. HP: ${n.hp}/${n.maxHp}`, 'success');
  saveGame();
  renderLoadoutModal(ninjaId);
}

function getTrainingTimeLeft(n) {
  if (!n.training) return '';
  const left = Math.max(0, n.training.endTime - Date.now());
  if (left <= 0) return '⚡ Ready!';
  const hrs  = Math.floor(left / 3600000);
  const mins = Math.floor((left % 3600000) / 60000);
  if (hrs > 0) return `${hrs}h ${mins}m left`;
  const secs = Math.floor((left % 60000) / 1000);
  return mins > 0 ? `${mins}m ${secs}s left` : `${secs}s left`;
}

// Safe wrapper — call from timers/polling, never from render path
function checkAndFinishTraining(n) {
  if (!n.training) return false;
  if (Date.now() < n.training.endTime) return false;
  finishTraining(n);
  return true;
}

function finishTraining(n) {
  if (!n.training) return;
  const t = n.training;
  if (t.stat === 'hp') { n.maxHp += t.points * 2; n.hp = n.maxHp; }
  else if (t.stat === 'stamina') { n.maxStamina += t.points; }
  else if (t.stat === 'chi') { n.maxChi += t.points; }
  n.training = null;
  toast(`${n.name} finished training!`, 'success');
  saveGame();
}

function getCurrentArc() {
  const done = new Set(GS.completedMissions);
  for (const arc of STORY_ARCS) {
    // Arc is complete if its capstone is done
    if (!done.has(arc.capstone)) return arc;
  }
  // All arcs complete — return last arc
  return STORY_ARCS[STORY_ARCS.length - 1];
}

function isArcComplete(arc) {
  const done = new Set(GS.completedMissions);
  return done.has(arc.capstone);
}

function getArcMissions(arc) {
  return MISSIONS.filter(m => arc.ids.includes(m.id));
}

  line:    { label: 'Line',    icon: '▮▮▮', desc: 'Stacked column. All advance together.',
             positions: (n, h) => Array.from({length: n}, (_, i) => ({
               x: 1,
               y: Math.max(2, Math.min(h - 3, Math.floor(h/2) - Math.floor(n/2) + i))
             })) },
  wedge:   { label: 'Wedge',   icon: '◀▮▷', desc: 'Leader at front, flanks offset behind.',
             positions: (n, h) => {
               const mid = Math.floor(h/2);
               const clamp = (y) => Math.max(2, Math.min(h - 3, y));
               const pts = [{ x: 1, y: clamp(mid) }];
               if (n > 1) pts.push({ x: 2, y: clamp(mid - 1) });
               if (n > 2) pts.push({ x: 2, y: clamp(mid + 1) });
               return pts.slice(0, n);
             }},
  spread:  { label: 'Spread',  icon: '▮ ▮ ▮', desc: 'Wide spread across the flank.',
             positions: (n, h) => {
               // Distribute evenly across the interior rows (y=2 to h-3), x alternates 1 and 2
               // Never touches y=1 or y=h-2 (often walls in structured maps)
               const minY = 2, maxY = h - 3;
               const span = maxY - minY;
               return Array.from({length: n}, (_, i) => ({
                 x: 1 + (i % 2),
                 y: n === 1 ? Math.floor(h / 2) : Math.max(minY, Math.min(maxY, Math.round(minY + (i / (n - 1)) * span)))
               }));
             }},
  stagger: { label: 'Stagger', icon: '▮▮ ▮', desc: 'Alternating depth for flanking options.',
             positions: (n, h) => Array.from({length: n}, (_, i) => ({
               x: 1 + (i % 2),

             })) },
};

function getAvailableMissions() {
  const maxLevel = GS.clan.length ? Math.max(...GS.clan.map(n => n.level)) : 1;
  const done = new Set(GS.completedMissions);
  const curArc = getCurrentArc();
  const curArcIds = new Set(curArc.ids);

  return getAllMissions().filter(m => {
    if (m.requiredLevel > maxLevel) return false;
    if (m.requiresMissions && !m.requiresMissions.every(id => done.has(id))) return false;
    // Story missions: only those in the current arc are selectable
    if (!m.isDynamic && !curArcIds.has(m.id)) return false;
    return true;
  }).map(m => m.id);
}

function selectMission(id) {
  selectedMissionId = id;
  renderMissions();
  restoreSidebarIfOpen();
}

function toggleParty(id) {
  if (selectedParty.includes(id)) {
    selectedParty = selectedParty.filter(x => x !== id);
  } else if (selectedParty.length < 3) {
    selectedParty.push(id);
  } else {
    toast('Maximum 3 ninja per mission.', 'error'); return;
  }
  renderMissions();
  restoreSidebarIfOpen();
}

// After any renderMissions() call, restore the open sidebar and re-attach listeners
function restoreSidebarIfOpen() {
  if (!window._missionSidebarOpen || window.innerWidth > 700) return;
  const sb = document.querySelector('.mission-sidebar');
  if (!sb) return;
  sb.classList.add('open');
  // Re-attach listeners to the freshly rebuilt element
  attachMissionSidebarListeners(sb);
}

function renderMissionIntro() {
  const m = getAllMissions().find(x => x.id === selectedMissionId);
  const el = document.getElementById('missionIntro');
  if (el && m) el.textContent = `"${m.intro}"`;
}

function selectFormation(key) {
  selectedFormation = key;
  renderMissions();
  restoreSidebarIfOpen();
}

function launchMission() {
  if (!selectedMissionId) { toast('Select a mission first.', 'error'); return; }
  if (selectedParty.length === 0) { toast('Select at least one ninja.', 'error'); return; }

  const m = getAllMissions().find(x => x.id === selectedMissionId);
  if (!m) { toast('Mission not found.', 'error'); return; }

  if (!m.isDynamic && GS.completedMissions.includes(m.id)) {
    toast('Story mission already completed. Replay coming soon.', 'error'); return;
  }
  if (m.isDynamic && m.completed) {
    toast('Contract already fulfilled. Wait for the next refresh.', 'error'); return;
  }

  initCombat(m, selectedParty);
}

// ============================================================

const TileRenderer = (() => {
  const _cache = new Map();

  function _hash(seed) { seed = (seed * 1664525 + 1013904223) & 0xFFFFFFFF; return (seed >>> 0) / 4294967296; }
  function _seedFrom(x, y, salt = 0) { return ((x * 7919 + y * 104729 + salt * 1009) & 0xFFFFFFFF) >>> 0; }
  function _rand(seed, min = 0, max = 1) { return min + _hash(seed) * (max - min); }
  function _randInt(seed, min, max) { return Math.floor(_rand(seed, min, max + 1)); }

  function _roundedRect(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  }

  function _drawEmpty(ctx, seed, cs) {
    const s = seed;
    const hue = 230 + _rand(s + 1, -12, 12);
    const light = 14 + _rand(s + 2, 0, 8);
    ctx.fillStyle = `hsl(${hue}, 12%, ${light}%)`;
    ctx.fillRect(0, 0, cs, cs);
    for (let i = 0; i < 14 + _randInt(s + 3, 0, 10); i++) {
      const x = _rand(s + 4 + i * 7, 0, cs);
      const y = _rand(s + 5 + i * 7, 0, cs);
      const r = _rand(s + 6 + i * 7, 1, 3.5);
      const a = _rand(s + 7 + i * 7, 0.04, 0.12);
      ctx.fillStyle = `rgba(180,190,210,${a})`;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
    for (let i = 0; i < 2 + _randInt(s + 8, 0, 3); i++) {
      const sx = _rand(s + 9 + i * 13, 2, cs - 2);
      const sy = _rand(s + 10 + i * 13, 2, cs - 2);
      ctx.strokeStyle = `rgba(40,45,60,${_rand(s + 11 + i * 13, 0.15, 0.4)})`;
      ctx.lineWidth = 1 + _rand(s + 12 + i * 13, 0, 1.2);
      ctx.beginPath(); ctx.moveTo(sx, sy);
      let cx = sx, cy = sy;
      for (let j = 0; j < 3 + _randInt(s + 13 + i * 13, 0, 2); j++) {
        cx += _rand(s + 14 + i * 13 + j * 5, -6, 6);
        cy += _rand(s + 15 + i * 13 + j * 5, -6, 6);
        ctx.lineTo(cx, cy);
      }
      ctx.stroke();
    }
    const grad = ctx.createLinearGradient(0, 0, cs, cs);
    grad.addColorStop(0, 'rgba(255,255,255,0.03)');
    grad.addColorStop(0.5, 'rgba(255,255,255,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.04)');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, cs, cs);
  }

  function _drawWall(ctx, seed, cs) {
    const s = seed;
    ctx.fillStyle = '#0a0a12';
    ctx.fillRect(0, 0, cs, cs);
    const rows = 3 + _randInt(s + 1, 0, 2);
    const cols = 4 + _randInt(s + 2, 0, 2);
    const rH = cs / rows, rW = cs / cols;
    for (let r = 0; r < rows; r++) {
      const offset = (r % 2) * 0.5;
      for (let c = 0; c < cols; c++) {
        const x = (c + offset) * rW;
        const y = r * rH;
        const w = rW * (1 + (c === cols - 1 ? 0.5 : 0));
        const h = rH * (0.85 + _rand(s + 3 + r * 7 + c * 13, 0, 0.15));
        const hue = 220 + _rand(s + 4 + r * 7 + c * 13, -8, 8);
        const light = 8 + _rand(s + 5 + r * 7 + c * 13, 0, 6);
        ctx.fillStyle = `hsl(${hue}, 10%, ${light}%)`;
        const pad = 1 + _rand(s + 6 + r * 7 + c * 13, 0, 1.5);
        _roundedRect(ctx, x + pad, y + pad, w - pad * 2, h - pad * 2, 2 + _rand(s + 7 + r * 7 + c * 13, 0, 2));

    grad2.addColorStop(1, 'rgba(200,210,240,0)');
    ctx.fillStyle = grad2; ctx.fillRect(0, 0, cs, cs * 0.15);
  }

  function _drawFloor2(ctx, seed, cs) {
    const s = seed;
    ctx.fillStyle = `hsl(235, 12%, ${12 + _rand(s + 1, 0, 5)}%)`;
    ctx.fillRect(0, 0, cs, cs);
    for (let i = 0; i < 5 + _randInt(s + 2, 0, 4); i++) {
      const y = _rand(s + 3 + i * 7, 3, cs - 3);
      ctx.strokeStyle = `rgba(70,75,100,${_rand(s + 4 + i * 7, 0.06, 0.18)})`;
      ctx.lineWidth = 0.6 + _rand(s + 5 + i * 7, 0, 1);

    ctx.fillStyle = grad; ctx.fillRect(0, cs * 0.6, cs, cs * 0.4);
    const grad2 = ctx.createLinearGradient(0, 0, 0, cs * 0.12);
    grad2.addColorStop(0, `rgba(200,210,240,${0.06 + _rand(s + 8, 0, 0.05)})`);
    grad2.addColorStop(1, 'rgba(200,210,240,0)');
    ctx.fillStyle = grad2; ctx.fillRect(0, 0, cs, cs * 0.12);
  }

  function _drawFloor3(ctx, seed, cs) {
    const s = seed;
    ctx.fillStyle = `hsl(240, 14%, ${9 + _rand(s + 1, 0, 4)}%)`;
    ctx.fillRect(0, 0, cs, cs);
    for (let i = 0; i < 6 + _randInt(s + 2, 0, 5); i++) {
      const y = _rand(s + 3 + i * 7, 2, cs - 2);
      ctx.strokeStyle = `rgba(60,65,90,${_rand(s + 4 + i * 7, 0.08, 0.2)})`;
      ctx.lineWidth = 0.6 + _rand(s + 5 + i * 7, 0, 1.2);
      ctx.beginPath(); ctx.moveTo(2, y); ctx.lineTo(cs - 2, y + _rand(s + 6 + i * 7, -4, 4)); ctx.stroke();
    }
    const grad = ctx.createLinearGradient(0, cs * 0.5, 0, cs);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, `rgba(0,0,0,${0.3 + _rand(s + 7, 0, 0.1)})`);
    ctx.fillStyle = grad; ctx.fillRect(0, cs * 0.5, cs, cs * 0.5);
    const grad2 = ctx.createLinearGradient(0, 0, 0, cs * 0.1);
    grad2.addColorStop(0, `rgba(200,210,240,${0.05 + _rand(s + 8, 0, 0.04)})`);
    grad2.addColorStop(1, 'rgba(200,210,240,0)');
    ctx.fillStyle = grad2; ctx.fillRect(0, 0, cs, cs * 0.1);
  }

  function _drawCliff(ctx, seed, cs) {
    const s = seed;
    ctx.fillStyle = '#1a1214';
    ctx.fillRect(0, 0, cs, cs);
    for (let i = 0; i < 6 + _randInt(s + 1, 0, 4); i++) {
      const y = _rand(s + 2 + i * 7, 0, cs);
      const h = 2 + _rand(s + 3 + i * 7, 0, 6);
      const hue = 20 + _rand(s + 4 + i * 7, -8, 12);
      const light = 8 + _rand(s + 5 + i * 7, 0, 8);
      ctx.fillStyle = `hsla(${hue}, 20%, ${light}%, ${0.3 + _rand(s + 6 + i * 7, 0, 0.4)})`;
      const xOff = _rand(s + 7 + i * 7, -2, 2);
      ctx.fillRect(xOff, y, cs - xOff * 2, h);
    }
    for (let i = 0; i < 3 + _randInt(s + 8, 0, 3); i++) {
      const x = _rand(s + 9 + i * 7, 4, cs - 4);
      ctx.strokeStyle = `rgba(40,30,25,${_rand(s + 10 + i * 7, 0.2, 0.5)})`;
      ctx.lineWidth = 0.8 + _rand(s + 11 + i * 7, 0, 1.2);
      ctx.beginPath(); ctx.moveTo(x, 0);
      let cx = x, cy = 0;
      while (cy < cs) {
        cx += _rand(s + 12 + i * 7 + Math.floor(cy / 6), -2, 2);
        cy += 4 + _rand(s + 13 + i * 7 + Math.floor(cy / 6), 0, 4);
        ctx.lineTo(cx, cy);
      }
      ctx.stroke();
    }
  }

  function _drawGate(ctx, seed, cs) {
    const s = seed;
    ctx.fillStyle = '#3a2c14';
    ctx.fillRect(0, 0, cs, cs);
    const plankW = 6 + _rand(s + 1, 0, 4);
    const count = Math.floor(cs / plankW);
    for (let i = 0; i < count; i++) {
      const x = i * plankW + _rand(s + 2 + i * 7, 0, 1);
      const hue = 30 + _rand(s + 3 + i * 7, -6, 6);
      const light = 16 + _rand(s + 4 + i * 7, 0, 6);
      ctx.fillStyle = `hsl(${hue}, 30%, ${light}%)`;
      ctx.fillRect(x, 2, plankW - 1, cs - 4);
      ctx.strokeStyle = `rgba(60,40,20,${_rand(s + 5 + i * 7, 0.05, 0.15)})`;
      ctx.lineWidth = 0.5;
      for (let j = 0; j < 3; j++) {
        const gy = _rand(s + 6 + i * 7 + j * 11, 4, cs - 4);
        ctx.beginPath(); ctx.moveTo(x + 1, gy); ctx.lineTo(x + plankW - 2, gy + _rand(s + 7 + i * 7 + j * 11, -2, 2)); ctx.stroke();
      }
    }
    for (let i = 0; i < 2 + _randInt(s + 8, 0, 2); i++) {
      const y = _rand(s + 9 + i * 7, 4, cs - 4);
      ctx.fillStyle = `rgba(60,55,65,${0.4 + _rand(s + 10 + i * 7, 0, 0.3)})`;
      ctx.fillRect(2, y - 1.5, cs - 4, 3 + _rand(s + 11 + i * 7, 0, 2));
      for (let j = 0; j < 3; j++) {
        const rx = _rand(s + 12 + i * 7 + j * 13, 6, cs - 6);
        ctx.fillStyle = `rgba(120,110,100,${0.3 + _rand(s + 13 + i * 7 + j * 13, 0, 0.3)})`;
        ctx.beginPath(); ctx.arc(rx, y, 1.5 + _rand(s + 14 + i * 7 + j * 13, 0, 1), 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  function _drawStone(ctx, seed, cs) {
    const s = seed;
    ctx.fillStyle = `hsl(225, 8%, ${18 + _rand(s + 1, 0, 4)}%)`;
    ctx.fillRect(0, 0, cs, cs);
    const rows = 4 + _randInt(s + 2, 0, 2);
    const cols = 4 + _randInt(s + 3, 0, 2);
    const rH = cs / rows, rW = cs / cols;
    for (let r = 0; r < rows; r++) {
      const offset = (r % 2) * 0.5;
      for (let c = 0; c < cols; c++) {
        const x = (c + offset) * rW;
        const y = r * rH;
        const w = rW * (1 + (c === cols - 1 ? 0.2 : 0));
        const h = rH * (0.9 + _rand(s + 4 + r * 7 + c * 13, 0, 0.1));
        const hue = 220 + _rand(s + 5 + r * 7 + c * 13, -6, 6);
        const light = 16 + _rand(s + 6 + r * 7 + c * 13, 0, 6);
        ctx.fillStyle = `hsl(${hue}, 8%, ${light}%)`;
        const pad = 1.5;
        _roundedRect(ctx, x + pad, y + pad, w - pad * 2, h - pad * 2, 1 + _rand(s + 7 + r * 7 + c * 13, 0, 1.5));
        ctx.fill();
        ctx.strokeStyle = `rgba(200,210,230,${_rand(s + 8 + r * 7 + c * 13, 0.04, 0.1)})`;
        ctx.lineWidth = 0.6;
        _roundedRect(ctx, x + pad, y + pad, w - pad * 2, h - pad * 2, 1 + _rand(s + 9 + r * 7 + c * 13, 0, 1.5));
        ctx.stroke();

  }

  const DRAWERS = {
    empty:   _drawEmpty,
    wall:    _drawWall,
    forest:  _drawForest,
    rubble:  _drawRubble,
    roof:    _drawRoof,
    roof3:   _drawRoof3,
    shadow:  _drawShadow,
    water:   _drawWater,
    floor1:  _drawFloor1,
    floor2:  _drawFloor2,
    floor3:  _drawFloor3,
    cliff:   _drawCliff,
    gate:    _drawGate,
    stone:   _drawStone,
  };

  function getTile(key, x, y, cs) {
    if (cs < 8) cs = 8;
    const cacheKey = `${key}_${x}_${y}_${cs}`;
    if (_cache.has(cacheKey)) return _cache.get(cacheKey);
    const canvas = document.createElement('canvas');
    canvas.width = cs; canvas.height = cs;
    const ctx = canvas.getContext('2d');

// ── Terrain definitions (already defined earlier) ──
// TERRAIN_TILES is already defined.

// ─── DRAW CANVAS (with procedural tiles) ───
function drawCanvas() {
  const canvas = document.getElementById('combatCanvas');
  const cs = CS.cellSize;
  if (!canvas || !cs || cs < 1) {
    if (canvas) {
      canvas.width = 800; canvas.height = 600;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#1a1a26';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ff4444';
      ctx.font = '20px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Map loading...', canvas.width/2, canvas.height/2);
    }
    return;
  }

  const ctx = canvas.getContext('2d');
  const W = CS.gridW || 20, H = CS.gridH || 19;
  canvas.width = W * cs;
  canvas.height = H * cs;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // ─── Tiles (procedural) ───
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const tileKey = CS.grid[y]?.[x] || 'empty';
      if (tileKey === 'exit') continue;
      const px = x * cs, py = y * cs;

      let tileCanvas = null;
      try {
        tileCanvas = TileRenderer.getTile(tileKey, x, y, cs);
      } catch(e) {}
      if (tileCanvas && tileCanvas.width > 0) {
        ctx.drawImage(tileCanvas, px, py);
      } else {
        const tile = TERRAIN_TILES[tileKey] || TERRAIN_TILES.empty;
        ctx.fillStyle = tile.color;
        ctx.fillRect(px, py, cs, cs);
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.lineWidth = 0.5;
      ctx.strokeRect(px, py, cs, cs);
    }
  }

  // ─── Objective tiles ──────────────────────────────────────
  if (CS.objectiveTiles && CS.objectiveTiles.length) {
    const _opulse = 0.6 + 0.4 * Math.sin(Date.now() / 400);
    CS.objectiveTiles.forEach(function(ot) {
      const ox = ot.x * cs, oy = ot.y * cs;
      if (ot.done) {
        ctx.fillStyle = 'rgba(61,170,125,0.25)';
        ctx.fillRect(ox, oy, cs, cs);
        ctx.fillStyle = 'rgba(61,170,125,0.9)';
        ctx.font = 'bold ' + Math.round(cs * 0.4) + 'px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('✓', ox + cs / 2, oy + cs / 2);
        ctx.strokeStyle = 'rgba(61,170,125,0.5)';
        ctx.lineWidth = 2;
        ctx.strokeRect(ox + 1, oy + 1, cs - 2, cs - 2);
      } else {
        ctx.fillStyle = 'rgba(255,140,0,' + (0.12 + _opulse * 0.12) + ')';
        ctx.fillRect(ox, oy, cs, cs);
        ctx.strokeStyle = 'rgba(255,160,0,' + (0.7 + _opulse * 0.3) + ')';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(ox + 1, oy + 1, cs - 2, cs - 2);
        ctx.font = Math.round(cs * 0.5) + 'px serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(ot.icon, ox + cs / 2, oy + cs * 0.46);
        ctx.fillStyle = 'rgba(255,200,100,' + (0.7 + _opulse * 0.3) + ')';
        ctx.font = 'bold ' + Math.round(cs * 0.14) + 'px sans-serif';
        ctx.textBaseline = 'middle';
        ctx.fillText(ot.label.toUpperCase(), ox + cs / 2, oy + cs * 0.82);
      }
    });
  }

  // ─── Exit tiles ──────────────────────────────────────────
  CS.exitTiles.forEach(exit => {
    const ex = exit.x * cs, ey = exit.y * cs;
    const floorCanvas = TileRenderer.getTile('empty', exit.x, exit.y, cs);
    if (floorCanvas) ctx.drawImage(floorCanvas, ex, ey);
    else { ctx.fillStyle = TERRAIN_TILES.empty.color; ctx.fillRect(ex, ey, cs, cs); }
    if (CS.exitsActive) {
      const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 400);
      ctx.fillStyle = `rgba(61,170,125,${0.22 + pulse * 0.18})`;
      ctx.fillRect(ex, ey, cs, cs);
      ctx.strokeStyle = `rgba(61,220,140,${0.6 + pulse * 0.3})`;
      ctx.lineWidth = 2;
      ctx.strokeRect(ex + 1, ey + 1, cs - 2, cs - 2);
      ctx.fillStyle = `rgba(61,200,125,${0.8 + pulse * 0.2})`;
      ctx.font = `${cs * 0.45}px serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('⬡', ex + cs / 2, ey + cs / 2);
    } else {
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(ex, ey, cs, cs);
      ctx.fillStyle = 'rgba(61,170,125,0.25)';
      ctx.font = `${cs * 0.35}px serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('⬡', ex + cs / 2, ey + cs / 2);
    }
  });

  // ─── Fire tiles ──────────────────────────────────────────
  if (CS.activeFires && CS.activeFires.length > 0) {
    const _now = Date.now();
    const _burnedAll = getActiveBurnedSet();
    const _originSafe = new Set();
    CS.activeFires.forEach(function(fire) {
      const age = CS.turn - fire.turnIgnited;
      if (age < FIRE_ORIGIN_DELAY) _originSafe.add(fire.ox + ',' + fire.oy);
    });
    _burnedAll.forEach(function(key) {
      const parts = key.split(','); const fx = parseInt(parts[0]), fy = parseInt(parts[1]);
      const px = fx * cs, py = fy * cs;
      const _flicker1 = 0.5 + 0.5 * Math.sin(_now / 180 + fx * 1.7 + fy * 2.3);
      const _flicker2 = 0.5 + 0.5 * Math.sin(_now / 110 + fx * 3.1 - fy * 1.4);
      const _flicker  = (_flicker1 + _flicker2) / 2;
      const _alpha = 0.45 + _flicker * 0.25;
      ctx.fillStyle = 'rgba(220,60,0,' + _alpha.toFixed(2) + ')';
      ctx.fillRect(px, py, cs, cs);
      const _glow = ctx.createRadialGradient(px + cs * 0.5, py + cs * 0.7, 0, px + cs * 0.5, py + cs * 0.5, cs * 0.55);
      _glow.addColorStop(0, 'rgba(255,200,50,' + (0.35 + _flicker * 0.30).toFixed(2) + ')');
      _glow.addColorStop(1, 'rgba(255,80,0,0)');
      ctx.fillStyle = _glow; ctx.fillRect(px, py, cs, cs);
      ctx.font = Math.round(cs * 0.48) + 'px serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const _bob = Math.sin(_now / 200 + fx * 2.1 + fy * 1.9) * cs * 0.04;
      ctx.fillText('🔥', px + cs * 0.5, py + cs * 0.46 + _bob);
      ctx.strokeStyle = 'rgba(255,140,0,' + (0.6 + _flicker * 0.4).toFixed(2) + ')';
      ctx.lineWidth = 1.5; ctx.strokeRect(px + 1, py + 1, cs - 2, cs - 2);
    });
    _originSafe.forEach(function(key) {
      if (_burnedAll.has(key)) return;
      const parts = key.split(','); const fx = parseInt(parts[0]), fy = parseInt(parts[1]);
      const px = fx * cs, py = fy * cs;
      const _warn = 0.4 + 0.6 * Math.abs(Math.sin(Date.now() / 300));
      ctx.fillStyle = 'rgba(255,120,0,' + (_warn * 0.35).toFixed(2) + ')';
      ctx.fillRect(px, py, cs, cs);
      ctx.strokeStyle = 'rgba(255,160,0,' + (_warn * 0.9).toFixed(2) + ')';
      ctx.lineWidth = 2; ctx.strokeRect(px + 1, py + 1, cs - 2, cs - 2);
      ctx.font = 'bold ' + Math.round(cs * 0.14) + 'px sans-serif';
      ctx.fillStyle = 'rgba(255,220,80,' + (_warn * 0.95).toFixed(2) + ')';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('IGNITING', px + cs * 0.5, py + cs * 0.84);
      ctx.font = Math.round(cs * 0.38) + 'px serif';
      ctx.fillText('💨', px + cs * 0.5, py + cs * 0.44);
    });
  }

  // ─── Smoke clouds ────────────────────────────────────────
  if (CS.smokeClouds && CS.smokeClouds.length > 0) {
    const _now2 = Date.now();
    CS.smokeClouds.forEach(cloud => {
      const isDarkness = cloud.type === 'darkness';
      for (let dy2 = -cloud.radius; dy2 <= cloud.radius; dy2++) {
        for (let dx2 = -cloud.radius; dx2 <= cloud.radius; dx2++) {
          const dist = Math.abs(dx2) + Math.abs(dy2);
          if (dist > cloud.radius) continue;
          const tx2 = cloud.cx + dx2, ty2 = cloud.cy + dy2;
          if (tx2 < 0 || ty2 < 0 || tx2 >= CS.gridW || ty2 >= CS.gridH) continue;
          const px2 = tx2 * cs, py2 = ty2 * cs;
          const edgeFade = 1 - (dist / (cloud.radius + 0.5));
          const flick = 0.5 + 0.5 * Math.sin(_now2 / 220 + tx2 * 1.3 + ty2 * 2.1);
          const baseAlpha = isDarkness ? 0.52 : 0.42;
          const alpha = (baseAlpha + flick * 0.18) * edgeFade;
          const r = isDarkness ? 20 : 40, g = isDarkness ? 10 : 40, b = isDarkness ? 45 : 45;
          ctx.fillStyle = `rgba(${r},${g},${b},${alpha.toFixed(2)})`;
          ctx.fillRect(px2, py2, cs, cs);
          const wispAlpha = (0.12 + flick * 0.1) * edgeFade;
          const wispGrad = ctx.createRadialGradient(px2 + cs * 0.5, py2 + cs * 0.5, 0, px2 + cs * 0.5, py2 + cs * 0.5, cs * 0.6);
          const wisp1 = isDarkness ? `rgba(80,40,120,${wispAlpha.toFixed(2)})` : `rgba(160,160,160,${wispAlpha.toFixed(2)})`;
          wispGrad.addColorStop(0, wisp1); wispGrad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = wispGrad; ctx.fillRect(px2, py2, cs, cs);
          if ((tx2 + ty2) % 3 === 0) {
            ctx.font = Math.round(cs * 0.4) + 'px serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.globalAlpha = wispAlpha * 2.5;
            ctx.fillStyle = isDarkness ? '#220033' : '#777';
            ctx.fillText(isDarkness ? '🌑' : '💨', px2 + cs * 0.5, py2 + cs * 0.5);
            ctx.globalAlpha = 1;
          }
          ctx.strokeStyle = isDarkness ? `rgba(60,20,80,${(edgeFade * 0.4).toFixed(2)})` : `rgba(100,100,100,${(edgeFade * 0.35).toFixed(2)})`;
          ctx.lineWidth = 1; ctx.strokeRect(px2 + 1, py2 + 1, cs - 2, cs - 2);
        }
      }
      const labelX = cloud.cx * cs + cs * 0.5;
      const labelY = cloud.cy * cs + cs * 0.18;
      ctx.font = 'bold ' + Math.round(cs * 0.16) + 'px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = isDarkness ? 'rgba(180,120,255,0.75)' : 'rgba(220,220,220,0.75)';
      ctx.fillText((isDarkness ? '🌑 ' : '💨 ') + cloud.turnsLeft + 't', labelX, labelY);
    });
  }

  // ─── Highlighted tiles ──────────────────────────────────
  CS.highlightedTiles.forEach(({ x, y, color }) => {
    ctx.fillStyle = color; ctx.fillRect(x * cs, y * cs, cs, cs);
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1; ctx.strokeRect(x * cs + 1, y * cs + 1, cs - 2, cs - 2);
  });

  // ─── Active unit glow ────────────────────────────────────
  if (CS.activeUnit) {
    const activeAlly = CS.allies.find(a => a.gridId === CS.activeUnit && a.hp > 0 && !a.perished);
    if (activeAlly) {
      const _gPulse = 0.55 + 0.45 * Math.sin(Date.now() / 500);
      const _gx = activeAlly.x * cs, _gy = activeAlly.y * cs;
      const _grad = ctx.createRadialGradient(_gx + cs/2, _gy + cs/2, 0, _gx + cs/2, _gy + cs/2, cs * 0.52);
      _grad.addColorStop(0, `rgba(201,162,39,${(0.18 + _gPulse * 0.12).toFixed(2)})`);
      _grad.addColorStop(1, 'rgba(201,162,39,0)');
      ctx.fillStyle = _grad; ctx.fillRect(_gx, _gy, cs, cs);
      const _bl = cs * 0.22;
      ctx.strokeStyle = `rgba(201,162,39,${(0.65 + _gPulse * 0.35).toFixed(2)})`;
      ctx.lineWidth = 2;
      const _corners = [[_gx, _gy], [_gx + cs, _gy], [_gx, _gy + cs], [_gx + cs, _gy + cs]];
      const _dirs = [[1,1], [-1,1], [1,-1], [-1,-1]];
      _corners.forEach(([cx2, cy2], i) => {
        const [dx2, dy2] = _dirs[i];
        ctx.beginPath(); ctx.moveTo(cx2 + dx2 * _bl, cy2); ctx.lineTo(cx2, cy2); ctx.lineTo(cx2, cy2 + dy2 * _bl); ctx.stroke();
      });
    }
  }

  // ─── Fog of war ──────────────────────────────────────────
  FOG.drawFog(ctx, cs);

  // ─── Enemies ─────────────────────────────────────────────
  CS.enemies.filter(e => e.hp > 0 && !e.perished).forEach(e => {
    if (!FOG.isVisible(e.x, e.y)) return;
    const _ent = Date.now();
    const isBlinded = e.status === 'blinded' || e.status === 'confused';
    if (isBlinded) {
      const bp = 0.5 + 0.5 * Math.sin(_ent / 250);
      ctx.fillStyle = `rgba(120,120,120,${(0.18 + bp * 0.12).toFixed(2)})`;
      ctx.fillRect(e.x * cs, e.y * cs, cs, cs);
    }
    drawUnit(ctx, e, '#8b1a1a', '#ff4444', false);
    if (e.isTarget) {
      ctx.strokeStyle = '#ff2222'; ctx.lineWidth = 2.5; ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.arc(e.x * cs + cs / 2, e.y * cs + cs / 2, cs * 0.46, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }
    if (e.isCarrier && e.carriedLoot) {
      ctx.font = `${cs * 0.28}px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(e.carriedLoot.icon, e.x * cs + cs * 0.75, e.y * cs + 2);
    }
  });

  // ─── Loot on floor ──────────────────────────────────────
  if (CS.lootOnFloor) {
    const lx = CS.lootOnFloor.x * cs + cs / 2, ly = CS.lootOnFloor.y * cs + cs / 2;
    const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 300);
    ctx.fillStyle = `rgba(240,200,0,${0.15 + pulse * 0.15})`;
    ctx.beginPath(); ctx.arc(lx, ly, cs * 0.4, 0, Math.PI * 2); ctx.fill();
    ctx.font = `${cs * 0.5}px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(CS.lootOnFloor.icon, lx, ly);
  }

  // ─── Gold pickups ────────────────────────────────────────
  if (CS.goldPickups && CS.goldPickups.length) {
    var _p2 = 0.5 + 0.5 * Math.sin(Date.now() / 250 + 1);
    CS.goldPickups.forEach(function(bag) {
      var bx = bag.x * cs + cs / 2, by = bag.y * cs + cs / 2;
      ctx.fillStyle = 'rgba(255,210,0,' + (0.18 + _p2 * 0.18) + ')';
      ctx.beginPath(); ctx.arc(bx, by, cs * 0.36, 0, Math.PI * 2); ctx.fill();
      ctx.font = Math.round(cs * 0.5) + 'px serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('💰', bx, by);
      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold ' + Math.round(cs * 0.18) + 'px sans-serif';
      ctx.fillText(bag.amount + 'G', bx, by + cs * 0.38);
    });
  }

  // ─── Prisoner ─────────────────────────────────────────────
  if (CS.prisoner && !CS.prisoner.escaped) {
    const _pr = CS.prisoner; const _prx = _pr.x * cs, _pry = _pr.y * cs;
    const _prCx = _prx + cs / 2, _prCy = _pry + cs / 2;
    const _prPulse = 0.5 + 0.5 * Math.sin(Date.now() / 400);
    ctx.fillStyle = _pr.freed ? 'rgba(61,170,125,' + (0.2 + _prPulse * 0.15) + ')' : 'rgba(200,100,0,' + (0.15 + _prPulse * 0.12) + ')';
    ctx.fillRect(_prx, _pry, cs, cs);
    const _prImg = getImg('Prisoner.png');
    const _prFacing = _pr.facing || 'east';
    const _prAngle = FACING_ANGLE[_prFacing] ?? 0;
    const _prSize = cs * 0.82;
    if (_prImg && _prImg.naturalWidth > 0) {
      ctx.save(); ctx.beginPath(); ctx.arc(_prCx, _prCy, cs * 0.40, 0, Math.PI * 2); ctx.clip();
      ctx.translate(_prCx, _prCy); ctx.rotate(_prAngle);
      ctx.drawImage(_prImg, -_prSize / 2, -_prSize / 2, _prSize, _prSize);
      ctx.restore();
      ctx.strokeStyle = _pr.freed ? 'rgba(61,170,125,0.7)' : 'rgba(220,140,0,0.7)';
      ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(_prCx, _prCy, cs * 0.40, 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.font = (cs * 0.52) + 'px serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(_pr.freed ? '\uD83E\uDDD1' : '\u26D3\uFE0F', _prCx, _prCy);
    }
    ctx.fillStyle = _pr.freed ? '#88ffcc' : '#ffaa44';
    ctx.font = 'bold ' + Math.round(cs * 0.17) + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(_pr.freed ? 'FREED' : 'PRISONER', _prCx, _pry + 2);
  }

  // ─── Doom bags ────────────────────────────────────────────
  CS.doomBags.forEach(bag => {
    const bx = bag.x * cs, by = bag.y * cs;
    const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 350);
    ctx.fillStyle = "rgba(180,0,0," + (0.15 + pulse * 0.12) + ")";
    ctx.fillRect(bx, by, cs, cs);
    ctx.font = (cs * 0.5) + "px serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("💀", bx + cs / 2, by + cs / 2);
    const itemCount = (bag.items?.length || 0) + (bag.weapon ? 1 : 0);
    if (itemCount > 0) {
      ctx.fillStyle = "#ff4444";
      ctx.beginPath(); ctx.arc(bx + cs * 0.78, by + cs * 0.22, cs * 0.18, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = (cs * 0.2) + "px sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(String(itemCount), bx + cs * 0.78, by + cs * 0.22);
    }
  });

  // ─── Allies ──────────────────────────────────────────────
  CS.allies.filter(a => !a.perished).forEach(a => {
    const cls = CLASSES[a.class];
    const selected = CS.selectedAlly === a.gridId;
    const isInvisible = a.buffs?.some(b => b.type === 'invisible');
    const isRaging    = a.buffs?.some(b => b.type === 'rage' || b.type === 'bloodlust');
    const isDefending = a.buffs?.some(b => b.type === 'defend' || b.type === 'iron_body');
    const isDecoy     = a.buffs?.some(b => b.type === 'decoy');
    const hasMirror   = a.buffs?.some(b => b.type === 'mirror');
    const apx = a.x * cs, apy = a.y * cs;
    const acx = apx + cs / 2, acy = apy + cs / 2;
    const _nt = Date.now();

    if (isRaging) {
      const ragePulse = 0.5 + 0.5 * Math.sin(_nt / 160);
      ctx.fillStyle = `rgba(200,30,0,${(0.15 + ragePulse * 0.12).toFixed(2)})`;
      ctx.fillRect(apx, apy, cs, cs);
      ctx.strokeStyle = `rgba(255,80,0,${(0.5 + ragePulse * 0.5).toFixed(2)})`;
      ctx.lineWidth = 2.5; ctx.strokeRect(apx + 1, apy + 1, cs - 2, cs - 2);
    }
    if (isDefending) {
      const defPulse = 0.5 + 0.5 * Math.sin(_nt / 350);
      ctx.fillStyle = `rgba(30,80,200,${(0.12 + defPulse * 0.08).toFixed(2)})`;
      ctx.fillRect(apx, apy, cs, cs);
      ctx.strokeStyle = `rgba(80,160,255,${(0.45 + defPulse * 0.45).toFixed(2)})`;
      ctx.lineWidth = 2; ctx.strokeRect(apx + 1, apy + 1, cs - 2, cs - 2);
    }
    if (hasMirror) {
      const mirPulse = 0.5 + 0.5 * Math.sin(_nt / 280);
      ctx.strokeStyle = `rgba(200,200,255,${(0.3 + mirPulse * 0.4).toFixed(2)})`;
      ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.arc(acx, acy, cs * 0.44, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }

    if (a.escaped) {
      ctx.globalAlpha = 0.3;
      drawUnit(ctx, a, cls.color, '#88ffcc', true, false);
      ctx.globalAlpha = 1;
    } else if (a.doomed) {
      const pulse = 0.5 + 0.5 * Math.sin(_nt / 200);
      ctx.globalAlpha = 0.35 + pulse * 0.35;
      drawUnit(ctx, a, '#aa2222', '#ff4444', true, false);
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.beginPath(); ctx.arc(acx, acy, cs * 0.3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff3333';
      ctx.font = 'bold ' + (cs * 0.36) + 'px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(a.doomCountdown), acx, acy);
      ctx.font = (cs * 0.24) + 'px serif';
      ctx.fillText('💀', acx, a.y * cs + cs * 0.12);
    } else if (isInvisible) {
      const invPulse = 0.5 + 0.5 * Math.sin(_nt / 240);
      ctx.globalAlpha = 0.22 + invPulse * 0.12;
      drawUnit(ctx, a, cls.color, '#aaccff', true, selected);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = `rgba(140,200,255,${(0.35 + invPulse * 0.45).toFixed(2)})`;
      ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.arc(acx, acy, cs * 0.42, _nt / 600, _nt / 600 + Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = Math.round(cs * 0.26) + 'px serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.globalAlpha = 0.55 + invPulse * 0.3;
      ctx.fillText('👁', acx, apy + cs * 0.3);
      ctx.globalAlpha = 1;
    } else {
      drawUnit(ctx, a, cls.color, selected ? '#f0c040' : '#aabbcc', true, selected);
    }

    if (a.hasLoot) {
      ctx.font = (cs * 0.28) + 'px serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText('📦', a.x * cs + cs * 0.75, a.y * cs + 2);
    }
    if (isDecoy) {
      ctx.font = Math.round(cs * 0.22) + 'px serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText('🪆', apx + cs * 0.2, apy + cs * 0.02);
    }
  });

  // ─── Hit flashes ──────────────────────────────────────────
  if (!CS.hitFlashes) CS.hitFlashes = [];
  const now = Date.now();
  CS.hitFlashes = CS.hitFlashes.filter(f => now - f.t < f.dur);
  CS.hitFlashes.forEach(f => {
    const age = (now - f.t) / f.dur;
    const alpha = (1 - age) * 0.65;
    ctx.fillStyle = f.color.replace('A', String(alpha.toFixed(2)));
    ctx.fillRect(f.x * cs, f.y * cs, cs, cs);
    ctx.strokeStyle = f.color.replace('A', String(Math.min(1, alpha * 1.8).toFixed(2)));
    ctx.lineWidth = 2;
    ctx.strokeRect(f.x * cs + 1, f.y * cs + 1, cs - 2, cs - 2);
  });

  // ─── Height overlay ──────────────────────────────────────
  _drawHeightOverlay(ctx, cs);

  // ─── CT queue in header ──────────────────────────────────
  renderCTQueue();
}

// ─── Helper functions for drawCanvas (already defined elsewhere) ──
function _drawHeightOverlay(ctx, cs) {
  const showHeightNum = cs >= 40;
  if (showHeightNum) {
    ctx.font = 'bold ' + Math.round(cs * 0.18) + 'px sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  }
  const now = Date.now();
  for (let y = 0; y < CS.gridH; y++) {
    for (let x = 0; x < CS.gridW; x++) {
      const key = CS.grid[y]?.[x] || 'empty';
      const tileData = TERRAIN_TILES[key];
      if (!tileData?.passable) continue;
      const h = tileData.height || 0;
      const px = x * cs, py = y * cs;
      if (h >= 3) {
        ctx.fillStyle = 'rgba(80,60,20,0.18)'; ctx.fillRect(px, py, cs, cs);
        ctx.fillStyle = 'rgba(200,160,60,0.45)'; ctx.fillRect(px, py, cs, 2); ctx.fillRect(px, py, 2, cs);
      } else if (h === 2) {
        ctx.fillStyle = 'rgba(60,50,20,0.12)'; ctx.fillRect(px, py, cs, cs);
        ctx.fillStyle = 'rgba(180,140,50,0.3)'; ctx.fillRect(px, py, cs, 2);
      } else if (h === 1) {
        ctx.fillStyle = 'rgba(255,255,255,0.04)'; ctx.fillRect(px, py, cs, cs);
        ctx.fillStyle = 'rgba(200,200,200,0.15)'; ctx.fillRect(px, py, cs, 1);
      }
      if (h > 0 && showHeightNum) {
        ctx.fillStyle = h >= 3 ? 'rgba(255,220,100,0.55)' : h === 2 ? 'rgba(255,220,100,0.45)' : 'rgba(255,220,100,0.35)';
        ctx.fillText(h, px + 2, py + 2);
      }
      const lightLevel = tileData.light ?? 1.0;
      if (lightLevel < 0.5) {
        ctx.fillStyle = 'rgba(0,0,10,' + ((1 - lightLevel) * 0.55).toFixed(2) + ')';
        ctx.fillRect(px, py, cs, cs);
      }
      if (key === 'water') {
        const wave = 0.4 + 0.2 * Math.sin(now / 500 + x + y);
        ctx.fillStyle = 'rgba(40,100,180,' + (wave * 0.25).toFixed(2) + ')';
        ctx.fillRect(px, py, cs, cs);
      }
    }
  }
}
