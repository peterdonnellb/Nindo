// ── ITEM / WEAPON IMAGE SYSTEM ──
// PNG files live in an "items/" folder next to the HTML.
// If a file is absent the emoji icon is shown as fallback.
// File name = item.id + ".png"  e.g.  items/kunai.png
// ═══════════════════════════════════════════════════════════════

// Tracks confirmed-existing image ids
const _ITEM_IMG_CACHE = {};  // id → true | false | null(pending)

function _checkItemImg(id) {
  if (id in _ITEM_IMG_CACHE) return;
  _ITEM_IMG_CACHE[id] = null;
  const _p = new Image();
  _p.onload  = () => { _ITEM_IMG_CACHE[id] = true;  _itemImgSwapAll(id); };
  _p.onerror = () => { _ITEM_IMG_CACHE[id] = false; };
  _p.src = 'items/' + id + '.png';
}

// Upgrade all matching emoji spans in the live DOM once their image has loaded
function _itemImgSwapAll(id) {
  document.querySelectorAll('[data-iimg="' + id + '"]').forEach(function(el) {
    const size  = el.dataset.isize  || '28px';
    const extra = el.dataset.iextra || '';
    const img   = document.createElement('img');
    img.src = 'items/' + id + '.png';
    img.alt = el.title || ''; img.title = el.title || '';
    img.draggable = false; img.className = el.className;
    img.style.cssText = 'width:' + size + ';height:' + size
      + ';object-fit:contain;display:block;image-rendering:auto;' + extra;
    el.replaceWith(img);
  });
}

function _prewarmItemImages() {
  const ids = new Set();
  Object.values(WEAPONS).forEach(function(cat) { (cat.items||[]).forEach(function(w){ ids.add(w.id); }); });
  (ITEMS.healing||[]).concat(ITEMS.armor||[]).concat(ITEMS.tactical||[]).forEach(function(i){ ids.add(i.id); });
  ids.forEach(_checkItemImg);
}

// Synchronous: returns <img> if confirmed, else a self-upgrading tagged emoji span
function itemImg(item, size, extraStyle) {
  if (!item) return '';
  size = size || '28px'; extraStyle = extraStyle || '';
  if (_ITEM_IMG_CACHE[item.id] === true) {
    return '<img src="items/' + item.id + '.png" alt="' + item.name + '" title="' + item.name
      + '" draggable="false" style="width:' + size + ';height:' + size
      + ';object-fit:contain;display:block;image-rendering:auto;' + extraStyle + '">';
  }
  _checkItemImg(item.id);
  return '<span data-iimg="' + item.id + '" data-isize="' + size + '" data-iextra="' + extraStyle
    + '" title="' + item.name + '" style="display:inline-flex;align-items:center;justify-content:center;'
    + 'width:' + size + ';height:' + size + ';font-size:calc(' + size + ' * 0.85);line-height:1;' + extraStyle + '">'
    + item.icon + '</span>';
}

// Alias with optional extra class — same self-upgrade behaviour
function itemImgAsync(item, size, extraStyle, cls) {
  if (!item) return '';
  size = size || '28px'; extraStyle = extraStyle || ''; cls = cls || '';
  if (_ITEM_IMG_CACHE[item.id] === true) {
    return '<img src="items/' + item.id + '.png" alt="' + item.name + '" title="' + item.name
      + '" class="' + cls + '" draggable="false" style="width:' + size + ';height:' + size
      + ';object-fit:contain;display:block;image-rendering:auto;' + extraStyle + '">';
  }
  _checkItemImg(item.id);
  return '<span data-iimg="' + item.id + '" data-isize="' + size + '" data-iextra="' + extraStyle
    + '" class="' + cls + '" title="' + item.name
    + '" style="display:inline-flex;align-items:center;justify-content:center;width:' + size
    + ';height:' + size + ';font-size:calc(' + size + ' * 0.85);line-height:1;' + extraStyle + '">'
    + item.icon + '</span>';
}

function generateShopWeapons() {
  const allWeapons = [];
  Object.entries(WEAPONS).forEach(([type, cat]) => {
    cat.items.forEach(w => allWeapons.push({ ...w, type }));
  });
  const shuffled = allWeapons.sort(() => Math.random() - 0.5);
  return shuffled.slice(0, 10);
}

function generateShopItems() {
  const all = [...ITEMS.healing, ...ITEMS.armor, ...ITEMS.tactical];
  return all.sort(() => Math.random() - 0.5).slice(0, 12);
}

const TERRAIN_NAMES = ['village','castle','dungeon','fortress','palace','docks','forest','keep'];

function generateDynamicMission(seed, difficultyBias, forcedType) {
  const types = Object.keys(MISSION_TEMPLATES);
  const tKey = forcedType && MISSION_TEMPLATES[forcedType]
    ? forcedType
    : types[Math.floor(seed * types.length) % types.length];
  const tmpl = MISSION_TEMPLATES[tKey];

  // Deterministic-ish random from seed
  const r = (n) => { seed = (seed * 1664525 + 1013904223) & 0xffffffff; return Math.abs(seed % n); };

  const nameTemplate = tmpl.names[r(tmpl.names.length)];
  const targetWord = tmpl.targets[r(tmpl.targets.length)];
  const name = nameTemplate.replace('{target}', targetWord);
  const intro = tmpl.intros[r(tmpl.intros.length)];

  const baseDiff = 1 + (difficultyBias % 4);
  const difficulty = Math.min(5, Math.max(1, baseDiff + r(2)));
  const baseReward = 80 + difficulty * 70 + r(difficulty * 40);
  const terrain = TERRAIN_NAMES[r(TERRAIN_NAMES.length)];
  const enemyGroup = tmpl.enemyGroups[r(tmpl.enemyGroups.length)];

  // Scale enemies by difficulty
  const scaledEnemies = enemyGroup.map(g => ({
    type: g.type,
    count: Math.max(1, g.count + Math.floor(difficulty / 2))
  }));

  const requiredLevel = Math.max(1, difficulty - 1);
  const id = 'dyn_' + Math.abs(seed).toString(16).slice(0, 8);

  // Derive objective fields from mission type
  let targetEnemy = null, carrierEnemy = null, lootItem = null, turnLimit = 0;
  if (tKey === 'assassination') {
    const lastGroup = scaledEnemies[scaledEnemies.length - 1];
    if (lastGroup) targetEnemy = lastGroup.type;
  } else if (tKey === 'theft') {
    // Prefer scribe or advisor; fall back to any non-guard type; last resort: use last enemy type
    let carrier = scaledEnemies.find(g => g.type === 'scribe' || g.type === 'advisor');
    if (!carrier) carrier = scaledEnemies.find(g => g.type !== 'guard' && g.type !== 'patrol_guard' && g.type !== 'elite_guard');
    if (!carrier) carrier = scaledEnemies[scaledEnemies.length - 1]; // absolute fallback
    if (carrier) {
      carrierEnemy = carrier.type;
      const lootNames = ['Sacred Scroll','War Chest','Poison Formula','Clan Seal','Trade Ledger','Forbidden Map','Jade Cipher','Ancestral Blade'];
      lootItem = { name: lootNames[r(lootNames.length)], icon: ['📜','💰','🧪','🔖','📒','🗺️','💎','⚔️'][r(8)] };
    }
    // Safety: ensure at least one carrier-type enemy exists in the group
    if (carrierEnemy && !scaledEnemies.some(g => g.type === carrierEnemy)) {
      scaledEnemies.push({ type: carrierEnemy, count: 4 });
    }
  } else if (tKey === 'espionage') {
    turnLimit = 16 + difficulty * 4;
  } else if (tKey === 'agitation') {
    turnLimit = 20 + difficulty * 4;
  } else if (tKey === 'rescue') {
    // Rescue missions: jailer is the key enemy (carries "keys")
    const jailerGroup = scaledEnemies.find(g => g.type === 'jailer');
    if (jailerGroup) {
      carrierEnemy = 'jailer';
      lootItem = { name: 'Prison Key', icon: '🔑' };
    }
  }

  return {
    id, name, type: tKey,
    desc: `${['A shadow contract has been issued.','Intel from a trusted source.','The clan needs this done.','Urgent — time-sensitive operation.','High-value target identified.'][r(5)]} ${intro}`,
    difficulty, reward: baseReward,
    recruitReward: null,
    requiredLevel,
    enemies: scaledEnemies,
    targetEnemy, carrierEnemy, lootItem,
    turnLimit: turnLimit || 0,
    terrain,
    tags: tmpl.tags,
    intro,
    isDynamic: true
  };
}

// ===== SHADOW REPUTATION SYSTEM =====

// Reputation bands:
//   Stealth: -100 (FEARED) ... 0 (NEUTRAL) ... 100 (PHANTOM)
//   Honor:   -100 (RUTHLESS) ... 0 (NEUTRAL) ... 100 (RIGHTEOUS)

const REP_EVENTS = {
  // Stealth
  KILL_UNDETECTED:        { stealth: +8,  honor:  0,  label: 'Silent kill' },
  DETECTED_BEFORE_STRIKE: { stealth: -5,  honor:  0,  label: 'Detected!' },
  MISSION_UNDETECTED:     { stealth: +15, honor: +5,  label: 'Mission: undetected' },
  OBJECTIVE_UNDETECTED:   { stealth: +20, honor: +8,  label: 'Objective: ghost run' },
  ENEMY_ALERTED:          { stealth: -3,  honor:  0,  label: 'Enemy alerted' },
  SMOKE_FLEE:             { stealth: -5,  honor: -5,  label: 'Fled the field' },

  // Honor
  MISSION_SUCCESS:        { stealth:  0,  honor: +10, label: 'Mission completed' },
  MISSION_FAILED:         { stealth:  0,  honor: -8,  label: 'Mission failed' },
  MISSION_TIMED_OUT:      { stealth:  0,  honor: -6,  label: 'Time expired' },
  TARGET_ONLY_KILL:       { stealth: +5,  honor: +12, label: 'Target eliminated precisely' },
  ESCORT_UNDAMAGED:       { stealth:  0,  honor: +15, label: 'Escort protected' },
  RESCUE_SUCCESS:         { stealth: +5,  honor: +12, label: 'Rescue successful' },
  ALLY_PERISHED:          { stealth:  0,  honor: -10, label: 'Ally lost permanently' },
};

function gainRep(eventKey) {
  const ev = REP_EVENTS[eventKey];
  if (!ev) return;
  if (!GS.reputation) GS.reputation = { stealth: 0, honor: 0 };
  GS.reputation.stealth = Math.max(-100, Math.min(100, GS.reputation.stealth + ev.stealth));
  GS.reputation.honor   = Math.max(-100, Math.min(100, GS.reputation.honor   + ev.honor));
  if (ev.stealth !== 0 || ev.honor !== 0) {
    const parts = [];
    if (ev.stealth > 0) parts.push('+' + ev.stealth + ' Stealth');
    if (ev.stealth < 0) parts.push(ev.stealth + ' Stealth');
    if (ev.honor > 0)   parts.push('+' + ev.honor   + ' Honor');
    if (ev.honor < 0)   parts.push(ev.honor   + ' Honor');
    if (parts.length) addLog('\u2605 Rep: ' + ev.label + ' (' + parts.join(', ') + ')', 'system');
  }
}

function getStealthTier() {
  const s = (GS.reputation || {}).stealth || 0;
  if (s >= 80)  return { name: 'Phantom',     color: '#88aaff', icon: '\u{1F47B}', desc: 'You are a ghost. Enemies rarely see you coming.' };
  if (s >= 50)  return { name: 'Shadow',      color: '#6688cc', icon: '\u{1F30D}', desc: 'Your movements are whisper-quiet.' };
  if (s >= 20)  return { name: 'Shinobi',     color: '#5566aa', icon: '\u{1F977}', desc: 'Trained in the ways of stealth.' };
  if (s >= -20) return { name: 'Wanderer',    color: '#888',    icon: '\u{1F6B6}', desc: 'Neither feared nor hidden.' };
  if (s >= -50) return { name: 'Reckless',    color: '#cc6633', icon: '\u{1F525}', desc: 'You leave chaos in your wake.' };
  if (s >= -80) return { name: 'Feared',      color: '#cc3333', icon: '\u{1F480}', desc: 'Enemies attack harder when they see you.' };
  return              { name: 'Terror',       color: '#ff2222', icon: '\u{1F47F}', desc: 'Your name alone strikes fear.' };
}

function getHonorTier() {
  const h = (GS.reputation || {}).honor || 0;
  if (h >= 80)  return { name: 'Righteous',   color: '#ffdd44', icon: '\u{1F31F}', desc: 'A legend of duty and virtue.' };
  if (h >= 50)  return { name: 'Honorable',   color: '#ddaa22', icon: '\u2605',   desc: 'Your word is your bond.' };
  if (h >= 20)  return { name: 'Reliable',    color: '#aabb55', icon: '\u2714',   desc: 'Trusted to deliver results.' };
  if (h >= -20) return { name: 'Mercenary',   color: '#888',    icon: '\u26AA',   desc: 'You work for gold, nothing more.' };
  if (h >= -50) return { name: 'Treacherous', color: '#aa5522', icon: '\u{1F5E1}\uFE0F', desc: 'You cannot be trusted.' };
  if (h >= -80) return { name: 'Ruthless',    color: '#cc2222', icon: '\u{1F480}', desc: 'Victory at any cost.' };
  return              { name: 'Disgraced',    color: '#990000', icon: '\u{1F6AB}', desc: 'Shunned by shadow and light alike.' };
}

// Ensure GS has achievements arrays; called after loadGame
function initAchievements() {
  if (!GS.achievements) GS.achievements = [];
  if (!GS.achievementStats) GS.achievementStats = {};
  const st = GS.achievementStats;
  if (!st.killsByType)  st.killsByType  = {};
  if (!st.totalKills)   st.totalKills   = 0;
  if (!st.classesUsed)  st.classesUsed  = [];
  if (!st.soloMissions) st.soloMissions = [];  // mission ids completed solo
  // Check class achievements for existing clan members on load
  _checkClassAchievements();
  _checkClanSizeAchievements();
}

function _hasAch(id)  { return (GS.achievements || []).includes(id); }

function _earnAch(id) {
  if (_hasAch(id)) return;
  const def = ACHIEVEMENTS.find(a => a.id === id);
  if (!def) return;
  GS.achievements.push(id);
  const earned = GS.achievements.length;
  const total  = ACHIEVEMENTS.length;
  toast(`🏅 Achievement: ${def.name}  (${earned}/${total})`, 'success');
  addLog(`🏅 Achievement unlocked: ${def.name} — ${def.desc}`, 'special');
  _saveGameDebounced(); // batched — may fire multiple achievements per turn
  _updateNavDots();
}

function _checkClassAchievements() {
  const classes = new Set(GS.clan.map(n => n.class));
  ['shinobi','kunoichi','ronin','monk','shadow','berserker'].forEach(c => {
    if (classes.has(c)) _earnAch('class_' + c);
  });
  if (classes.size >= 6) _earnAch('all_classes');
}

function _checkClanSizeAchievements() {
  if (GS.clan.length >= 2) _earnAch('first_recruit');
  if (GS.clan.length >= 3) _earnAch('clan_3');
  if (GS.clan.length >= 6) _earnAch('clan_6');
}

// Called from recordKill — checks first-kill and milestone achievements
function achOnEnemyKill(enemyTypeKey) {
  if (!GS.achievementStats) initAchievements();
  const st = GS.achievementStats;
  if (!st.killsByType) st.killsByType = {};
  st.killsByType[enemyTypeKey] = (st.killsByType[enemyTypeKey] || 0) + 1;
  st.totalKills = (st.totalKills || 0) + 1;

  // First kill achievements
  const firstKillMap = {
    guard: 'kill_guard', patrol_guard: 'kill_patrol_guard',
    elite_guard: 'kill_elite_guard', captain: 'kill_captain',
    advisor: 'kill_advisor', scribe: 'kill_scribe',
    jailer: 'kill_jailer', thug: 'kill_thug',
    boss_thug: 'kill_boss_thug', collector: 'kill_collector',
    bounty_hunter: 'kill_bounty_hunter', kunoichi_boss: 'kill_kunoichi_boss',
    warlord: 'kill_warlord',
  };
  if (firstKillMap[enemyTypeKey]) _earnAch(firstKillMap[enemyTypeKey]);

  // Kill milestones
  const t = st.totalKills;
  if (t >= 10)  _earnAch('kills_10');
  if (t >= 50)  _earnAch('kills_50');
  if (t >= 100) _earnAch('kills_100');
  if (t >= 250) _earnAch('kills_250');
}

// Called at end of mission victory — checks feats
function achOnVictory(mission, partySize, turnCount) {
  if (!GS.achievementStats) initAchievements();
  const st = GS.achievementStats;

  // Full squad
  if (partySize >= 3) _earnAch('full_squad');

  // Speed run (5 turns or fewer)
  if (turnCount <= 5) _earnAch('speed_run');

  // No kills (non-assassination)
  if (mission.type !== 'assassination' && CS.missionStats?.totalKills === 0) _earnAch('no_kills');

  // Flawless — no ally took any damage
  if (!CS.missionStats?.alliesTookDamage) {
    _earnAch('flawless_mission');
    if (partySize === 1) _earnAch('flawless_solo');
  }

  // Solo arc check
  if (partySize === 1) {
    _earnAch('solo_mission');
    if (!st.soloMissions) st.soloMissions = [];
    if (mission.id && !st.soloMissions.includes(mission.id)) st.soloMissions.push(mission.id);

    // Check solo arc — did we complete ALL missions in an arc solo?
    // (mission.id is already in completedMissions when this runs for non-dynamic missions)
    const tentativeCompleted = new Set([...(GS.completedMissions || []), mission.id]);
    STORY_ARCS.forEach(arc => {
      if (_hasAch('arc' + arc.arc + '_solo_internal')) return;
      const allDone = arc.ids.every(id => tentativeCompleted.has(id));
      const allSolo = arc.ids.every(id => st.soloMissions.includes(id));
      if (allDone && allSolo) {
        _earnAch('solo_arc');
        if (!GS.achievements.includes('arc' + arc.arc + '_solo_internal'))
          GS.achievements.push('arc' + arc.arc + '_solo_internal');
      }
    });
  }
} // end achOnVictory

// ── BADGE RENDERER ──
// Draws a themed SVG-style badge on a canvas element.
// Each badge has a unique shape + icon combination.
function drawBadge(canvas, achId, earned) {
  const def   = ACHIEVEMENTS.find(a => a.id === achId);
  if (!def) return;
  const ctx   = canvas.getContext('2d');
  const W     = canvas.width, H = canvas.height;
  const cx    = W / 2, cy = H / 2;
  const R     = Math.min(W, H) * 0.44;
  ctx.clearRect(0, 0, W, H);

  const col   = earned ? def.color : '#333344';
  const alpha = earned ? 1 : 0.45;
  ctx.globalAlpha = alpha;

  // ── Outer ring shape (category determines shape) ──
  const shapeFn = {
    first_blood: () => _drawHexBadge(ctx, cx, cy, R, col, earned),
    feats:       () => _drawStarBadge(ctx, cx, cy, R, col, earned),
    arcs:        () => _drawDiamondBadge(ctx, cx, cy, R, col, earned),
    milestones:  () => _drawShieldBadge(ctx, cx, cy, R, col, earned),
    combat:      () => _drawCircleBadge(ctx, cx, cy, R, col, earned),
    class:       () => _drawOctBadge(ctx, cx, cy, R, col, earned),
    clan:        () => _drawScrollBadge(ctx, cx, cy, R, col, earned),
  }[def.cat] || (() => _drawCircleBadge(ctx, cx, cy, R, col, earned));
  shapeFn();

  // ── Inner icon ──
  const iconSize = Math.round(R * 0.72);
  const iconMap = {
    shield: '🛡️', patrol: '🗡️', elite: '⚔️', captain: '👑', advisor: '🧙',
    scroll: '📜', key: '🔑', fist: '🥊', bigfist: '💪', coin: '🪙',
    target: '🎯', rival: '🐡', warlord: '👹', ghost: '👻', lone: '🌑',
    solosarc: '⭐', phantom: '✨', mercy: '🌿', wind: '💨', triad: '⛩',
    arc1: '①', arc2: '②', arc3: '③', arc4: '④', arc5: '⑤',
    blade10: '🗡️', blade50: '⚔️', blade100: '💀', reaper: '☠️',
    shinobi: '🥷', kunoichi: '🐡', ronin: '⚔️', monk: '☯️',
    shadow: '🌑', berserker: '💢', rainbow: '🌈',
    chi: '☯️', poison: '☠️', stealth: '🌒', execute: '💀',
    revive: '💊', fire: '🔥', gold: '💰',
    clan3: '🏯', clan6: '🏰', vet: '⭐', recruit: '⊕',
  };
  const icon = iconMap[def.badge] || '●';
  ctx.font = `${iconSize}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.globalAlpha = earned ? 0.92 : 0.25;
  ctx.fillText(icon, cx, cy + iconSize * 0.04);

  // ── Earned glow ring ──
  if (earned) {
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, R + 3, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// Shape helpers
function _hexPoints(cx, cy, R) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = (Math.PI / 3) * i - Math.PI / 6;
    pts.push([cx + R * Math.cos(a), cy + R * Math.sin(a)]);
  }
  return pts;
}
function _polyPath(ctx, pts) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  pts.slice(1).forEach(p => ctx.lineTo(p[0], p[1])); ctx.closePath();
}
function _drawHexBadge(ctx, cx, cy, R, col, earned) {
  const pts = _hexPoints(cx, cy, R);
  _polyPath(ctx, pts);
  ctx.fillStyle = earned ? col + '22' : '#22222a';
  ctx.fill();
  ctx.strokeStyle = earned ? col : '#444455';
  ctx.lineWidth = 2.5; ctx.stroke();
  // Inner hex
  const innerPts = _hexPoints(cx, cy, R * 0.82);
  _polyPath(ctx, innerPts);
  ctx.strokeStyle = earned ? col + '88' : '#33334455'; ctx.lineWidth = 1; ctx.stroke();
}
function _drawStarBadge(ctx, cx, cy, R, col, earned) {
  const pts = [], n = 5, ir = R * 0.46;
  for (let i = 0; i < n * 2; i++) {
    const a = (Math.PI / n) * i - Math.PI / 2;
    const r = i % 2 === 0 ? R : ir;
    pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  _polyPath(ctx, pts);
  ctx.fillStyle = earned ? col + '22' : '#22222a'; ctx.fill();
  ctx.strokeStyle = earned ? col : '#444455'; ctx.lineWidth = 2.5; ctx.stroke();
}
function _drawDiamondBadge(ctx, cx, cy, R, col, earned) {
  ctx.beginPath(); ctx.moveTo(cx, cy - R); ctx.lineTo(cx + R * 0.7, cy);
  ctx.lineTo(cx, cy + R); ctx.lineTo(cx - R * 0.7, cy); ctx.closePath();
  ctx.fillStyle = earned ? col + '22' : '#22222a'; ctx.fill();
  ctx.strokeStyle = earned ? col : '#444455'; ctx.lineWidth = 2.5; ctx.stroke();
}
function _drawShieldBadge(ctx, cx, cy, R, col, earned) {
  const t = cy - R, b = cy + R, l = cx - R * 0.75, r2 = cx + R * 0.75;
  ctx.beginPath(); ctx.moveTo(l, t); ctx.lineTo(r2, t);
  ctx.lineTo(r2, cy); ctx.quadraticCurveTo(r2, b, cx, b);
  ctx.quadraticCurveTo(l, b, l, cy); ctx.lineTo(l, t); ctx.closePath();
  ctx.fillStyle = earned ? col + '22' : '#22222a'; ctx.fill();
  ctx.strokeStyle = earned ? col : '#444455'; ctx.lineWidth = 2.5; ctx.stroke();
}
function _drawCircleBadge(ctx, cx, cy, R, col, earned) {
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.fillStyle = earned ? col + '22' : '#22222a'; ctx.fill();
  ctx.strokeStyle = earned ? col : '#444455'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.82, 0, Math.PI * 2);
  ctx.strokeStyle = earned ? col + '66' : '#33334455'; ctx.lineWidth = 1; ctx.stroke();
}
function _drawOctBadge(ctx, cx, cy, R, col, earned) {
  const pts = [];
  for (let i = 0; i < 8; i++) {
    const a = (Math.PI / 4) * i - Math.PI / 8;
    pts.push([cx + R * Math.cos(a), cy + R * Math.sin(a)]);
  }
  _polyPath(ctx, pts);
  ctx.fillStyle = earned ? col + '22' : '#22222a'; ctx.fill();
  ctx.strokeStyle = earned ? col : '#444455'; ctx.lineWidth = 2.5; ctx.stroke();
}
function _drawScrollBadge(ctx, cx, cy, R, col, earned) {
  const rw = R * 0.8, rh = R * 0.9;
  ctx.beginPath();
  // roundRect polyfill for older browsers
  const x0 = cx - rw, y0 = cy - rh, w = rw * 2, h = rh * 2, r = R * 0.18;
  if (ctx.roundRect) {
    ctx.roundRect(x0, y0, w, h, r);
  } else {
    ctx.moveTo(x0 + r, y0); ctx.lineTo(x0 + w - r, y0);
    ctx.arcTo(x0+w, y0, x0+w, y0+r, r); ctx.lineTo(x0+w, y0+h-r);
    ctx.arcTo(x0+w, y0+h, x0+w-r, y0+h, r); ctx.lineTo(x0+r, y0+h);
    ctx.arcTo(x0, y0+h, x0, y0+h-r, r); ctx.lineTo(x0, y0+r);
    ctx.arcTo(x0, y0, x0+r, y0, r); ctx.closePath();
  }
  ctx.fillStyle = earned ? col + '22' : '#22222a'; ctx.fill();
  ctx.strokeStyle = earned ? col : '#444455'; ctx.lineWidth = 2.5; ctx.stroke();
  // Scroll curl lines
  ctx.strokeStyle = earned ? col + '55' : '#33334455'; ctx.lineWidth = 1;
  [-0.5, 0, 0.5].forEach(oy => {
    ctx.beginPath(); ctx.moveTo(cx - rw * 0.55, cy + oy * rh * 0.45);
    ctx.lineTo(cx + rw * 0.55, cy + oy * rh * 0.45); ctx.stroke();
  });
}

// CS.missionStats tracks per-mission events for rep calculation
function initMissionStats() {
  CS.missionStats = {
    detectedCount: 0,        // times enemy saw an ally before being hit
    undetectedKills: 0,      // enemies killed without being detected first
    totalKills: 0,
    nonTargetKills: 0,       // kills that weren't the assassination target
    alliesAlerted: false,    // were enemies ever alerted?
    alliesTookDamage: false, // did any ally take any damage this mission?
  };
}

// Called when an enemy attacks an ally (enemy saw ally before ally struck)
function recordDetection() {
  if (!CS.missionStats) return;
  CS.missionStats.detectedCount++;
  CS.missionStats.alliesAlerted = true;
  gainRep('DETECTED_BEFORE_STRIKE');
}

// Called when ally kills enemy
function recordKill(target) {
  if (!CS.missionStats) return;
  CS.missionStats.totalKills++;
  if (!CS.missionStats.alliesAlerted) {
    CS.missionStats.undetectedKills++;
    gainRep('KILL_UNDETECTED');
  }
  if (CS.mission?.type === 'assassination' && !target.isTarget) {
    CS.missionStats.nonTargetKills++;
  }
  // Achievement tracking
  if (target.type) achOnEnemyKill(target.type);
}

// Called in endCombat to apply end-of-mission reputation
function applyMissionReputation(result, mission) {
  if (!GS.reputation) GS.reputation = { stealth: 0, honor: 0 };
  const stats = CS.missionStats || {};
  const wasUndetected = !stats.alliesAlerted;

  if (result === 'victory') {
    gainRep('MISSION_SUCCESS');

    // Stealth bonuses
    if (wasUndetected) {
      gainRep('MISSION_UNDETECTED');
      if (mission.type === 'espionage' || mission.type === 'theft') {
        gainRep('OBJECTIVE_UNDETECTED');
      }
    }

    // Honor bonuses per mission type
    if (mission.type === 'assassination' && stats.nonTargetKills === 0 && stats.totalKills <= 1) {
      gainRep('TARGET_ONLY_KILL');
    }
    if (mission.type === 'rescue') {
      gainRep('RESCUE_SUCCESS');
    }

    // Permadeath penalty
    const perished = CS.allies.filter(a => a.perished).length;
    for (let i = 0; i < perished; i++) gainRep('ALLY_PERISHED');

  } else if (result === 'defeat') {
    gainRep('MISSION_FAILED');
  } else if (result === 'timedout') {
    gainRep('MISSION_TIMED_OUT');
  } else if (result === 'fled') {
    gainRep('SMOKE_FLEE');
  }

  saveGame();
}

// ── Reputation combat modifiers ──

// Call in beginUnitTurn or calcDamage to apply stealth/fear bonuses
function getRepCombatMods(ally) {
  const s = (GS.reputation || {}).stealth || 0;
  const mods = { dmgMult: 1, firstStrikeBonus: false, enemyDmgMult: 1 };

  // High stealth: bonus on first strike (ally acts before enemy spots them)
  if (s >= 20 && !CS.missionStats?.alliesAlerted) {
    mods.firstStrikeBonus = true; // +25% dmg on undetected attacks
    mods.dmgMult *= 1.25;
  }
  if (s >= 50 && !CS.missionStats?.alliesAlerted) {
    mods.dmgMult *= 1.15; // stack further
  }

  // Fear (negative stealth): enemies deal more damage to feared clan
  if (s <= -30) mods.enemyDmgMult = 1.15; // enemies hit harder (+15%)
  if (s <= -70) mods.enemyDmgMult = 1.30; // extreme fear (+30%)

  // Phantom (extreme positive stealth): bonus SPD in combat
  return mods;
}

// ── Reputation-weighted class pool for recruit screen ──
function getRepWeightedClasses() {
  const s = (GS.reputation || {}).stealth || 0;
  const h = (GS.reputation || {}).honor   || 0;

  const weights = {
    shinobi:   4,
    kunoichi:  3,
    ronin:     3,
    monk:      3,
    shadow:    2,
    berserker: 2,
  };

  // High stealth → more shadow/shinobi/kunoichi
  if (s >= 20) { weights.shadow += 2; weights.shinobi += 2; weights.kunoichi += 1; }
  if (s >= 50) { weights.shadow += 3; weights.shinobi += 1; }

  // Feared → more berserker/ronin
  if (s <= -20) { weights.berserker += 2; weights.ronin += 2; }
  if (s <= -50) { weights.berserker += 3; }

  // High honor → more monk/ronin
  if (h >= 20) { weights.monk += 2; weights.ronin += 2; }
  if (h >= 50) { weights.monk += 3; }

  // Low honor → more berserker/shadow
  if (h <= -20) { weights.berserker += 2; weights.shadow += 1; }

  const pool = [];
  for (const [cls, w] of Object.entries(weights)) {
    for (let i = 0; i < Math.max(0, w); i++) pool.push(cls);
  }
  return pool;
}

function getRepWeightedTypes() {
  // Build a weighted pool of mission types based on shadow reputation
  const rep = GS.reputation || { stealth: 0, honor: 0 };
  const stealth = rep.stealth;
  const honor = rep.honor;

  // Base weights for all types
  const weights = {
    assassination: 3,
    theft: 3,
    espionage: 3,
    agitation: 3,
    rescue: 2
  };

  // High stealth → more espionage/theft; Low stealth (feared) → more assassination/agitation
  if (stealth >= 20)  { weights.espionage += 3; weights.theft += 2; }
  if (stealth >= 50)  { weights.espionage += 4; weights.theft += 2; weights.assassination -= 1; }
  if (stealth <= -20) { weights.assassination += 3; weights.agitation += 2; }
  if (stealth <= -50) { weights.assassination += 3; weights.agitation += 3; weights.espionage -= 1; }

  // High honor → more rescue/escort; Low honor → less rescue
  if (honor >= 20)  { weights.rescue += 3; }
  if (honor >= 50)  { weights.rescue += 4; }
  if (honor <= -20) { weights.rescue = Math.max(0, weights.rescue - 2); weights.agitation += 2; }

  // Flatten to array pool
  const pool = [];
  for (const [type, w] of Object.entries(weights)) {
    for (let j = 0; j < Math.max(0, w); j++) pool.push(type);
  }
  return pool.length ? pool : ['assassination', 'theft', 'espionage', 'agitation', 'rescue'];
}

function generateMissionPool() {
  const maxLevel = GS.clan.length ? Math.max(...GS.clan.map(n => n.level)) : 1;
  const now = Date.now();
  const hourSeed = Math.floor(now / MISSION_REFRESH_INTERVAL);
  const typePool = getRepWeightedTypes();
  const missions = [];
  const used = new Set();
  for (let i = 0; i < DYNAMIC_MISSION_COUNT; i++) {
    let seed = (hourSeed * 7919 + i * 1000003) | 0;
    const diffBias = Math.min(4, Math.max(0, maxLevel - 1 + Math.floor(i / 2)));
    // Pick mission type from rep-weighted pool (use seed % pool length)
    const forcedType = typePool[Math.abs(seed) % typePool.length];
    const m = generateDynamicMission(Math.abs(seed), diffBias, forcedType);
    // Avoid exact duplicate ids
    if (!used.has(m.id)) { used.add(m.id); missions.push(m); }
    else {
      const m2 = generateDynamicMission(Math.abs(seed + 999), diffBias, forcedType);
      used.add(m2.id); missions.push(m2);
    }
  }
  return missions;
}

function checkMissionRefresh() {
  const now = Date.now();
  if (!GS.missionNextRefresh || now >= GS.missionNextRefresh) {
    GS.activeMissions = generateMissionPool(); _invalidateMissionsCache();
    GS.missionNextRefresh = Math.ceil(now / MISSION_REFRESH_INTERVAL) * MISSION_REFRESH_INTERVAL;
    saveGame();
  }
}

function manualRefreshMissions() {
  if (GS.gold < MISSION_MANUAL_REFRESH_COST) {
    toast(`Need G${MISSION_MANUAL_REFRESH_COST} gold to refresh missions.`, 'error');
    return;
  }
  openModal('Refresh Missions?',
    `Spend <b style="color:var(--gold)">G${MISSION_MANUAL_REFRESH_COST} gold</b> to receive a new set of contracts immediately?`,
    [
      { label: `G Spend ${MISSION_MANUAL_REFRESH_COST} Gold`, fn: () => {
        GS.gold -= MISSION_MANUAL_REFRESH_COST;
        GS.activeMissions = generateMissionPool(); _invalidateMissionsCache();
        // Push next auto-refresh time forward
        GS.missionNextRefresh = Date.now() + MISSION_REFRESH_INTERVAL;
        selectedMissionId = null;
        saveGame(); updateGoldDisplay(); closeModal();
        renderMissions();
        toast('New contracts received.', 'success');
      }, cls: 'confirm' },
      { label: 'Cancel', fn: closeModal, cls: '' }
    ]
  );
}

function getMissionTimeLeft() {
  const left = Math.max(0, GS.missionNextRefresh - Date.now());
  const mins = Math.floor(left / 60000);
  const secs = Math.floor((left % 60000) / 1000);
  if (mins >= 60) {
    const hrs = Math.floor(mins / 60);
    const m = mins % 60;
    return `${hrs}h ${m}m`;
  }
  return `${mins}m ${secs}s`;
}

// Map mission difficulty (1-5) to weapon tier
const DIFFICULTY_TIER = ['common', 'common', 'uncommon', 'rare', 'legendary', 'epic'];

function spawnEnemyWeapon(enemyTypeKey, difficulty) {
  const prefs = ENEMY_WEAPON_PREFS[enemyTypeKey] || ['blades'];
  const tier = DIFFICULTY_TIER[Math.min(difficulty, 5)] || 'common';
  // Try preferred weapon types first, fall back to any
  for (const wType of prefs) {
    const pool = (WEAPONS[wType]?.items || []).filter(w => w.tier === tier);
    if (pool.length) {
      const template = pool[Math.floor(Math.random() * pool.length)];
      return initWeapon(template, wType);
    }
  }
  // Fallback: pick anything at this tier
  const allAtTier = Object.entries(WEAPONS).flatMap(([wType, cat]) =>
    cat.items.filter(w => w.tier === tier).map(w => ({ w, wType }))
  );
  if (allAtTier.length) {
    const pick = allAtTier[Math.floor(Math.random() * allAtTier.length)];
    return initWeapon(pick.w, pick.wType);
  }
  return null;
}

const IMG_CACHE = {};  // key → HTMLImageElement (null if failed/not ready)

// Rotation angles for single-image sprites — image default is south-facing (0 rad)
const FACING_ANGLE = { south: 0, east: -Math.PI / 2, west: Math.PI / 2, north: Math.PI };

function classPng(className) {
  return className.charAt(0).toUpperCase() + className.slice(1) + '.png';
}

function enemySheetKey(typeName) {
  return typeName.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('_') + '.png';
}

// All filenames the game may ever need — loaded once at page open
function getAllGameImages() {
  const files = new Set();
  Object.values(TILE_PNG).forEach(f => files.add(f));
  Object.keys(CLASSES).forEach(k => files.add(classPng(k)));
  files.add('Prisoner.png'); // prisoner NPC sprite
  Object.keys(ENEMY_TYPES).forEach(k => files.add(enemySheetKey(k)));
  return [...files];
}

function loadImg(filename) {
  if (IMG_CACHE[filename] !== undefined) return;
  IMG_CACHE[filename] = null; // placeholder while loading
  const img = new Image();
  img.onload  = () => { IMG_CACHE[filename] = img; };
  img.onerror = () => { IMG_CACHE[filename] = null; };
  img.src = filename;
}

function getImg(filename) {
  return IMG_CACHE[filename] || null;
}

// Draw one frame from a 4-frame horizontal sprite sheet.
// Guards against zero-dimension images that would throw on ctx.drawImage.
// Returns an img element src data-url of a sprite's south-facing frame, or empty string
function getEnemySpriteDataURL(typeKey, size) {
  // Single image — draw it directly (south-facing is the default orientation)
  const img = getImg(enemySheetKey(typeKey));
  if (!img || img.naturalWidth <= 0) return '';
  try {
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const ctx2 = c.getContext('2d');
    ctx2.drawImage(img, 0, 0, size, size);
    return c.toDataURL();
  } catch(e) { return ''; }
}

function getClassSpriteDataURL(classKey, size) {
  // Single image — draw it directly (south-facing default)
  const img = getImg(classPng(classKey));
  if (!img || img.naturalWidth <= 0) return '';
  try {
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const ctx2 = c.getContext('2d');
    ctx2.drawImage(img, 0, 0, size, size);
    return c.toDataURL();
  } catch(e) { return ''; }
}

function drawSpriteFrame(ctx, img, facing, dx, dy, dw, dh) {
  // Single image — rotate around its centre to face the correct direction.
  // Image default orientation is south (facing down).
  if (img.naturalWidth <= 0 || img.naturalHeight <= 0 || dw <= 0 || dh <= 0) return;
  const angle = FACING_ANGLE[facing] ?? 0;
  const cx = dx + dw / 2;
  const cy = dy + dh / 2;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
  ctx.restore();
}

const SFX = (() => {
  let _ctx = null;
  let _enabled = true;
  const _cache = {};   // filename → AudioBuffer
  const _loading = {}; // filename → Promise<AudioBuffer|null>

  // Attempt to get (or lazily create) the AudioContext
  function _getCtx() {
    if (!_enabled) return null;
    if (_ctx) return _ctx;
    try {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) { _enabled = false; return null; }
      _ctx = new Ctor();
      return _ctx;
    } catch (e) {
      _enabled = false;
      return null;
    }
  }

  // Lazy-load and cache a single file. Returns a promise that always resolves
  // (never rejects) — resolves to the AudioBuffer, or null on error/absence.
  function _load(filename) {
    if (_cache[filename]) return Promise.resolve(_cache[filename]);
    if (_loading[filename]) return _loading[filename];
    const ctx = _getCtx();
    if (!ctx) return Promise.resolve(null);

    const url = 'sounds/' + filename;
    _loading[filename] = fetch(url)
      .then(r => {
        if (!r.ok) return null; // file absent — silent failure
        return r.arrayBuffer();
      })
      .then(ab => {
        if (!ab) return null;
        return ctx.decodeAudioData(ab).catch(() => null);
      })
      .then(buf => {
        if (buf) _cache[filename] = buf;
        delete _loading[filename];
        return buf || null;
      })
      .catch(() => { delete _loading[filename]; return null; });

    return _loading[filename];
  }

  // Public: play a sound file. Silently does nothing if file missing or audio off.
  // volume: 0.0–1.0 (default 1.0)
  function play(filename, volume) {
    if (!_enabled) return;
    const ctx = _getCtx();
    if (!ctx) return;
    // Resume context if suspended (browser autoplay policy)
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    _load(filename).then(buf => {
      if (!buf) return;
      try {
        const src = ctx.createBufferSource();
        src.buffer = buf;
        if (volume !== undefined && volume !== 1) {
          const gain = ctx.createGain();
          gain.gain.value = Math.max(0, Math.min(1, volume));
          src.connect(gain);
          gain.connect(ctx.destination);
        } else {
          src.connect(ctx.destination);
        }
        src.start(0);
      } catch (e) { /* swallow — never break gameplay */ }
    });
  }

  // Pre-warm the AudioContext on first user interaction (satisfies autoplay policy)
  function prewarm() {
    const ctx = _getCtx();
    if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
  }

  // Warm-up on any user gesture so subsequent calls never require resume
  ['click','keydown','touchstart'].forEach(ev =>
    document.addEventListener(ev, prewarm, { once: true, passive: true })
  );

  return { play, prewarm };
})();

function toggleMissionSidebar() {

}

function closeMissionSidebar() {
  const sb = document.querySelector('.mission-sidebar');
  if (sb) sb.classList.remove('open');
  window._missionSidebarOpen = false;
}

// Global handler reference so we can always remove the stale one on DOM rebuild
let _sidebarOutsideHandler = null;

function attachMissionSidebarListeners(sb) {
  // Remove any stale global outside-click handler
  if (_sidebarOutsideHandler) {
    document.removeEventListener('pointerdown', _sidebarOutsideHandler);
    _sidebarOutsideHandler = null;
  }

  // Fresh outside-click handler pointing at the current sb element
  _sidebarOutsideHandler = function(e) {
    const currentSb = document.querySelector('.mission-sidebar');
    if (!currentSb || !currentSb.classList.contains('open')) return;
    if (currentSb.contains(e.target)) return; // click inside — do nothing
    const fab = document.querySelector('.deploy-fab');
    if (fab && fab.contains(e.target)) return; // FAB toggles, don't double-close
    closeMissionSidebar();
  };
  setTimeout(() => document.addEventListener('pointerdown', _sidebarOutsideHandler), 80);

  // Drag-to-close — only attach once per element (new element = new sb each rebuild)
  if (sb._dragAttached) return;
  sb._dragAttached = true;
  let startY = null, currentY = null;

  sb.addEventListener('touchstart', e => {
    const handle = sb.querySelector('.mission-sidebar-handle');
    if (!handle || !handle.contains(e.target)) return;
    startY = e.touches[0].clientY;
    currentY = startY;
  }, { passive: true });

  sb.addEventListener('touchmove', e => {
    if (startY === null) return;
    currentY = e.touches[0].clientY;
    const delta = currentY - startY;
    if (delta > 0) {
      sb.style.transform = 'translateY(' + delta + 'px)';
      sb.style.transition = 'none';
    }
  }, { passive: true });

  sb.addEventListener('touchend', () => {
    if (startY === null) return;
    const delta = currentY - startY;
    sb.style.transform = '';
    sb.style.transition = '';
    if (delta > 80) closeMissionSidebar();
    startY = null; currentY = null;
  });
}

// Update notification dots on hub nav buttons
function _updateNavDots() {
  // Training: show dot if any ninja has completed training
  const trainingDone = GS.clan.some(n => n.training && Date.now() >= n.training.endTime);
  const trainingBtn = document.getElementById('nav-training');
  const mobTrainingBtn = document.getElementById('mob-training');
  [trainingBtn, mobTrainingBtn].forEach(btn => {
    if (!btn) return;
    let dot = btn.querySelector('.nav-dot');
    if (trainingDone) {
      if (!dot) { dot = document.createElement('span'); dot.className = 'nav-dot gold'; btn.appendChild(dot); }
    } else {
      if (dot) dot.remove();
    }
  });

  // Honors: show dot if there are un-viewed newly earned achievements
  // (we just show a dot if earned any - simple awareness signal)
  const honorCount = (GS.achievements || []).length;
  const lastViewedHonors = window._lastViewedHonorCount || 0;
  const honorsBtn = document.getElementById('nav-honors');
  const mobHonorsBtn = document.getElementById('mob-honors');
  [honorsBtn, mobHonorsBtn].forEach(btn => {
    if (!btn) return;
    let dot = btn.querySelector('.nav-dot');
    if (honorCount > lastViewedHonors) {
      if (!dot) { dot = document.createElement('span'); dot.className = 'nav-dot'; btn.appendChild(dot); }
    } else {
      if (dot) dot.remove();
    }
  });
}

// Repair missing fields on saves created before new features were added
function _repairSaveData() {
  if (!GS) return;
  if (!GS.achievements)      GS.achievements = [];
  if (!GS.achievementStats)  GS.achievementStats = {};
  if (!GS.completedMissions) GS.completedMissions = [];
  if (!GS.inventory)         GS.inventory = { healing: [], armor: [], tactical: [] };
  if (!GS.inventory.healing) GS.inventory.healing = [];
  // Migrate old 'costume' inventory key to 'armor'
  if (GS.inventory.costume && !GS.inventory.armor) { GS.inventory.armor = GS.inventory.costume; delete GS.inventory.costume; }
  if (!GS.inventory.armor)   GS.inventory.armor   = [];
  if (!GS.inventory.armor)   GS.inventory.armor   = [];
  if (!GS.inventory.tactical)GS.inventory.tactical = [];
  if (!GS.weaponStash)       GS.weaponStash = [];
  if (!GS.activeMissions)    GS.activeMissions = [];
  if (!GS.reputation)        GS.reputation = { stealth: 0, honor: 0 };
  if (!GS.recruitRoster)     GS.recruitRoster = [];
  // Repair each ninja's fields
  (GS.clan || []).forEach(n => {
    const cls = CLASSES[n.class];
    if (!cls) return;
    if (!n.maxHp)       n.maxHp       = n.hp       || cls.baseStats.hp;
    if (!n.maxChi)      n.maxChi      = n.chi      || cls.baseStats.chi;
    if (!n.maxStamina)  n.maxStamina  = n.stamina  || cls.baseStats.stamina;
    if (n.stamina  === undefined) n.stamina  = n.maxStamina;
    if (n.chi      === undefined) n.chi      = n.maxChi;
    if (!n.level)       n.level       = 1;
    if (!n.exp)         n.exp         = 0;
    if (!n.expToNext)   n.expToNext   = 100;
    if (!n.buffs)       n.buffs       = [];
    if (!n.carriedItems)n.carriedItems= [];
    if (!n.jobs)        n.jobs        = {};
    if (!n.unlockedAbilities)  n.unlockedAbilities  = [];
    if (!n.equippedAbilities)  n.equippedAbilities  = { reaction: null, support: null, movement: null };
    // Migrate armor from carriedItems into dedicated equippedArmor slot
    if (n.equippedArmor === undefined) n.equippedArmor = null;
    if (!n.equippedArmor) {
      const armorIdx = (n.carriedItems || []).findIndex(x => x.isArmor);
      if (armorIdx !== -1) {
        n.equippedArmor = n.carriedItems.splice(armorIdx, 1)[0];
      }
    }
    if (!n.specialMove && cls.specialMoves) n.specialMove = cls.specialMoves[0];
    // Repair weapon fields
    if (n.weapon) migrateWeapon(n.weapon);
  });
}

// ── saveGame debounce ──
// Many actions call saveGame() in quick succession (e.g. kills during AoE).
// Batch them so at most one write happens per 500ms during active gameplay.
let _saveDebounceTimer = null;
const _saveGameDebounced = () => {
  if (_saveDebounceTimer) return; // already queued
  _saveDebounceTimer = setTimeout(() => {
    _saveDebounceTimer = null;
    if (_gameActive && GS.clan.length > 0) saveGame();
  }, 500);
};

function loadGame() {
  let saved = null;
  try { saved = localStorage.getItem('nindo_save'); }
  catch(e) {
    toast('⚠ Storage unavailable — cannot load save. Try a different browser or disable private mode.', 'error');
    return;
  }
  if (saved) {
    try {
      GS = JSON.parse(saved);
      _repairSaveData(); // patch any fields added after save was created
      _gameActive = true;
      initAchievements();
      showScreen('hub');
      showHubSection('clan');
      toast('Game loaded! Welcome back, Shadow.');
    } catch(e) {
      toast('Save file corrupted. Starting fresh is recommended.', 'error');
      console.error('[NINDO] Load failed:', e);
    }
  } else {
    toast('No save file found. Begin a new journey.', 'error');
  }
}

function saveGame(silent = true) {
  try {
    const payload = JSON.stringify(GS);
    localStorage.setItem('nindo_save', payload);
    if (!silent) toast('✓ Game saved.', 'success');
    // Update last-saved indicator
    const el = document.getElementById('lastSavedDisplay');
    if (el) {
      const now = new Date();
      el.textContent = 'Saved ' + now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0');
    }
  } catch (e) {
    // localStorage unavailable (private browsing, file://, quota exceeded, etc.)
    console.warn('[NINDO] Save failed:', e.message);
    if (!silent) toast('⚠ Save failed: ' + (e.name === 'QuotaExceededError' ? 'Storage full' : 'Storage unavailable'), 'error');
    // Show persistent warning if this is the first failure
    if (!window._saveWarned) {
      window._saveWarned = true;
      toast('⚠ Auto-save unavailable. Progress may be lost if you close the tab.', 'error');
    }
  }
}

function createCharacter() {
  const name = document.getElementById('charName').value.trim();
  if (!name) { toast('Enter your ninja name.', 'error'); return; }
  if (!selectedClass) { toast('Select a class.', 'error'); return; }

  const cls = CLASSES[selectedClass];
  const special = cls.specialMoves[Math.floor(Math.random() * cls.specialMoves.length)];
  const ninja = {
    id: 'player_' + Date.now(),
    name, class: selectedClass,
    level: 1, exp: 0, expToNext: 100,
    hp: cls.baseStats.hp, maxHp: cls.baseStats.hp,
    stamina: cls.baseStats.stamina, maxStamina: cls.baseStats.stamina,
    chi: cls.baseStats.chi, maxChi: cls.baseStats.chi,
    proficiency: { ...cls.proficiency },
    specialMove: special,
    weapon: null,
    carriedItems: [],
    training: null,
    isPlayer: true,
    jobs: {}, unlockedAbilities: [],
    equippedAbilities: { reaction: null, support: null, movement: null }
  };

  // Full GS reset — ensures no carry-over from any previous save or partially loaded state
  GS.clan              = [];
  GS.completedMissions = [];
  GS.activeMissions    = [];
  GS.missionNextRefresh= 0;
  GS.day               = 1;
  GS.inventory         = { healing: [], armor: [], tactical: [] };
  GS.weaponStash       = [];
  GS.equippedArmor     = null;
  GS.shopStock         = { weapons: [], items: [] };
  GS.reputation        = { stealth: 0, honor: 0 };
  GS.recruitRoster     = [];
  GS.recruitNextRefresh= 0;
  GS.achievements      = [];
  GS.achievementStats  = {};
  _invalidateMissionsCache();

  GS.clan.push(ninja);
  GS.gold = 1000;
  GS.shopStock.weapons = generateShopWeapons();
  GS.shopStock.items = generateShopItems();
  _gameActive = true;
  initAchievements();
  _checkClassAchievements();
  saveGame();
  showScreen('hub');
  showHubSection('clan');
  toast(`Welcome, ${name}. Your journey begins.`, 'success');
}

function usedNinjaNames() {
  return new Set(GS.clan.map(n => n.name));
}

function pickUnusedName(classKey) {
  const used = usedNinjaNames();
  // Use the class-specific pool if available, else the generic pool
  const basePool = (classKey && CLASS_NAMES[classKey]) ? CLASS_NAMES[classKey] : NINJA_NAMES;
  const available = basePool.filter(n => !used.has(n));
  if (available.length) {
    return available[Math.floor(Math.random() * available.length)];
  }
  // All class names used — pick any from the pool and add a suffix
  const fallback = basePool[Math.floor(Math.random() * basePool.length)];
  const suffixes = [' II', ' the Elder', ' no Kage', ' Reborn', ' Shadow'];
  return fallback + suffixes[Math.floor(Math.random() * suffixes.length)];
}

function generateHireableNinja(targetLevel) {
  const classPool = getRepWeightedClasses();
  const classKey = classPool[Math.floor(Math.random() * classPool.length)];
  const cls = CLASSES[classKey];
  const level = Math.max(1, targetLevel + Math.floor(Math.random() * 3) - 1);
  const special = cls.specialMoves[Math.floor(Math.random() * cls.specialMoves.length)];

  // Scale HP with level
  const bonus = (level - 1) * 10;
  const cost = RECRUIT_BASE_COST + (level - 1) * RECRUIT_PER_LEVEL;

  // Give a small chance of a random weapon
  let weapon = null;
  if (Math.random() < 0.4) {
    const weapTypes = Object.keys(WEAPONS);
    const wType = weapTypes[Math.floor(Math.random() * weapTypes.length)];
    // Match tier to level
    const tierMap = [null, 'common', 'common', 'uncommon', 'uncommon', 'rare'];
    const tier = tierMap[Math.min(5, level)] || 'common';
    const pool = WEAPONS[wType].items.filter(w => w.tier === tier);
    if (pool.length) weapon = initWeapon(pool[Math.floor(Math.random() * pool.length)], wType);
  }

  // Class-specific hire traits
  const CLASS_TRAITS = {
    shinobi: [
      'Grew up in the village gutters. Shadow is the only home they know.',
      'Former palace spy — reads a room before anyone has finished entering it.',
      'Trained under a master who disappeared without explanation. Still searching.',
      'Moves like smoke. Never seen unless they choose to be.',
      'Counts heartbeats to time every strike. Unnervingly calm.',
      'Cut their teeth on garrison rooftops at fourteen.',
    ],
    kunoichi: [
      'Poison is a kindness compared to her patience.',
      'Former court dancer — every movement carries a hidden knife.',
      'Speaks in riddles and strikes in silence.',
      'Studied herbalism and assassination in equal measure.',
      'Once a merchant\'s wife. The merchant asked too many questions.',
      'Has never missed a target. Has never apologised for one either.',
    ],
    ronin: [
      'Masterless for three years. Still looking for something worth serving.',
      'Carries a broken clan seal. Speaks of it to no one.',
      'Won a duel at seventeen. Has been hunted by the loser\'s clan ever since.',
      'Drinks too much at camp. Fights perfectly sober.',
      'Old enough to remember the previous warlord. Hasn\'t forgiven the new one.',
      'Seven duels. Seven victories. Zero regrets.',
    ],
    monk: [
      'Left the mountain temple when the warlord\'s soldiers burned the lower village.',
      'Recites sutras before every fight. Wins every fight.',
      'Carries a broken prayer wheel as a reminder. Will not say of what.',
      'Healed three enemies on the same battlefield he defeated six.',
      'Chi flows so freely it makes the air hum when he meditates.',
      'Was a physician first. Became a warrior when medicine wasn\'t enough.',
    ],
    shadow: [
      'Claims to have died once. The story changes each time they tell it.',
      'Walks through walls of shadow. What else walks through with them is unclear.',
      'Speaks of the void the way others speak of an old friend.',
      'Former court sorcerer — exiled when the emperor\'s nightmares began.',
      'Eyes that have seen the other side of something. Never says what.',
      'Recruited from a cursed battlefield where no one else survived.',
    ],
    berserker: [
      'Cracked a castle gate with a single charge. Didn\'t slow down.',
      'Took three arrows at the Battle of Iron Ridge. Finished the fight.',
      'Scars tell a story. So does the grin.',
      'Happiest in the thick of it. Everyone else is terrified.',
      'Gentle until the fight starts. Then purely animal.',
      'Eats before every battle and drinks after. Never the other way around.',
    ],
  };
  const traits = CLASS_TRAITS[classKey] || [
    'Former palace guard. Reliable in tight spaces.',
    'Street brawler who fights dirty and wins.',
    'Wandering ronin seeking purpose.',
    'Quiet assassin who never misses a target.',
  ];

  return {
    id: 'hire_' + Date.now() + '_' + Math.floor(Math.random() * 9999),
    name: pickUnusedName(classKey),
    class: classKey,
    level, exp: 0, expToNext: 100,
    hp: cls.baseStats.hp + bonus, maxHp: cls.baseStats.hp + bonus,
    stamina: cls.baseStats.stamina, maxStamina: cls.baseStats.stamina,
    chi: cls.baseStats.chi, maxChi: cls.baseStats.chi,
    proficiency: { ...cls.proficiency },
    specialMove: special,
    weapon, carriedItems: [],
    training: null, isPlayer: false, equippedArmor: null,
    jobs: {}, unlockedAbilities: [],
    equippedAbilities: { reaction: null, support: null, movement: null },
    hireCost: cost,
    hireTrait: traits[Math.floor(Math.random() * traits.length)],
  };
}

function generateRecruitRoster() {
  const maxLevel = GS.clan.length ? Math.max(...GS.clan.map(n => n.level)) : 1;
  const roster = [];
  for (let i = 0; i < RECRUIT_ROSTER_SIZE; i++) {
    roster.push(generateHireableNinja(maxLevel));
  }
  GS.recruitRoster = roster;
  GS.recruitNextRefresh = Date.now() + 3600000; // 1 hour
  // NOTE: deliberately not calling saveGame() here — called by the player action that triggers this
}

function hireNinja(id) {
  const candidate = GS.recruitRoster.find(n => n.id === id);
  if (!candidate) { toast('Ninja no longer available.', 'error'); return; }
  if (GS.gold < candidate.hireCost) {
    toast('Not enough gold! Need ' + candidate.hireCost + 'G.', 'error'); return;
  }
  GS.gold -= candidate.hireCost;
  // Strip hire-specific fields, add to clan
  const { hireCost, hireTrait, ...ninja } = candidate;
  ninja.id = 'ninja_' + Date.now();
  GS.clan.push(ninja);
  GS.recruitRoster = GS.recruitRoster.filter(n => n.id !== id);
  saveGame();
  updateGoldDisplay();
  toast(ninja.name + ' joins your clan!', 'success');
  SFX.play('sfx_recruit_join.mp3');
  _checkClassAchievements();
  _checkClanSizeAchievements();
  renderRecruitShop();
  renderClan();
}

function refreshRecruitRoster() {
  if (GS.gold < RECRUIT_REFRESH_COST) {
    toast('Need ' + RECRUIT_REFRESH_COST + 'G to refresh the roster.', 'error');
    return;
  }
  openModal(
    'Refresh Roster?',
    'Spend <b style="color:var(--gold)">G ' + RECRUIT_REFRESH_COST + '</b> to bring in a new group of recruits?',
    [
      { label: 'Refresh (G ' + RECRUIT_REFRESH_COST + ')', fn: () => {
        GS.gold -= RECRUIT_REFRESH_COST;
        updateGoldDisplay();
        generateRecruitRoster();
        closeModal();
        renderRecruitShop();
        toast('New recruits available!', 'success');
      }, cls: 'confirm' },
      { label: 'Cancel', fn: closeModal, cls: '' }
    ]
  );
}
