// ==========================================
// ===== ATB / CT TURN SYSTEM =====
// ==========================================

// Advance simulation until a unit's CT reaches 100, then start their turn
function advanceCT() {
  if (!CS.active) return;
  const allUnits = getAllLiveUnits();
  if (!allUnits.length) { checkCombatEnd(); return; }

  // Tick all units' CT by their speed until someone is ready
  let iters = 0;
  while (iters++ < 2000) {
    allUnits.forEach(u => { u.ct = (u.ct || 0) + (u.spd || 5); });
    const ready = allUnits.filter(u => u.ct >= 100);
    if (ready.length) {
      // Highest CT goes first; speed breaks ties
      ready.sort((a, b) => b.ct - a.ct || b.spd - a.spd);
      beginUnitTurn(ready[0]);
      return;
    }
  }
}

function getAllLiveUnits() {
  return [
    ...CS.allies.filter(a => isAllyActive(a) && !a.escaped),
    ...CS.enemies.filter(e => e.hp > 0)
  ];
}

// Calculate upcoming turn order for display (does not modify actual CT)
function calcTurnOrder(count) {
  const allUnits = getAllLiveUnits();
  if (!allUnits.length) return [];
  const cts = {};
  allUnits.forEach(u => { cts[u.gridId || u.id] = u.ct || 0; });
  const order = [];
  let iters = 0;
  while (order.length < count && iters++ < 2000) {
    allUnits.forEach(u => { cts[u.gridId || u.id] += u.spd || 5; });
    const ready = allUnits.filter(u => cts[u.gridId || u.id] >= 100);
    if (ready.length) {
      ready.sort((a, b) => cts[b.gridId||b.id] - cts[a.gridId||a.id] || b.spd - a.spd);
      for (const u of ready) {
        if (order.length < count) order.push(u);
        cts[u.gridId || u.id] = 0;
      }
    }
  }
  return order;
}

function beginUnitTurn(unit) {
  CS.activeUnit = unit.gridId || unit.id;
  CS.unitMoved = false;
  CS.unitActed = false;
  CS.savedMove = null;
  CS.selectedEnemy = null;

  if (unit.gridId) {
    // ALLY turn
    unit.chi = Math.min(unit.maxChi, unit.chi + 1); // chi regen
    CS.selectedAlly = unit.gridId;
    CS.phase = 'player';
    CS.turn++;
    addLog('--- ' + unit.name + '\'s turn (SPD ' + (unit.spd||5) + ') ---', 'system');
    if (CS.turnLimit > 0) {
      const left = CS.turnLimit - CS.turn + 1;
      if (left <= 3) addLog('\u23f3 ' + left + ' turn' + (left !== 1 ? 's' : '') + ' remaining!', 'system');
    }
    renderCombat();
    checkCombatEnd();
  } else {
    // ENEMY turn
    CS.phase = 'enemy_acting';
    renderCombat();
    setTimeout(() => runEnemyUnitTurn(unit), 400);
  }
}

// Called at the end of every unit's turn (ally or enemy) to tick doom counters
function tickDoomCountdowns() {
  const doomed = CS.allies.filter(a => a.doomed && a.doomCountdown > 0);
  doomed.forEach(ally => {
    ally.doomCountdown--;
    if (ally.doomCountdown <= 0) {
      // Permadeath — unit expires
      triggerPermadeath(ally);
    } else {
      addLog(ally.name + ' is dying! ' + ally.doomCountdown + ' turn' + (ally.doomCountdown !== 1 ? 's' : '') + ' remaining!', 'death');
    }
  });
}

function triggerPermadeath(ally) {
  addLog(ally.name + ' has perished! Lost forever...', 'death');
  toast(ally.name + ' has died permanently!', 'error');

  // If the ally died on an elevated tile, find nearest reachable ground-level
  // tile so the doom bag is always retrievable by any unit (including Berserker).
  let bagX = ally.x, bagY = ally.y;
  const deathTileKey = CS.grid[ally.y]?.[ally.x] || 'empty';
  const deathHeight = (TERRAIN_TILES[deathTileKey] || TERRAIN_TILES.empty).height || 0;
  if (deathHeight > 1) {
    // BFS outward from death position, find nearest passable tile at height ≤ 1
    const visited = new Set([ally.x + ',' + ally.y]);
    const queue = [{ x: ally.x, y: ally.y }];
    let found = false;
    while (queue.length && !found) {
      const cur = queue.shift();
      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const nx = cur.x + dx, ny = cur.y + dy;
        const key = nx + ',' + ny;
        if (visited.has(key)) continue;
        visited.add(key);
        if (nx < 0 || ny < 0 || nx >= CS.gridW || ny >= CS.gridH) continue;
        const tKey = CS.grid[ny]?.[nx] || 'empty';
        const tData = TERRAIN_TILES[tKey] || TERRAIN_TILES.empty;
        if (!tData.passable) continue;
        const tHeight = tData.height || 0;
        // Check no unit is occupying this tile
        const occupied = [...CS.allies, ...CS.enemies].some(u =>
          u.hp > 0 && !u.escaped && u.x === nx && u.y === ny
        );
        if (tHeight <= 1 && !occupied) {
          bagX = nx; bagY = ny; found = true; break;
        }
        queue.push({ x: nx, y: ny });
      }
    }
    if (found) {
      addLog(ally.name + "'s belongings slide down to (" + bagX + ',' + bagY + ').', 'system');
    }
  }

  // Build loot bag from all their equipment, placed at the accessible position
  const bag = {
    x: bagX, y: bagY,
    allyId: ally.id,
    name: ally.name + "'s Belongings",
    icon: '💀',
    items: [...(ally.carriedItems || [])],
    weapon: ally.weapon ? { ...ally.weapon } : null,
  };
  CS.doomBags.push(bag);

  // Remove from GS clan permanently
  const gnIdx = GS.clan.findIndex(x => x.id === ally.id);
  if (gnIdx !== -1) GS.clan.splice(gnIdx, 1);

  // Mark dead in CS (hp=0 already, flag as perished so it's skipped)
  ally.doomed = false;
  ally.perished = true;
  ally.hp = 0;

  // Persist removal immediately so save state is correct even if combat ends abnormally
  saveGame();

  // Notify and check if all dead
  if (GS.clan.length === 0) {
    setTimeout(() => endCombat('defeat'), 800);
  }
}

// Revive a doomed ally back to 1 HP (used by healing items in combat)
function reviveAlly(ally, healAmount) {
  if (!ally.doomed) return false;
  ally.doomed = false;
  ally.doomCountdown = 0;
  ally.hp = Math.min(ally.maxHp, Math.max(1, healAmount || 1));
  // Re-enter ATB with partial CT
  ally.ct = 20;
  addLog(ally.name + ' revived with ' + ally.hp + ' HP!', 'heal');
  toast(ally.name + ' revived!', 'success');
  return true;
}

function pickupDoomBag(ally, bag) {
  const idx = CS.doomBags.indexOf(bag);
  if (idx === -1) return;

  // Return items to inventory
  if (bag.items && bag.items.length) {
    bag.items.forEach(item => {
      const cat = getCategoryForItem(item);
      if (GS.inventory[cat]) GS.inventory[cat].push(item);
    });
  }
  // Return weapon to stash
  if (bag.weapon) {
    if (!GS.weaponStash) GS.weaponStash = [];
    GS.weaponStash.push(bag.weapon);
  }

  const count = (bag.items?.length || 0) + (bag.weapon ? 1 : 0);
  addLog(ally.name + ' recovers ' + bag.name + '! (' + count + ' item' + (count !== 1 ? 's' : '') + ' returned)', 'heal');
  toast('Recovered ' + bag.name + '!', 'success');
  CS.doomBags.splice(idx, 1);
  updateGoldDisplay();
  saveGame();
}

function getDoomBagAt(x, y) {
  return CS.doomBags.find(b => b.x === x && b.y === y) || null;
}

function isAllyDoomed(ally) {
  return !!(ally && ally.doomed && ally.doomCountdown > 0);
}

function isAllyAlive(ally) {
  return ally && ally.hp > 0 && !ally.doomed && !ally.perished;
}

function isAllyActive(ally) {
  // Can participate in ATB: alive and not doomed/perished
  return ally && ally.hp > 0 && !ally.doomed && !ally.perished;
}

function undoMove() {
  const ally = CS.allies.find(a => a.gridId === CS.activeUnit);
  if (!ally || !CS.savedMove || CS.unitActed) {
    toast('Cannot undo move — an action has already been taken.', 'error');
    return;
  }
  // Restore position and facing
  ally.x = CS.savedMove.x;
  ally.y = CS.savedMove.y;
  ally.facing = CS.savedMove.facing;
  CS.savedMove = null;
  CS.unitMoved = false;
  CS.highlightedTiles = [];
  CS.selectedAction = null;
  addLog(ally.name + ' cancels their move.', 'system');
  renderCombat();
}

function finishAllyTurn() {
  const ally = CS.allies.find(a => a.gridId === CS.activeUnit);
  if (!ally) return;

  // JP for move without attack
  if (CS.unitMoved && !CS.unitActed) giveJP(ally, JP_AWARDS.move, 'move');

  CS.savedMove = null;

  // CT reset: both done = 0, partial action = 25 (carry-over momentum)
  ally.ct = (CS.unitMoved && CS.unitActed) ? 0 : 25;

  // Tick doom countdowns for all doomed allies
  tickDoomCountdowns();
  // Tick buffs and status for this ally
  tickUnitStatus(ally);

  CS.selectedAlly = null;
  CS.selectedAction = null;
  CS.highlightedTiles = [];
  CS.activeUnit = null;
  CS.phase = 'enemy_acting'; // briefly neutral while advancing

  checkCombatEnd();
  if (CS.active) setTimeout(advanceCT, 200);
}

function tickUnitStatus(unit) {
  if (unit.buffs) {
    unit.buffs = unit.buffs.map(b => {
      // Don't tick permanent buffs
      if (b.permanent) return b;
      return { ...b, turns: b.turns - 1 };
    }).filter(b => b.permanent || b.turns > 0);
  }
  if (unit.status === 'poisoned') applyDamage(unit, (unit._poisonedByClass==='kunoichi'?10:5), 'Poison');
  if (unit.bleeds && unit.bleedTurns > 0) {
    unit.hp = Math.max(0, unit.hp - unit.bleeds);
    unit.bleedTurns--;
    addLog('\u{1FA78} ' + unit.name + ' bleeds ' + unit.bleeds + ' HP. (' + unit.hp + '/' + unit.maxHp + ')', 'damage');
    if (unit.bleedTurns <= 0) unit.bleeds = 0;
  }
  // Monk chi regen (passive: +2 chi per turn)
  if (unit.gridId && unit.class === 'monk') unit.chi = Math.min(unit.maxChi, (unit.chi||0)+2);
}

function finishEnemyTurn(enemy) {
  if (enemy) {
    enemy.ct = 0;
    tickUnitStatus(enemy);
  }
  // Tick doom countdowns every enemy action too
  tickDoomCountdowns();
  CS.activeUnit = null;
  checkCombatEnd();
  if (CS.active) setTimeout(advanceCT, 200);
}


function calcEnemyDamage(enemy, target) {
  let base;
  const weapType = enemy.weapon?.type;
  if (enemy.weapon && enemy.weapon.dmg) {
    const w = enemy.weapon;
    if (w.type === 'ranged' && w.quiverEmpty) {
      base = enemy.dmg[0] + Math.floor(Math.random() * (enemy.dmg[1] - enemy.dmg[0] + 1));
    } else {
      base = Math.max(1, w.dmg[0] + Math.floor(Math.random() * (w.dmg[1] - w.dmg[0] + 1)));
    }
  } else {
    base = enemy.dmg[0] + Math.floor(Math.random() * (enemy.dmg[1] - enemy.dmg[0] + 1));
  }
  // Apply class weakness multiplier if we know the target's class
  if (target && target.class && weapType) {
    const weakness = CLASS_WEAKNESSES[target.class];
    if (weakness && weakness[weapType]) {
      const mult = weakness[weapType];
      base = Math.round(base * mult);
      const label = weapType === 'blunt' ? '⚒ Weak to blunt!' : weapType === 'blades' ? '⚔ Weak to blades!' : '🏹 Weak to ranged!';
      addLog(label + ' (' + Math.round((mult-1)*100) + '% extra dmg)', 'damage');
    }
  }
  return Math.max(1, base);
}

function consumeEnemyWeaponUse(enemy) {
  const w = enemy.weapon;
  if (!w) return;
  if (w.type === 'thrown') {
    w.ammo = Math.max(0, (w.ammo || 1) - 1);
    if (w.ammo <= 0) { addLog(enemy.name + '\'s ' + w.name + ' runs out!', 'system'); enemy.weapon = null; enemy.attackRange = 1; }
    return;
  }
  if (w.type === 'ranged') {
    w.ammo = Math.max(0, (w.ammo || 1) - 1);
    if (w.ammo <= 0) { w.quiverEmpty = true; enemy.attackRange = 1; addLog(enemy.name + '\'s ' + w.name + ' — quiver empty!', 'system'); }
    return;
  }
  w.usesLeft = Math.max(0, (w.usesLeft || 1) - 1);
  if (w.usesLeft <= 0) { addLog(enemy.name + '\'s ' + w.name + ' breaks!', 'system'); enemy.weapon = null; }
}

function runEnemyUnitTurn(enemy) {
  if (!enemy || enemy.hp <= 0) { finishEnemyTurn(enemy); return; }

  // Status checks
  if (enemy.status === 'stunned') {
    enemy.stunTurns = (enemy.stunTurns || 1) - 1;
    addLog(enemy.name + ' is stunned, skips turn.');
    if (enemy.stunTurns <= 0) enemy.status = null;
    renderCombat();
    setTimeout(() => finishEnemyTurn(enemy), 300);
    return;
  }
  if (enemy.status === 'confused') {
    enemy.confuseTurns = (enemy.confuseTurns || 1) - 1;
    if (enemy.confuseTurns <= 0) enemy.status = null;
    // Confused: attack a random adjacent unit (could be ally or another enemy)
    const _cAllUnits = [
      ...CS.allies.filter(a => a.hp > 0 && !a.escaped),
      ...CS.enemies.filter(e => e.hp > 0 && e.id !== enemy.id)
    ];
    const _cAdj = _cAllUnits.filter(u => Math.abs(u.x-enemy.x)+Math.abs(u.y-enemy.y) <= 1);
    if (_cAdj.length) {
      const _cTgt = _cAdj[Math.floor(Math.random()*_cAdj.length)];
      const _cDmg = enemy.dmg[0]+Math.floor(Math.random()*(enemy.dmg[1]-enemy.dmg[0]+1));
      addLog('❓ '+enemy.name+' (confused) attacks '+_cTgt.name+'!','damage');
      if (_cTgt.gridId) applyDamageToAlly(_cTgt, _cDmg, enemy.name+' (confused)');
      else applyDamage(_cTgt, _cDmg, enemy.name+' (confused)');
    } else {
      addLog('❓ '+enemy.name+' is confused and stumbles!','system');
    }
    renderCombat();
    setTimeout(() => finishEnemyTurn(enemy), 300);
    return;
  }
  if (enemy.status === 'blinded') {
    enemy.blindTurns = (enemy.blindTurns || 1) - 1;
    if (enemy.blindTurns <= 0) { enemy.status = null; addLog(enemy.name + ' recovers from blindness.', 'system'); }
    else addLog(enemy.name + ' is blinded \u2014 attacks at random!');
  }
  if (enemy.status === 'poisoned') {
    enemy.hp = Math.max(0, enemy.hp - 5);
    addLog(enemy.name + ' takes poison damage.', 'damage');
    if (enemy.hp <= 0) {
      addLog(enemy.name + ' dies from poison!', 'death');
      if (enemy.gold) { GS.gold += enemy.gold; updateGoldDisplay(); }
      renderCombat();
      setTimeout(() => finishEnemyTurn(enemy), 300);
      return;
    }
  }

  const aliveAllies = CS.allies.filter(a => a.hp > 0 && !a.escaped);
  if (!aliveAllies.length) { finishEnemyTurn(enemy); return; }

  // Target selection
  let nearest;
  if (enemy.status === 'blinded') {
    nearest = aliveAllies[Math.floor(Math.random() * aliveAllies.length)];
  } else {
    nearest = aliveAllies.reduce((best, a) => {
      const d = Math.abs(a.x - enemy.x) + Math.abs(a.y - enemy.y);
      const bd = Math.abs(best.x - enemy.x) + Math.abs(best.y - enemy.y);
      return d < bd ? a : best;
    });
  }

  const dist = Math.abs(nearest.x - enemy.x) + Math.abs(nearest.y - enemy.y);
  const _elos = hasLineOfSight(enemy.x, enemy.y, nearest.x, nearest.y);
  const ai = enemy.ai || 'aggressive';

  // ── Helper: face toward a target ──
  function faceTarget(e, tx, ty) {
    const adx = tx - e.x, ady = ty - e.y;
    if (Math.abs(adx) >= Math.abs(ady)) e.facing = adx > 0 ? 'east' : 'west';
    else e.facing = ady > 0 ? 'south' : 'north';
  }

  // ── Helper: step toward target ──
  function stepToward(e, tx, ty) {
    const sx = Math.sign(tx - e.x), sy = Math.sign(ty - e.y);
    const steps = Math.min(e.moveRange, Math.abs(tx - e.x) + Math.abs(ty - e.y) - 1);
    for (let s = 0; s < steps; s++) {
      const nx = e.x + sx, ny = e.y + sy;
      if (isPosEmpty(nx, ny, e.id)) {
        const ox = e.x, oy = e.y; e.x = nx; e.y = ny;
        if (Math.abs(e.x-ox) >= Math.abs(e.y-oy)) e.facing = e.x > ox ? 'east' : 'west';
        else e.facing = e.y > oy ? 'south' : 'north';
        return true;
      } else if (isPosEmpty(e.x + sx, e.y, e.id)) {
        e.x += sx; e.facing = sx > 0 ? 'east' : 'west'; return true;
      } else if (isPosEmpty(e.x, e.y + sy, e.id)) {
        e.y += sy; e.facing = sy > 0 ? 'south' : 'north'; return true;
      }
    }
    return false;
  }

  // ── Helper: step away from target ──
  function stepAway(e, fx, fy) {
    const sx = -Math.sign(fx - e.x), sy = -Math.sign(fy - e.y);
    const dirs = [[sx, 0], [0, sy], [sx, sy], [-sx, 0], [0, -sy]];
    for (const [dx2, dy2] of dirs) {
      const nx = e.x + dx2, ny = e.y + dy2;
      if (dx2 === 0 && dy2 === 0) continue;
      if (isPosEmpty(nx, ny, e.id)) { e.x = nx; e.y = ny; return; }
    }
  }

  // ── Helper: attack nearest if in range + LoS ──
  function tryAttack(e, target) {
    const d2 = Math.abs(target.x-e.x)+Math.abs(target.y-e.y);
    if (d2 > e.attackRange) return false;
    if (e.attackRange > 1 && !hasLineOfSight(e.x,e.y,target.x,target.y)) return false;
    faceTarget(e, target.x, target.y);
    // Cover miss chance for ranged AI
    if (e.attackRange > 1) {
      const tKey=CS.grid[target.y]?.[target.x]||'empty';
      const cover=(TERRAIN_TILES[tKey]||TERRAIN_TILES.empty).cover||0;
      if (cover>0&&Math.random()<cover*0.08) {
        addLog(e.name+' fires — cover deflects the shot!','system');
        consumeEnemyWeaponUse(e); return true;
      }
    }
    // Height damage bonus for AI
    const eH=getTileHeight(e.x,e.y), tH=getTileHeight(target.x,target.y);
    let dmg=calcEnemyDamage(e, target);
    const hd=eH-tH;
    if (hd>=2) dmg=Math.round(dmg*1.25);
    else if (hd>=1) dmg=Math.round(dmg*1.12);
    else if (hd<=-1) dmg=Math.round(dmg*0.92);
    addLog((e.weapon?e.weapon.icon+' ':'')+e.name+' attacks '+target.name+'!','damage');
    recordDetection();
    applyDamageToAlly(target,dmg,e.name);
    consumeEnemyWeaponUse(e);
    return true;
  }

  // ── TACTICAL AI — SCORING SYSTEM ──
  // Score each potential target considering HP, position, height, flanking, stealth
  function scoreTarget(e, target) {
    let score = 0;
    const d = Math.abs(target.x - e.x) + Math.abs(target.y - e.y);
    // Prefer weak targets
    const hpPct = target.hp / target.maxHp;
    score += (1 - hpPct) * 40;  // up to +40 for near-death target
    // Prefer targets in attack range
    if (d <= e.attackRange) score += 30;
    else score -= d * 3;
    // Prefer back-attack opportunity
    const dirMult = getDirDamageMult(target, e.x, e.y);
    if (dirMult >= 1.5) score += 25;      // back attack available
    else if (dirMult >= 1.25) score += 12; // side attack
    // Height advantage: prefer attacking from higher ground
    const eH = getTileHeight(e.x, e.y);
    const tH = getTileHeight(target.x, target.y);
    if (eH > tH) score += 15;
    else if (eH < tH) score -= 10;
    // Prefer targets carrying loot (priority kill)
    if (target.hasLoot) score += 20;
    // Prefer low-HP targets for finishing
    if (target.hp < 20) score += 20;
    // Prefer flanking with allies (pack tactics)
    const adjacentAllies = CS.enemies.filter(other =>
      other.id !== e.id && other.hp > 0 &&
      Math.abs(other.x - target.x) + Math.abs(other.y - target.y) <= 2
    );
    score += adjacentAllies.length * 8;
    // Line of sight bonus
    if (hasLineOfSight(e.x, e.y, target.x, target.y)) score += 10;
    return score;
  }

  // Score each potential move tile — full terrain awareness
  function scoreMovePos(e, tx, ty, bestTarget) {
    if (!isPosEmpty(tx, ty, e.id)) return -9999;
    const hDiff = getTileHeight(tx,ty)-getTileHeight(e.x,e.y);
    if (hDiff > (ai==='stealth'?2:1)) return -9999;
    let score = 0;
    const tile = TERRAIN_TILES[CS.grid[ty]?.[tx]||'empty'];
    const d = Math.abs(bestTarget.x-tx)+Math.abs(bestTarget.y-ty);
    if (d <= e.attackRange) score += 60; else score -= d*5;
    const newH=getTileHeight(tx,ty), curH=getTileHeight(e.x,e.y);
    if (newH>curH) score+=newH*20;
    if (newH>getTileHeight(bestTarget.x,bestTarget.y)) score+=15;
    const dirMult=getDirDamageMult(bestTarget,tx,ty);
    if (dirMult>=1.5) score+=35; else if (dirMult>=1.25) score+=18;
    if (hasLineOfSight(tx,ty,bestTarget.x,bestTarget.y)) score+=15;
    else if (e.attackRange>1) score-=30;
    if ((ai==='ranged'||ai==='stealth')&&tile.cover>0) score+=tile.cover*8;
    if (ai==='stealth') score+=(1-(tile.light??1))*35;
    if (ai==='defensive') {
      const ep=CS.exitTiles.reduce((mn,et)=>Math.min(mn,Math.abs(et.x-tx)+Math.abs(et.y-ty)),999);
      if (ep<=3) score+=25;
    }
    const crowded=CS.enemies.filter(o=>o.id!==e.id&&o.hp>0&&Math.abs(o.x-tx)+Math.abs(o.y-ty)<=1).length;
    score-=crowded*8;
    if (tile.noise>0) score-=tile.noise*4;
    return score;
  }

  // ── Pick best target ──
  let bestTarget = aliveAllies.reduce((best, a) => {
    const sA = scoreTarget(enemy, a);
    const sB = scoreTarget(enemy, best);
    return sA > sB ? a : best;
  }, aliveAllies[0]);

  // Override for blinded enemy
  if (enemy.status === 'blinded') {
    bestTarget = aliveAllies[Math.floor(Math.random() * aliveAllies.length)];
  }

  const targetDist = Math.abs(bestTarget.x - enemy.x) + Math.abs(bestTarget.y - enemy.y);
  const inRange = targetDist <= enemy.attackRange && hasLineOfSight(enemy.x, enemy.y, bestTarget.x, bestTarget.y);

  // ── Tactical AI by behavior type ──
  if (ai === 'aggressive') {
    if (inRange) {
      tryAttack(enemy, bestTarget);
    } else {
      // Score all reachable tiles and pick best approach
      let bestScore = -9999, bestX = enemy.x, bestY = enemy.y;
      for (let dy = -enemy.moveRange; dy <= enemy.moveRange; dy++) {
        for (let dx = -enemy.moveRange; dx <= enemy.moveRange; dx++) {
          if (Math.abs(dx) + Math.abs(dy) > enemy.moveRange) continue;
          const tx = enemy.x + dx, ty = enemy.y + dy;
          const s = scoreMovePos(enemy, tx, ty, bestTarget);
          if (s > bestScore) { bestScore = s; bestX = tx; bestY = ty; }
        }
      }
      if (bestX !== enemy.x || bestY !== enemy.y) {
        stepToward(enemy, bestX, bestY);
      }
      tryAttack(enemy, bestTarget);
    }

  } else if (ai === 'patrol') {
    const sightRange = enemy.attackRange + 4;
    if (targetDist <= sightRange) {
      if (!inRange) {
        stepToward(enemy, bestTarget.x, bestTarget.y);
      }
      tryAttack(enemy, bestTarget);
    } else {
      // Patrol pattern — walk toward a chokepoint or exit zone
      const patrolDirs = [{dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1}];
      const dir = patrolDirs[(Math.floor(Date.now()/800 + enemy.id.charCodeAt(0))) % patrolDirs.length];
      const px = enemy.x + dir.dx, py = enemy.y + dir.dy;
      if (isPosEmpty(px, py, enemy.id)) {
        enemy.x = px; enemy.y = py;
        enemy.facing = dir.dx !== 0 ? (dir.dx > 0 ? 'east' : 'west') : (dir.dy > 0 ? 'south' : 'north');
      }
    }

  } else if (ai === 'defensive') {
    // Hold high-value chokepoint — only advance if target very close
    if (inRange) {
      tryAttack(enemy, bestTarget);
    } else if (targetDist <= 2) {
      stepToward(enemy, bestTarget.x, bestTarget.y);
      tryAttack(enemy, bestTarget);
    } else {
      // Seek best defensive position (exits, high ground, cover)
      let bestDefScore = -9999, defX = enemy.x, defY = enemy.y;
      for (let dy = -2; dy <= 2; dy++) {
        for (let dx = -2; dx <= 2; dx++) {
          const tx = enemy.x + dx, ty = enemy.y + dy;
          if (!isPosEmpty(tx, ty, enemy.id)) continue;
          let ds = 0;
          ds += getTileHeight(tx, ty) * 12;
          const ct = TERRAIN_TILES[CS.grid[ty]?.[tx] || 'empty'];
          ds += ct.cover * 5;
          const exitProx = CS.exitTiles.reduce((mn, et) =>
            Math.min(mn, Math.abs(et.x-tx)+Math.abs(et.y-ty)), 999);
          if (exitProx <= 3) ds += 20;
          if (ds > bestDefScore) { bestDefScore = ds; defX = tx; defY = ty; }
        }
      }
      if (defX !== enemy.x || defY !== enemy.y) stepToward(enemy, defX, defY);
      faceTarget(enemy, bestTarget.x, bestTarget.y);
    }

  } else if (ai === 'ranged') {
    const idealMin = Math.max(2, enemy.attackRange - 1);
    // Find best ranged position
    if (targetDist < idealMin) {
      stepAway(enemy, bestTarget.x, bestTarget.y);
    } else if (targetDist > enemy.attackRange || !hasLineOfSight(enemy.x, enemy.y, bestTarget.x, bestTarget.y)) {
      // Seek flanking high-ground position with LoS
      let bestRangeScore = -9999, rX = enemy.x, rY = enemy.y;
      for (let dy = -enemy.moveRange; dy <= enemy.moveRange; dy++) {
        for (let dx = -enemy.moveRange; dx <= enemy.moveRange; dx++) {
          if (Math.abs(dx)+Math.abs(dy) > enemy.moveRange) continue;
          const tx = enemy.x+dx, ty = enemy.y+dy;
          if (!isPosEmpty(tx, ty, enemy.id)) continue;
          const d2 = Math.abs(bestTarget.x-tx)+Math.abs(bestTarget.y-ty);
          if (d2 < idealMin || d2 > enemy.attackRange) continue;
          let rs = getTileHeight(tx,ty)*15;
          if (hasLineOfSight(tx, ty, bestTarget.x, bestTarget.y)) rs += 30;
          const dirM = getDirDamageMult(bestTarget, tx, ty);
          rs += (dirM - 1) * 40;
          if (rs > bestRangeScore) { bestRangeScore = rs; rX = tx; rY = ty; }
        }
      }
      if (rX !== enemy.x || rY !== enemy.y) stepToward(enemy, rX, rY);
    }
    tryAttack(enemy, bestTarget);

  } else if (ai === 'stealth') {
    // Stealth AI: seek shadow tiles, approach from behind, wait for back-attack
    const onShadow = (TERRAIN_TILES[CS.grid[enemy.y]?.[enemy.x] || 'empty'].light || 1) < 0.3;
    const backScore = getDirDamageMult(bestTarget, enemy.x, enemy.y);
    if (backScore >= 1.5 && inRange) {
      // Perfect back-attack position — strike!
      const dmg = calcEnemyDamage(enemy);
      faceTarget(enemy, bestTarget.x, bestTarget.y);
      addLog('💀 ' + enemy.name + ' strikes from the shadows!', 'damage');
      recordDetection();
      applyDamageToAlly(bestTarget, Math.round(dmg * 1.5), enemy.name);
      consumeEnemyWeaponUse(enemy);
    } else {
      // Seek shadow tiles and flank behind target
      let bestStealthScore = -9999, sX = enemy.x, sY = enemy.y;
      for (let dy = -enemy.moveRange; dy <= enemy.moveRange; dy++) {
        for (let dx = -enemy.moveRange; dx <= enemy.moveRange; dx++) {
          if (Math.abs(dx)+Math.abs(dy) > enemy.moveRange) continue;
          const tx = enemy.x+dx, ty = enemy.y+dy;
          if (!isPosEmpty(tx, ty, enemy.id)) continue;
          const tt = TERRAIN_TILES[CS.grid[ty]?.[tx] || 'empty'];
          let ss = 0;
          ss += (1 - (tt.light || 1)) * 30; // prefer dark tiles
          ss += (tt.cover || 0) * 8;
          const dm = getDirDamageMult(bestTarget, tx, ty);
          ss += (dm - 1) * 50; // strongly prefer back-attack position
          const d2 = Math.abs(bestTarget.x-tx)+Math.abs(bestTarget.y-ty);
          if (d2 <= enemy.attackRange) ss += 25;
          if (ss > bestStealthScore) { bestStealthScore = ss; sX = tx; sY = ty; }
        }
      }
      if (sX !== enemy.x || sY !== enemy.y) stepToward(enemy, sX, sY);
      if (inRange) tryAttack(enemy, bestTarget);
    }

  } else if (ai === 'flee') {
    const prevX = enemy.x, prevY = enemy.y;
    stepAway(enemy, bestTarget.x, bestTarget.y);
    if (enemy.x === prevX && enemy.y === prevY) {
      tryAttack(enemy, bestTarget);
    }

  } else {
    // Fallback: aggressive with scoring
    if (!inRange) stepToward(enemy, bestTarget.x, bestTarget.y);
    tryAttack(enemy, bestTarget);
  }

  renderCombat();
  setTimeout(() => finishEnemyTurn(enemy), 300);
}


// Returns damage multiplier based on attacker direction relative to defender's facing.
// facing direction: south=+y, north=-y, east=+x, west=-x
function getDirDamageMult(defender, attackerX, attackerY) {
  const f = defender.facing || 'south';
  // Vector from defender to attacker
  const dx = attackerX - defender.x;
  const dy = attackerY - defender.y;
  if (dx === 0 && dy === 0) return 1;

  // Direction defender is facing (where they LOOK / where their front is)
  const fvx = f === 'east' ? 1 : f === 'west' ? -1 : 0;
  const fvy = f === 'south' ? 1 : f === 'north' ? -1 : 0;

  // Normalise attacker direction
  const len = Math.sqrt(dx*dx + dy*dy);
  const anx = dx / len, any = dy / len;

  // Dot product: 1 = attacker directly in front, -1 = directly behind
  const dot = fvx * anx + fvy * any;

  // dot > 0.5  → front arc (attacker in front of defender) = 1× damage
  // dot < -0.5 → rear arc  = 1.5× damage
  // else       → side arc  = 1.25× damage
  if (dot > 0.5)  return 1.0;
  if (dot < -0.5) return 1.5;
  return 1.25;
}

function applyDamageToAlly(ally, rawDmg, attackerName) {
  // Decoy absorbs one hit entirely
  if (ally.buffs?.some(b => b.type === 'decoy')) {
    ally.buffs = ally.buffs.filter(b => b.type !== 'decoy');
    addLog(ally.name + "'s decoy takes the hit!", 'special');
    renderCombat(); return;
  }
  // Mirror image: 67% miss chance per charge
  if (ally.buffs?.some(b => b.type === 'mirror')) {
    if (Math.random() < 0.67) {
      const mb = ally.buffs.find(b => b.type === 'mirror');
      if (mb) { mb.charges = (mb.charges||1)-1; if (mb.charges<=0) ally.buffs = ally.buffs.filter(b=>b.type!=='mirror'); }
      addLog(attackerName + ' strikes a mirror image — miss!', 'special');
      renderCombat(); return;
    }
  }
  // Invisible: 60% miss, breaks on hit
  if (ally.buffs?.some(b => b.type === 'invisible')) {
    if (Math.random() < 0.6) { addLog(attackerName + ' cannot see ' + ally.name + '!', 'special'); renderCombat(); return; }
    ally.buffs = ally.buffs.filter(b => b.type !== 'invisible');
    addLog(ally.name + "'s invisibility broken!", 'special');
  }
  // Reaction ability check (before armor)
  const attackerUnit = CS.enemies.find(e => e.name === attackerName || (e.name && attackerName && e.name.includes(attackerName)));
  let dmg = triggerReaction(ally, rawDmg, attackerUnit);
  if (dmg <= 0) { renderCombat(); return; } // evaded

  // Directional damage multiplier (front=1×, side=1.25×, rear=1.5×)
  if (attackerUnit) {
    const dirMult = getDirDamageMult(ally, attackerUnit.x, attackerUnit.y);
    if (dirMult !== 1) {
      const dirLabel = dirMult >= 1.5 ? '⬅ Backstab!' : '↙ Flank!';
      dmg = Math.round(dmg * dirMult);
      addLog(dirLabel + ' (' + (dirMult >= 1.5 ? '+50%' : '+25%') + ' dmg)', 'damage');
    }
  }

  // Iron Will support
  dmg = checkIronWill(ally, dmg);

  // Armor passive reduction
  const armorBuff = ally.buffs?.find(b => b.type === 'armor_passive');
  if (armorBuff && (armorBuff.effect === 'armor' || armorBuff.effect === 'shadow_armor')) {
    dmg = Math.max(1, Math.floor(dmg * (1 - armorBuff.value / 100)));
  }
  // Armor durability
  if (ally.armorItem && ally.armorItem.durability > 0) {
    ally.armorItem.durability--;
    if (ally.armorItem.durability <= 0) {
      // Remove armor passive buff
      ally.buffs = (ally.buffs || []).filter(b => b.type !== 'armor_passive');
      addLog(ally.name + "'s " + ally.armorItem.name + " is destroyed!", 'system');
      ally.armorItem = null;
    }
  }
  ally.hp = Math.max(0, ally.hp - dmg);
  addLog(attackerName + " → " + ally.name + ": " + dmg + " damage. (" + ally.hp + "/" + ally.maxHp + " HP)", 'damage');
  if (ally.hp <= 0 && !ally.doomed) {
    // Enter Doom Countdown instead of instant death
    ally.doomed = true;
    ally.doomCountdown = 3;
    ally.ct = 0; // remove from ATB queue while downed
    addLog(ally.name + ' is DOWN! Revive within 3 turns!', 'death');
    toast(ally.name + ' is dying — use a healing item to revive!', 'error');
    // Drop any held objective loot
    if (ally.hasLoot && CS.mission?.type === 'theft') {
      ally.hasLoot = false;
      CS.allyWithLoot = null;
      CS.exitsActive = false;
      CS.lootOnFloor = { x: ally.x, y: ally.y, ...(CS.mission.lootItem || { name: 'Loot', icon: '📦' }) };
      addLog('📦 Loot dropped — pick it up again!', 'system');
    }
  }
}

function checkCombatEnd() {
  if (!CS.active) return;
  const aliveEnemies = CS.enemies.filter(e => e.hp > 0);
  const aliveAllies = CS.allies.filter(a => isAllyAlive(a));
  const mission = CS.mission;
  const isMultiFloor = !!(mission.floors && mission.floors.length > 1);
  const floorData = isMultiFloor ? mission.floors[CS.currentFloor] : null;
  const isLastFloor = !isMultiFloor || CS.currentFloor >= CS.totalFloors - 1;

  if (aliveAllies.length === 0) { setTimeout(() => endCombat('defeat'), 800); return; }
  if (CS.turnLimit > 0 && CS.turn > CS.turnLimit) {
    addLog('Time is up! Mission failed.', 'system');
    setTimeout(() => endCombat('timedout'), 800); return;
  }

  // For multi-floor: check floor-specific win conditions
  // A floor is cleared when all enemies dead (+ target dead if applicable) + all allies at exit
  const floorTarget = floorData ? floorData.targetEnemy : mission.targetEnemy;
  const targetDead = !floorTarget || !CS.enemies.find(e => e.isTarget && e.hp > 0);

  // Assassination single-floor shortcut
  if (!isMultiFloor && mission?.type === 'assassination' && mission.targetEnemy) {
    if (targetDead && CS.exitsActive && !aliveAllies.filter(a => !a.escaped && !a.doomed).length) {
      setTimeout(() => endCombat('victory'), 800);
    }
    return;
  }
  // Theft single-floor
  if (!isMultiFloor && mission?.type === 'theft' && mission.carrierEnemy) {
    if (CS.objectivePhase === 'done') setTimeout(() => endCombat('victory'), 800);
    return;
  }
  // Rescue floor 2: all alive allies escaped with prisoner → victory
  if (isMultiFloor && isLastFloor && floorData?.isRescueFloor) {
    if (CS.prisonerFreed && CS.prisoner?.escaped && aliveAllies.filter(a => !a.escaped).length === 0) {
      setTimeout(() => endCombat('victory'), 800);
    }
    return;
  }

  // Objective missions (agitation/espionage): need objectives done + escape
  if (CS.objectiveTiles && CS.objectiveTiles.length > 0 && !isMultiFloor) {
    if (CS.objectiveProgress >= CS.objectiveTotal && CS.exitsActive) {
      // Victory when all allies have escaped
      const notEscaped = aliveAllies.filter(a => !a.escaped && !a.doomed);
      if (notEscaped.length === 0) { setTimeout(() => endCombat('victory'), 800); }
    }
    return; // objective missions don't win by killing all enemies
  }

  // Generic: all enemies cleared (and target dead if required)
  if (aliveEnemies.length === 0 && targetDead) {
    if (isMultiFloor && !isLastFloor) {
      // Activate exits for floor transition
      if (!CS.exitsActive) {
        CS.exitsActive = true;
        CS.objectivePhase = 'extract';
        addLog('Floor ' + (CS.currentFloor + 1) + ' cleared! Reach the exit to advance.', 'system');
        toast('Floor cleared! Find the exit!', 'success');
        renderCombat();
      }
    } else {
      setTimeout(() => endCombat('victory'), 800);
    }
  }
}

function advanceFloor() {
  const mission = CS.mission;
  CS.currentFloor++;
  const _advFd = mission.floors[CS.currentFloor];
  addLog('=== FLOOR ' + (CS.currentFloor + 1) + ' — ' + (_advFd?.name || 'Next Floor') + ' ===', 'system');
  toast('Floor ' + (CS.currentFloor + 1) + '/' + CS.totalFloors + ': ' + (_advFd?.name || ''), 'success');

  // Reset per-floor state
  CS.turn = 0;
  CS.exitsActive = false;
  CS.objectivePhase = 'fight';
  CS.alliesEscaped = [];
  CS.lootOnFloor = null;
  CS.allyWithLoot = null;
  CS.doomBags = [];
  CS.goldPickups = [];
  CS.objectiveTiles = [];
  CS.objectiveProgress = 0;
  CS.objectiveTotal = 0;

  // Reset floor-specific turn limit
  const floorData = mission.floors[CS.currentFloor];
  CS.turnLimit = floorData?.turnLimit || 0;

  // Heal allies slightly between floors (25% of missing HP)
  CS.allies.filter(a => isAllyAlive(a)).forEach(a => {
    if (a.doomed) { a.doomed = false; a.doomCountdown = 0; a.hp = Math.max(1, Math.floor(a.maxHp * 0.1)); a.ct = 20; }
    const missing = a.maxHp - a.hp;
    a.hp = Math.min(a.maxHp, a.hp + Math.floor(missing * 0.25));
    a.ct = Math.floor(Math.random() * 30);
    a.escaped = false;
  });

  // Re-generate enemies from this floor's spec
  CS.enemies = [];
  let ec = 0;
  const fd = mission.floors[CS.currentFloor];
  (fd.enemies || []).forEach(group => {
    const type = ENEMY_TYPES[group.type];
    for (let i = 0; i < group.count; i++) {
      const pos = findEmptyPos(CS.gridW - 5, CS.gridW - 2, 1, CS.gridH - 2);
      const w = spawnEnemyWeapon(group.type, mission.difficulty || 1);
      const ar = w && (w.type === 'ranged' || w.type === 'thrown') ? Math.max(type.attackRange, w.range || 3) : type.attackRange;
      CS.enemies.push({
        id: 'enemy_' + ec++, name: type.name, emoji: type.emoji,
        hp: type.hp, maxHp: type.hp, dmg: [...type.dmg],
        moveRange: type.moveRange, attackRange: ar,
        x: pos.x, y: pos.y, gold: type.gold, exp: type.exp,
        ai: type.ai, isBoss: type.isBoss || false, isRecruitTarget: type.isAlly || false,
        status: null, type: group.type, weapon: w, facing: 'west',
        ct: Math.floor(Math.random() * 40), spd: type.spd || 5
      });
    }
  });

  if (fd.targetEnemy) {
    const t = CS.enemies.find(e => e.type === fd.targetEnemy);
    if (t) { t.isTarget = true; t.name = '★ ' + t.name; }
  }
  if (fd.carrierEnemy && fd.lootItem) {
    const c = CS.enemies.find(e => e.type === fd.carrierEnemy);
    if (c) { c.isCarrier = true; c.carriedLoot = fd.lootItem; c.name = '📦 ' + c.name; }
  }

  // Regenerate grid terrain for the new floor
  CS.grid = generateGrid(mission.floors[CS.currentFloor]?.terrain || mission.terrain || 'village');
  CS.exitTiles = [];
  // Inter-floor exits are on the RIGHT edge (enemies came from the left)
  const exitYs = [2, Math.floor(CS.gridH / 2), CS.gridH - 3].filter(y => y >= 0 && y < CS.gridH);
  const exitX = CS.gridW - 1;
  exitYs.forEach(y => {
    // Clear any wall that was generated there
    if (CS.grid[y]) CS.grid[y][exitX] = 'exit';
    CS.exitTiles.push({ x: exitX, y });
  });

  // Re-place allies back on the left side using current formation
  const partyIds = CS.allies.filter(a => !a.perished).map(a => a.id);
  const f = FORMATIONS[selectedFormation] || FORMATIONS.line;
  const pts = f.positions(partyIds.length, CS.gridH);
  CS.allies.filter(a => !a.perished).forEach((a, i) => {
    const pt = pts[i] || { x: 1 + i, y: Math.floor(CS.gridH / 2) };
    a.x = pt.x; a.y = pt.y; a.escaped = false;
  });

  // Spawn prisoner on rescue floor 2
  CS.prisoner = null;
  CS.prisonerFreed = false;
  const _rescFd = mission.floors[CS.currentFloor];
  if (_rescFd && _rescFd.isRescueFloor) {
    // Place prisoner in centre-right of map, behind the remaining guards
    const px = Math.floor(CS.gridW * 0.65);
    const py = Math.floor(CS.gridH / 2);
    CS.prisoner = { x: px, y: py, emoji: '⛓️', freed: false };
    addLog('⛓ The prisoner is chained ahead. Move the key-holder to them to free them!', 'system');
    toast('Find the prisoner and use the key!', 'success');
  }

  initMissionStats();
  renderCombat();
  setTimeout(advanceCT, 300);
}


// ── ARMORY WEAPON DISCOVERY ──
// Returns a discovered weapon (or null) when the mission involves an armory.
// Difficulty 1-2 → common/uncommon, 3 → uncommon/rare, 4 → rare, 5 → legendary/epic
const ARMORY_TIERS_BY_DIFFICULTY = {
  1: ['common'],
  2: ['common', 'uncommon'],
  3: ['uncommon', 'rare'],
  4: ['rare'],
  5: ['rare', 'legendary'],
};

function missionHasArmory(mission) {
  if (!mission) return false;
  const tags = mission.tags || [];
  if (tags.includes('armory')) return true;
  const text = (mission.name + ' ' + (mission.desc || '')).toLowerCase();
  if (text.includes('armory') || text.includes('stockpile') || text.includes('weapon cache')) return true;
  // Fortress gate terrain missions have a chance of having an armory
  const terrain = mission.terrain || (mission.floors && mission.floors[0]?.terrain) || '';
  if (terrain === 'fortress_gate' || terrain === 'fortress' || terrain === 'castle') {
    return Math.random() < 0.4; // 40% chance for fortress/castle missions
  }
  return false;
}

function rollArmoryWeapon(difficulty) {
  const tierPool = ARMORY_TIERS_BY_DIFFICULTY[Math.min(5, Math.max(1, difficulty))] || ['common'];
  const tier = tierPool[Math.floor(Math.random() * tierPool.length)];
  // Pick a random weapon type and item at this tier
  const allAtTier = Object.entries(WEAPONS).flatMap(([wType, cat]) =>
    cat.items.filter(w => w.tier === tier).map(w => ({ template: w, wType }))
  );
  if (!allAtTier.length) return null;
  const pick = allAtTier[Math.floor(Math.random() * allAtTier.length)];
  return { weapon: initWeapon(pick.template, pick.wType), tier };
}

function endCombat(result) {
  if (!CS.active) return;  // already ended — block duplicate calls from queued setTimeout
  CS.active = false;
  CS.phase = 'result';
  const mission = CS.mission;

  if (result === 'fled') {
    // Fled under smoke cover — no reward, ninja survive at 50% HP
    CS.allies.forEach(a => {
      const gn = GS.clan.find(x => x.id === a.id);
      if (gn) {
        gn.hp = Math.max(10, Math.floor(gn.maxHp * 0.5));
        gn.carriedItems = a.carriedItems || [];
        gn.weapon = a.weapon ? { ...a.weapon } : null;
      }
    });
    applyMissionReputation('fled', mission);
    saveGame();
    openModal('Escaped!',
      `<b style="color:var(--jade-bright)">Your ninja fled under cover of smoke.</b><br><br>No reward gained, but the clan lives to fight another day.`,
      [{ label: 'Return to Hub', fn: () => { closeModal(); showScreen('hub'); showHubSection('clan'); selectedMissionId = null; selectedParty = []; }, cls: 'confirm' }]
    );
    return;
  }

  if (result === 'victory') {
    applyMissionReputation('victory', mission);
    if (!mission.isDynamic) {
      GS.completedMissions.push(mission.id);
      // Check if this mission completes a story arc
      const completedArc = STORY_ARCS.find(a => a.capstone === mission.id);
      if (completedArc) {
        const nextArc = STORY_ARCS.find(a => a.arc === completedArc.arc + 1);
        // Store arc completion info — show AFTER hub navigation via Mission Complete button
        if (nextArc) {
          CS._pendingArcModal = {
            title: '⭐ Arc ' + completedArc.arc + ' Complete!',
            body: '<div style="font-family:Cinzel,serif;font-size:0.9rem;color:var(--gold);margin-bottom:0.8rem">' + completedArc.name + '</div>'
              + '<div class="text-xs text-mist" style="margin-bottom:1rem">All ten missions completed. Your shadow grows longer.</div>'
              + '<div style="font-family:Cinzel,serif;font-size:0.75rem;color:var(--jade-bright)">★ New Arc Unlocked: Arc ' + nextArc.arc + ' — ' + nextArc.name + '</div>'
          };
        } else {
          CS._pendingArcModal = {
            title: '🏆 All Arcs Complete!',
            body: '<div style="font-family:Cinzel,serif;font-size:0.9rem;color:var(--gold);margin-bottom:0.8rem">The Shadow Dynasty falls. Your legend is written into history.</div>'
              + '<div class="text-xs text-mist">All 50 story missions completed. The realm is yours.</div>'
          };
        }
      }
    } else {
      // Mark the active contract as completed (dim it, prevent relaunch)
      const dynM = GS.activeMissions.find(x => x.id === mission.id);
      if (dynM) dynM.completed = true;
    }
    GS.gold += mission.reward;

    let recruitMsg = '';
    if (mission.recruitReward) {
      const rec = mission.recruitReward;
      // Guard: don't add if already in clan (prevents double-add from race conditions)
      const alreadyInClan = GS.clan.some(n => n.name === rec.name && n.class === rec.class);
      if (!alreadyInClan) {
      const cls = CLASSES[rec.class];
      const special = cls.specialMoves[Math.floor(Math.random() * cls.specialMoves.length)];
      const newNinja = {
        id: 'ninja_' + Date.now(),
        name: rec.name,
        class: rec.class,
        level: Math.max(1, Math.floor(Math.max(...GS.clan.map(n => n.level)) * 0.8)),
        exp: 0, expToNext: 100,
        hp: cls.baseStats.hp, maxHp: cls.baseStats.hp,
        stamina: cls.baseStats.stamina, maxStamina: cls.baseStats.stamina,
        chi: cls.baseStats.chi, maxChi: cls.baseStats.chi,
        proficiency: { ...cls.proficiency },
        specialMove: special, weapon: null, carriedItems: [],
        training: null, isPlayer: false,
        jobs: {}, unlockedAbilities: [],
        equippedAbilities: { reaction: null, support: null, movement: null }
      };
      GS.clan.push(newNinja);
      recruitMsg = `<br><br><b style="color:var(--jade-bright)">${cls.emoji} ${rec.name} (${cls.name}) joins your clan!</b>`;
      } // end alreadyInClan guard
    }

    // Return uncollected doom bag items to inventory
    CS.doomBags.forEach(bag => {
      (bag.items || []).forEach(item => {
        const cat = getCategoryForItem(item);
        if (GS.inventory[cat]) GS.inventory[cat].push(item);
      });
      if (bag.weapon && GS.weaponStash) GS.weaponStash.push(bag.weapon);
    });
    CS.doomBags = [];

    // Final purge: remove any perished allies that weren't caught by triggerPermadeath
    const periIdSet = new Set(CS.allies.filter(a => a.perished).map(a => a.id));
    if (periIdSet.size) GS.clan = GS.clan.filter(n => !periIdSet.has(n.id));

    // Sync surviving ally HP changes back to clan
    CS.allies.filter(a => !a.perished).forEach(a => {
      const gn = GS.clan.find(x => x.id === a.id);
      if (gn) {
        gn.hp = a.doomed ? Math.max(1, Math.floor(gn.maxHp * 0.1)) : Math.max(10, a.hp);
        gn.chi = a.chi;
        gn.level = a.level;
        gn.exp = a.exp;
        gn.expToNext = a.expToNext;
        gn.maxHp = a.maxHp;
        gn.maxChi = a.maxChi;
        gn.carriedItems = a.doomed ? [] : (a.carriedItems || []);
        gn.weapon = (!a.doomed && a.weapon) ? { ...a.weapon } : null;
        if (a.jobs) gn.jobs = { ...a.jobs };
        if (a.unlockedAbilities) gn.unlockedAbilities = [...a.unlockedAbilities];
        if (a.equippedAbilities) gn.equippedAbilities = { ...a.equippedAbilities };
      }
    });

    // ── ARMORY WEAPON DISCOVERY ──
    let armoryMsg = '';
    let armoryWeapon = null;
    if (missionHasArmory(mission)) {
      const roll = rollArmoryWeapon(mission.difficulty || 1);
      if (roll) {
        armoryWeapon = roll.weapon;
        if (!GS.weaponStash) GS.weaponStash = [];
        GS.weaponStash.push(armoryWeapon);
        armoryMsg = '<br><br><div style="background:rgba(201,162,39,0.08);border:1px solid rgba(201,162,39,0.25);padding:0.6rem;margin-top:0.4rem">'
          + '<div style="font-family:Cinzel,serif;font-size:0.7rem;color:var(--gold);margin-bottom:0.3rem">\u{1F5E1} Armory Discovered!</div>'
          + '<div style="font-size:0.75rem">' + armoryWeapon.icon + ' <b>' + armoryWeapon.name + '</b></div>'
          + '<div style="font-size:0.65rem;color:var(--mist)">' + armoryWeapon.desc + '</div>'
          + '<div style="font-size:0.6rem;color:var(--steel);margin-top:0.2rem">Tier: <span style="color:' + tierColor(armoryWeapon.tier) + '">' + (armoryWeapon.tier||'common').toUpperCase() + '</span> · Added to weapon stash</div>'
          + '</div>';
      }
    }

    saveGame();
    updateGoldDisplay();

    const st2 = getStealthTier(), ht2 = getHonorTier();
    const repLine = `<br><span style="font-size:0.65rem;color:var(--mist)">${st2.icon} ${st2.name} · ${ht2.icon} ${ht2.name}</span>`;
    openModal('Mission Complete!',
      `<b style="color:var(--jade-bright)">Victory!</b><br><br>
      Mission: ${mission.name}<br>
      Gold earned: <b style="color:var(--gold)">+${mission.reward} G</b>${recruitMsg}${armoryMsg}${repLine}`,
      [{ label: 'Return to Hub', fn: () => {
        closeModal(); showScreen('hub'); showHubSection('clan'); selectedMissionId = null; selectedParty = [];
        // Show pending arc completion modal after navigation
        if (CS._pendingArcModal) {
          const _am = CS._pendingArcModal; CS._pendingArcModal = null;
          setTimeout(() => openModal(_am.title, _am.body, [{ label: 'Onwards!', fn: closeModal, cls: 'confirm' }]), 300);
        }
      }, cls: 'confirm' }]
    );
  } else {
    // Return uncollected doom bags
    CS.doomBags.forEach(bag => {
      (bag.items || []).forEach(item => {
        const cat = getCategoryForItem(item);
        if (GS.inventory[cat]) GS.inventory[cat].push(item);
      });
      if (bag.weapon && GS.weaponStash) GS.weaponStash.push(bag.weapon);
    });
    CS.doomBags = [];

    // Final purge of perished allies from roster
    // Remove perished allies from roster permanently (belt-and-suspenders after triggerPermadeath)
    const defPeriSet = new Set(CS.allies.filter(a => a.perished).map(a => a.id));
    if (defPeriSet.size) {
      GS.clan = GS.clan.filter(n => !defPeriSet.has(n.id));
      defPeriSet.forEach(id => addLog('Removed perished ninja from roster.', 'system'));
    }

    // Sync HP for surviving (non-perished) allies
    CS.allies.filter(a => !a.perished).forEach(a => {
      const gn = GS.clan.find(x => x.id === a.id);
      if (gn) {
        gn.hp = Math.max(5, Math.floor(gn.maxHp * 0.1));
        gn.carriedItems = a.doomed ? [] : (a.carriedItems || []);
        gn.weapon = (!a.doomed && a.weapon) ? { ...a.weapon } : null;
        if (a.jobs) gn.jobs = { ...a.jobs };
        if (a.unlockedAbilities) gn.unlockedAbilities = [...a.unlockedAbilities];
        if (a.equippedAbilities) gn.equippedAbilities = { ...a.equippedAbilities };
      }
    });
    applyMissionReputation(result, mission);
    saveGame();  // save AFTER purge so roster is correct on disk
    const defeatMsg = result === 'timedout'
      ? `<b style="color:var(--crimson-bright)">Time's Up!</b><br><br>You failed to complete the mission in time.<br>Return to the hub and try again.`
      : `<b style="color:var(--crimson-bright)">Defeat.</b><br><br>All your ninja have fallen.<br>Return to the hub to heal and regroup.`;
    openModal(result === 'timedout' ? 'Time Expired' : 'Mission Failed',
      defeatMsg,
      [{ label: 'Retreat to Hub', fn: () => { closeModal(); showScreen('hub'); showHubSection('clan'); selectedMissionId = null; selectedParty = []; }, cls: 'danger' }]
    );
  }
}

function useItem(ally) {
  if (!ally.carriedItems || !ally.carriedItems.length) {
    // Check if we can use an item to revive a doomed teammate instead
    const doomed = CS.allies.find(a => a.doomed);
    if (doomed) {
      toast('No items on ' + ally.name + '. A teammate is dying — pick up healing items!', 'error');
    } else {
      toast(`${ally.name} carries no items.`, 'error');
    }
    CS.selectedAction = null;
    return;
  }
  // Build a picker modal
  const items = ally.carriedItems;
  openModal(`\u{1F392} ${ally.name}'s Field Kit`,
    `<div style="font-size:0.75rem;color:var(--mist);margin-bottom:0.8rem">Select an item to use (${items.length}/${MAX_CARRY} slots used)</div>
    <div class="use-item-list">
      ${items.map((item, i) => `
        <div class="use-item-btn" onclick="executeCombatItem('${ally.gridId}', ${i})">
          <span style="font-size:1.3rem">${item.icon}</span>
          <div>
            <div class="stash-item-name">${item.name}</div>
            <div class="stash-item-desc">${item.desc}</div>
          </div>
        </div>`).join('')}
    </div>`,
    [{ label: 'Cancel', fn: () => { CS.selectedAction = null; document.getElementById('actionLabel').textContent = ''; closeModal(); renderCombat(); }, cls: '' }]
  );
}

function executeCombatItem(gridId, itemIndex) {
  const ally = CS.allies.find(a => a.gridId === gridId);
  if (!ally || !ally.carriedItems) return;
  const item = ally.carriedItems[itemIndex];
  if (!item) return;

  closeModal();
  CS.selectedAction = null;
  document.getElementById('actionLabel').textContent = '';

  if (item.effect === 'heal' || item.effect === 'full_heal') {
    // If ally is doomed, healing revives them
    if (ally.doomed) {
      reviveAlly(ally, item.value || 25);
    } else {
      const healed = Math.min(ally.maxHp - ally.hp, item.value || 0);
      ally.hp = Math.min(ally.maxHp, ally.hp + (item.value || 0));
      addLog(`${ally.name} uses ${item.name}. +${healed} HP -> ${ally.hp}/${ally.maxHp}`, 'heal');
    }
  } else if (item.effect === 'aoe_heal') {
    CS.allies.forEach(a => {
      if (a.hp > 0) {
        a.hp = Math.min(a.maxHp, a.hp + (item.value || 0));
        addLog(`${a.name} healed ${item.value} HP.`, 'heal');
      }
    });
  } else if (item.effect === 'dodge' || item.effect === 'stealth' || item.effect === 'armor' || item.effect === 'shadow_armor') {
    ally.buffs = ally.buffs || [];
    ally.buffs.push({ type: item.effect, value: item.value, turns: 3 });
    addLog(`${ally.name} activates ${item.name}. Effect for 3 turns.`, 'special');
  }

  // ── SMOKE BOMB ──
  if (item.effect === 'smoke_bomb') {
    const radius = item.radius || 2;
    const blindTurns = item.blindTurns || 2;
    let blinded = 0;
    CS.enemies.filter(e => e.hp > 0).forEach(e => {
      const dist = Math.abs(e.x - ally.x) + Math.abs(e.y - ally.y);
      if (dist <= radius) {
        e.status = 'blinded';
        e.blindTurns = blindTurns;
        blinded++;
        if (item.secondEffect === 'poison') e.status = 'poisoned';
      }
    });
    addLog(`\u{1F4A8} ${ally.name} throws ${item.name}! ${blinded} enemy${blinded !== 1 ? 'ies' : ''} blinded for ${blindTurns} turns.`, 'special');
    // Ally may flee — offer retreat option
    openModal('Smoke Cloud!',
      `<div style="color:var(--jade-bright)">Smoke deployed — ${blinded} enemies blinded!</div><br>
       <div class="text-xs text-mist">Your ninja can use the cover to retreat from battle.</div>`,
      [
        { label: 'Flee under cover', fn: () => { closeModal(); endCombat('fled'); }, cls: 'confirm' },
        { label: 'Stay and fight', fn: closeModal, cls: '' }
      ]
    );
    ally.carriedItems.splice(itemIndex, 1);
    const gnS = GS.clan.find(x => x.id === ally.id);
    if (gnS && gnS.carriedItems) {
      const giS = gnS.carriedItems.findIndex(x => x.id === item.id);
      if (giS !== -1) gnS.carriedItems.splice(giS, 1);
    }
    CS.unitActed = true;
    CS.savedMove = null;  // action taken
    renderCombat();
    return;
  }

  // Consume the item from carried items AND from the clan ninja's carry too
  ally.carriedItems.splice(itemIndex, 1);
  const gn = GS.clan.find(x => x.id === ally.id);
  if (gn && gn.carriedItems) {
    const gi = gn.carriedItems.findIndex(x => x.id === item.id);
    if (gi !== -1) gn.carriedItems.splice(gi, 1);
  }

  CS.unitActed = true;
  renderCombat();
}

function confirmFleeMission() {
  openModal('Retreat?', 'Abandon this mission? Your ninja will survive but gain no reward.',
    [
      { label: 'Retreat', fn: () => { closeModal(); endCombat('defeat'); }, cls: 'danger' },
      { label: 'Stay and Fight', fn: closeModal, cls: 'confirm' }
    ]
  );
}

function addLog(msg, type = '') {
  CS.log.push({ msg, type });
  if (CS.log.length > 50) CS.log.shift();
  const html = CS.log.slice(-20).map(l => `<div class="log-entry ${l.type}">${l.msg}</div>`).join('');
  ['combatLog', 'combatLogMobile'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.innerHTML = html; el.scrollTop = el.scrollHeight; }
  });
}

          <div class="party-select">${ninjaSlots || '<div class="text-xs text-mist">No available ninja.</div>'}</div>
          <div class="separator"></div>
          ${selectedTrainingType ? `<div class="text-xs text-mist mb-2">${TRAINING_TYPES.find(t=>t.id===selectedTrainingType)?.desc || ''}</div>` : '<div class="text-xs text-mist mb-2">← Select a training type first</div>'}
          <button class="assign-training-btn w-full" onclick="assignTraining()">⊕ Begin Training</button>
        </div>
      </div>
    </div>
  `;
}

function selectTrainingType(id) { selectedTrainingType = id; renderTraining(); }
function selectTrainingNinja(id) { selectedTrainingNinja = id; renderTraining(); }

function assignTraining() {
  if (!selectedTrainingType || !selectedTrainingNinja) { toast('Select a type and a ninja.', 'error'); return; }
  const ninja = GS.clan.find(n => n.id === selectedTrainingNinja);
  const tType = TRAINING_TYPES.find(t => t.id === selectedTrainingType);
  if (!ninja || !tType) return;
  if (ninja.training) { toast(`${ninja.name} is already training.`, 'error'); return; }

  const hours = tType.minHours + Math.floor(Math.random() * (tType.maxHours - tType.minHours + 1));
  const points = Math.max(1, Math.floor(hours / tType.pointsPerHour));
  ninja.training = {
    type: tType.name, stat: tType.stat, points,
    hours, endTime: Date.now() + hours * 3600000
  };
  saveGame();
  toast(`${ninja.name} begins ${tType.name} (${hours}h, +${points} ${tType.stat})`, 'success');
  selectedTrainingNinja = null;
  renderTraining();
}

function generateShopWeapons() {
  const allWeapons = [];
  Object.entries(WEAPONS).forEach(([type, cat]) => {
    cat.items.forEach(w => allWeapons.push({ ...w, type }));
  });
  // Random selection of 8-12 weapons
  const shuffled = allWeapons.sort(() => Math.random() - 0.5);
  return shuffled.slice(0, 10);
}

function generateShopItems() {
  const all = [...ITEMS.healing, ...ITEMS.costume, ...ITEMS.tactical];
  return all.sort(() => Math.random() - 0.5).slice(0, 12);

function openCodex() {
  const overlay = document.getElementById('codexOverlay');
  if (!overlay) return;

  // Render content first so it's ready when overlay appears
  renderCodexContent();

  overlay.style.display = 'block';
  overlay.scrollTop = 0;
  document.body.style.overflow = 'hidden';

  // Remove any stale handlers before adding fresh ones
  if (overlay._closeHandler) overlay.removeEventListener('pointerdown', overlay._closeHandler);
  if (overlay._keyHandler) document.removeEventListener('keydown', overlay._keyHandler);

  overlay._closeHandler = function(e) {
    if (e.target === overlay) closeCodex();
  };
  overlay.addEventListener('pointerdown', overlay._closeHandler);

  overlay._keyHandler = function(e) {
    if (e.key === 'Escape') closeCodex();
  };
  document.addEventListener('keydown', overlay._keyHandler);
}

function closeCodex() {
  const overlay = document.getElementById('codexOverlay');
  if (!overlay) return;
  overlay.style.display = 'none';
  document.body.style.overflow = '';
  if (overlay._closeHandler) overlay.removeEventListener('pointerdown', overlay._closeHandler);
  if (overlay._keyHandler) document.removeEventListener('keydown', overlay._keyHandler);
}

function renderCodex() {
  // Codex is now a full-screen modal — open it
  openCodex();
}

// ── MAP DECODE FUNCTION ──
// Converts compact char string arrays into CS.grid format (14×12)
function decodeMap(rows) {
  const CHAR_MAP = {
    '.': 'empty',  '1': 'floor1', '2': 'floor2', '3': 'floor3',
    'W': 'wall',   'F': 'forest', 'R': 'rubble',  'r': 'roof',
    'T': 'roof3',  'S': 'shadow', '~': 'water',   'G': 'gate',
    'E': 'exit',   'f': 'forest', 'C': 'cliff',   's': 'stone',
  };
  const grid = [];
  for (let y = 0; y < CS.gridH; y++) {
    grid.push([]);
    const row = rows[y] || '';
    for (let x = 0; x < CS.gridW; x++) {
      const ch = row[x] || '.';
      grid[y].push(CHAR_MAP[ch] || 'empty');
    }
  }
  return grid;
}

// ── TILE HEIGHT HELPER ──
function getTileHeight(x, y) {
  const key = CS.grid[y]?.[x] || 'empty';
  return (TERRAIN_TILES[key] || TERRAIN_TILES.empty).height || 0;
}

// ── TILE LIGHT HELPER ──
function getTileLight(x, y) {
  const key = CS.grid[y]?.[x] || 'empty';
  return (TERRAIN_TILES[key] || TERRAIN_TILES.empty).light ?? 1.0;
}

// ── UNIT JUMP STAT ──
function getUnitJump(unit) {
  if (!unit) return 1;
  const cls = CLASSES[unit.class];
  // jumpStat is defined directly on class: shinobi/kunoichi/shadow=2, others=1
  const baseJump = (cls?.jumpStat) || 1;
  // Mobility ability bonus (high_jump unlocked at level 5 for ninja classes)
  const ninjaBonus = hasNinjaMobility(unit, 'high_jump') ? 2 :
                     hasNinjaMobility(unit, 'roof_jump') ? 1 : 0;
  return baseJump + ninjaBonus;
}

// ── HEIGHT ADVANTAGE COMBAT MODIFIER ──
function getHeightAdvantage(attackerX, attackerY, defenderX, defenderY) {
  const aH = getTileHeight(attackerX, attackerY);
  const dH = getTileHeight(defenderX, defenderY);
  const diff = aH - dH;
  if (diff >= 3) return { dmgMult: 1.35, accBonus: 0.15, label: '⛰ High Ground (+35% dmg)' };
  if (diff >= 2) return { dmgMult: 1.25, accBonus: 0.10, label: '▲ High Ground (+25% dmg)' };
  if (diff >= 1) return { dmgMult: 1.12, accBonus: 0.05, label: '↑ Elevated (+12% dmg)' };
  if (diff <= -2) return { dmgMult: 0.85, accBonus: -0.10, label: '↓ Low Ground (-15% dmg)' };
  if (diff <= -1) return { dmgMult: 0.92, accBonus: -0.05, label: '↓ Low Ground (-8% dmg)' };
  return { dmgMult: 1.0, accBonus: 0, label: '' };
}

// ── TERRAIN EFFECT ON COMBAT ──
function getTerrainCombatEffect(x, y) {
  const key = CS.grid[y]?.[x] || 'empty';
  const effects = {
    forest: { defBonus: 0.85, label: '🌲 Forest Cover (-15% dmg taken)' },
    roof:   { atkBonus: 1.10, accBonus: 0.10, label: '▭ Roof (+10% atk, +10% acc)' },
    roof3:  { atkBonus: 1.15, accBonus: 0.15, label: '▬ High Roof (+15% atk)' },
    shadow: { stealthBonus: true, label: '░ Shadow (stealth bonus)' },
    stone:  { defBonus: 0.92, label: 's Stone footing (stable)' },
    rubble: { movePenalty: true, label: '∷ Rubble (unstable footing)' },
    water:  { movePenalty: true, noisePenalty: true, label: '≈ Shallow Water (slow+noisy)' },
  };
  return effects[key] || {};
}

// ==========================================
// ===== STEALTH SYSTEM =====
// ==========================================

const STEALTH = {
  // Detection radius: how far enemies can see in different light conditions
  baseDetectRadius: 5,
  nightDetectRadius: 3,
  isNightMission: false,

  // Check if a unit is in stealth (hidden)
  isHidden(unit) {
    return !!(unit.stealthed || unit.invisible);
  },

  // Calculate noise generated by moving to a tile
  getMovementNoise(x, y, unit) {
    const tile = TERRAIN_TILES[CS.grid[y]?.[x] || 'empty'];
    let noise = tile.noise || 0;
    // Ninja classes move silently on certain tiles
    const cls = unit?.class;
    if (['shinobi','shadow','kunoichi'].includes(cls)) noise = Math.max(0, noise - 1);
    // Silent landing ability
    if (hasNinjaMobility(unit, 'silent_landing')) noise = 0;
    return noise;
  },

  // Calculate enemy detection chance against a unit
  detectionChance(enemy, target) {
    if (!enemy || !target || target.hp <= 0) return 0;
    const dist = Math.abs(enemy.x - target.x) + Math.abs(enemy.y - target.y);
    const detectRadius = this.isNightMission ? this.nightDetectRadius : this.baseDetectRadius;
    if (dist > detectRadius) return 0;
    if (!hasLineOfSight(enemy.x, enemy.y, target.x, target.y)) return 0;

    let chance = 1.0;
    // Distance falloff
    chance *= (1 - (dist / (detectRadius + 1)) * 0.5);
    // Target's tile light level reduces detection in dark areas
    const lightLevel = getTileLight(target.x, target.y);
    chance *= lightLevel;
    // Target's cover
    const cover = (TERRAIN_TILES[CS.grid[target.y]?.[target.x] || 'empty'].cover || 0);
    chance *= Math.max(0.1, 1 - cover * 0.12);
    // Stealth tier bonus
    const stealthRep = (GS.reputation?.stealth || 0);
    if (stealthRep >= 50) chance *= 0.6;
    else if (stealthRep >= 20) chance *= 0.8;
    // Night mission bonus
    if (this.isNightMission) chance *= 0.6;
    return Math.max(0, Math.min(1, chance));
  },

  // Process stealth checks for all enemies against all allies
  processStealthChecks() {
    CS.enemies.filter(e => e.hp > 0).forEach(enemy => {
      CS.allies.filter(a => a.hp > 0 && !a.escaped).forEach(ally => {
        if (ally.invisible) return; // cannot be detected while invisible
        const chance = this.detectionChance(enemy, ally);
        if (Math.random() < chance * 0.15) { // Only 15% of the check chance triggers
          if (!CS.missionStats?.alliesAlerted) {
            gainRep('ENEMY_ALERTED');
          }
          if (CS.missionStats) CS.missionStats.alliesAlerted = true;
        }
      });
    });
  },

  // Apply first-strike stealth bonus
  getStealthFirstStrikeBonus(attacker, defender) {
    const tile = CS.grid[attacker.y]?.[attacker.x] || 'empty';
    const lightLevel = getTileLight(attacker.x, attacker.y);
    const inShadow = lightLevel < 0.3;
    const isNinja = ['shinobi','shadow','kunoichi'].includes(attacker.class);
    if (!CS.missionStats?.alliesAlerted && isNinja) {
      if (inShadow) return { mult: 1.5, label: '🌑 Shadow Strike (+50% dmg)' };
      return { mult: 1.25, label: '⚡ Stealth Strike (+25% dmg)' };
    }
    return { mult: 1.0, label: '' };
  }
};

// ==========================================
// ===== NINJA MOBILITY SYSTEM =====
// ==========================================

// Track ninja-specific mobility abilities
const NINJA_MOBILITY = {
  roof_jump:      { name: 'Roof Jump',      desc: 'Leap to rooftops from adjacent ground.', classes: ['shinobi','shadow'] },
  wall_traversal: { name: 'Wall Traversal', desc: 'Reduce movement cost on walls/cliffs.', classes: ['shinobi','kunoichi','shadow'] },
  high_jump:      { name: 'High Jump',      desc: '+2 jump height stat.', classes: ['shinobi','shadow','kunoichi'] },
  silent_landing: { name: 'Silent Landing', desc: 'No noise penalty on any terrain.', classes: ['shinobi','shadow'] },
  shadow_step:    { name: 'Shadow Step',    desc: 'Teleport to any shadow tile in range.', classes: ['shadow'] },
};

function hasNinjaMobility(unit, ability) {
  if (!unit) return false;
  const mob = NINJA_MOBILITY[ability];
  if (!mob) return false;
  if (!mob.classes.includes(unit.class)) return false;
  // Unlocked at certain levels / via training
  if (unit.level >= 3 && ability === 'roof_jump') return true;
  if (unit.level >= 4 && ability === 'wall_traversal') return true;
  if (unit.level >= 3 && ability === 'silent_landing') return true;
  if (unit.level >= 5 && ability === 'high_jump') return true;
  if (unit.level >= 5 && ability === 'shadow_step') return true;
  return false;
}

// Execute shadow step — teleport to nearest shadow tile in range
function executeShadowStep(ally) {
  if (!hasNinjaMobility(ally, 'shadow_step')) {
    toast('Shadow Step requires Shadow class at Level 5.', 'error'); return;
  }
  if (CS.unitMoved) { toast('Already moved this turn.', 'error'); return; }
  const range = getEffectiveMoveRange(ally) + 2;
  const shadowTiles = [];
  for (let dy = -range; dy <= range; dy++) {
    for (let dx = -range; dx <= range; dx++) {
      if (Math.abs(dx)+Math.abs(dy) > range) continue;
      const tx = ally.x+dx, ty = ally.y+dy;
      if (!isPosEmpty(tx, ty, ally.gridId)) continue;
      const lightLevel = getTileLight(tx, ty);
      if (lightLevel < 0.3) shadowTiles.push({ x: tx, y: ty, color: 'rgba(100,50,200,0.35)' });
    }
  }
  if (!shadowTiles.length) { toast('No shadow tiles in range.', 'error'); return; }
  CS.savedMove = { x: ally.x, y: ally.y, facing: ally.facing };
  CS.highlightedTiles = shadowTiles;
  CS.selectedAction = 'shadow_step';
  document.getElementById('actionLabel').textContent = '🌑 Shadow Step — click a shadow tile';
  renderCombat();
}

// ==========================================
// ===== ENHANCED DAMAGE CALCULATION =====
// ==========================================

// Patch calcDamage to include height advantage and terrain effects
const _origCalcDamage = window.calcDamage || null;
function calcDamage(attacker, defender) {
  const cls = CLASSES[attacker.class];
  let base = 0;
  if (attacker.weapon && weaponUsable(attacker)) {
    const w = attacker.weapon;
    base = w.dmg[0] + Math.floor(Math.random() * (w.dmg[1] - w.dmg[0] + 1));
    // Proficiency modifier
    const profKey = w.type;
    const profVal = attacker.proficiency?.[profKey] || 3;
    const profMult = 1 + (profVal - 3) * 0.05;
    base = Math.round(base * profMult);
  } else {
    base = 4 + Math.floor(Math.random() * 4);
  }

  // Support ability bonus
  const suppMult = getSupportDmgBonus(attacker);
  base = Math.round(base * suppMult);

  // Reputation combat modifier
  const repMods = getRepCombatMods(attacker);
  base = Math.round(base * repMods.dmgMult);

  // CLASS: Berserker — gains power when damaged
  if (attacker.class === 'berserker') {
    const hpLost = attacker.maxHp - attacker.hp;
    const berserkBonus = 1 + (Math.floor(hpLost / 10) * 0.05);
    base = Math.round(base * berserkBonus);
  }

  // ── HEIGHT ADVANTAGE ──
  const heightMod = defender ? getHeightAdvantage(attacker.x, attacker.y, defender.x, defender.y) : { dmgMult: 1.0, label: '' };
  if (heightMod.dmgMult !== 1.0) {
    base = Math.round(base * heightMod.dmgMult);
    if (heightMod.label) addLog(heightMod.label, 'special');
  }

  // ── TERRAIN EFFECT ON ATTACK ──
  const terrainAtk = getTerrainCombatEffect(attacker.x, attacker.y);
  if (terrainAtk.atkBonus) {
    base = Math.round(base * terrainAtk.atkBonus);
    if (terrainAtk.label) addLog(terrainAtk.label, 'special');
  }

  // ── STEALTH FIRST-STRIKE BONUS ──
  const stealthBonus = STEALTH.getStealthFirstStrikeBonus(attacker, defender);
  if (stealthBonus.mult > 1.0) {
    base = Math.round(base * stealthBonus.mult);
    if (stealthBonus.label) addLog(stealthBonus.label, 'special');
  }

  // ── POSITIONAL: TERRAIN DEFENSE ──
  if (defender) {
    const terrainDef = getTerrainCombatEffect(defender.x, defender.y);
    if (terrainDef.defBonus) {
      base = Math.round(base * terrainDef.defBonus);
    }
  }

  return Math.max(1, base);
}

// ==========================================
// ===== HEIGHT RENDERING OVERLAY =====
// ==========================================

// Patch drawCanvas to add height indicators and stealth overlays
// Height/stealth overlay — called from main drawCanvas via _drawHeightOverlay()
function _drawHeightOverlay() {
  const canvas = document.getElementById('combatCanvas');
  const cs = CS.cellSize;
  const ctx = canvas.getContext('2d');

  // ── Height elevation indicators — batched for performance ──
  // Set shared font state once before the loop
  const showHeightNum = cs >= 40;
  if (showHeightNum) {
    ctx.font = 'bold ' + Math.round(cs * 0.18) + 'px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
  }
  const now = Date.now();
  for (let y = 0; y < CS.gridH; y++) {
    for (let x = 0; x < CS.gridW; x++) {
      const key = CS.grid[y]?.[x] || 'empty';
      const tileData = TERRAIN_TILES[key];
      if (!tileData?.passable) continue;
      const h = tileData.height || 0;
      const px = x * cs, py = y * cs;

      // Color overlay for elevated tiles
      if (h >= 3) {
        ctx.fillStyle = 'rgba(80,60,20,0.18)';
        ctx.fillRect(px, py, cs, cs);
        ctx.fillStyle = 'rgba(200,160,60,0.45)';
        ctx.fillRect(px, py, cs, 2);
        ctx.fillRect(px, py, 2, cs);
      } else if (h === 2) {
        ctx.fillStyle = 'rgba(60,50,20,0.12)';
        ctx.fillRect(px, py, cs, cs);
        ctx.fillStyle = 'rgba(180,140,50,0.3)';
        ctx.fillRect(px, py, cs, 2);
      } else if (h === 1) {
        ctx.fillStyle = 'rgba(255,255,255,0.04)';
        ctx.fillRect(px, py, cs, cs);
        ctx.fillStyle = 'rgba(200,200,200,0.15)';
        ctx.fillRect(px, py, cs, 1);
      }

      // Height number (font already set above)
      if (h > 0 && showHeightNum) {
        ctx.fillStyle = h >= 3 ? 'rgba(255,220,100,0.55)' : h === 2 ? 'rgba(255,220,100,0.45)' : 'rgba(255,220,100,0.35)';
        ctx.fillText(h, px + 2, py + 2);
      }

      // Shadow fog overlay
      const lightLevel = tileData.light ?? 1.0;
      if (lightLevel < 0.5) {
        ctx.fillStyle = 'rgba(0,0,10,' + ((1 - lightLevel) * 0.55).toFixed(2) + ')';
        ctx.fillRect(px, py, cs, cs);
      }

      // Water ripple (throttled — only animate every 2nd frame equivalent)
      if (key === 'water') {
        const wave = 0.4 + 0.2 * Math.sin(now / 500 + x + y);
        ctx.fillStyle = 'rgba(40,100,180,' + (wave * 0.25).toFixed(2) + ')';
        ctx.fillRect(px, py, cs, cs);
      }
    }
  }

  // ── Detection radius preview (when viewing enemy ranges) ──
  if (CS.selectedEnemy && CS.tacticsEngineEnabled) {
    const e = CS.enemies.find(en => en.id === CS.selectedEnemy);
    if (e) {
      const detectR = STEALTH.isNightMission ? STEALTH.nightDetectRadius : STEALTH.baseDetectRadius;
      for (let dy = -detectR; dy <= detectR; dy++) {
        for (let dx = -detectR; dx <= detectR; dx++) {
          if (Math.abs(dx)+Math.abs(dy) > detectR) continue;
          const tx = e.x+dx, ty = e.y+dy;
          if (tx<0||ty<0||tx>=CS.gridW||ty>=CS.gridH) continue;
          ctx.fillStyle = 'rgba(255,200,50,0.06)';
          ctx.fillRect(tx*cs, ty*cs, cs, cs);
        }
      }
    }
  }
}

// ==========================================
// ===== INITIALIZATION =====
// ==========================================

function initializeTacticsEngine() {
  CS.tacticsEngineEnabled = true;

  // Upgrade existing TERRAIN_PRESETS to use better terrain placement
  TERRAIN_PRESETS.village   = { base: 'empty', features: ['wall','rubble','roof','shadow'] };
  TERRAIN_PRESETS.castle    = { base: 'empty', features: ['wall','wall','floor2','floor1'] };
  TERRAIN_PRESETS.dungeon   = { base: 'shadow', features: ['wall','rubble','shadow'] };
  TERRAIN_PRESETS.fortress  = { base: 'empty', features: ['wall','wall','floor2','floor3'] };
  TERRAIN_PRESETS.palace    = { base: 'floor1', features: ['wall','floor2','floor3'] };
  TERRAIN_PRESETS.docks     = { base: 'empty', features: ['wall','water','rubble'] };
  TERRAIN_PRESETS.forest    = { base: 'forest', features: ['forest','forest','shadow','water'] };
  TERRAIN_PRESETS.keep      = { base: 'empty', features: ['wall','wall','wall','floor3'] };

  // jumpStat is now defined directly in CLASSES (see CLASSES declaration above)
  // No runtime assignment needed — this is kept for clarity only.

  // Night mission detection for certain terrain types
  STEALTH.isNightMission = false; // Will be set per mission

  // Patch night_ambush and forest_ambush missions to enable night stealth
  const nightMissionTypes = ['forest', 'docks'];
  if (CS.mission && nightMissionTypes.includes(CS.mission.terrain)) {
    STEALTH.isNightMission = true;
    addLog('🌙 Night conditions — stealth enhanced. Enemies detect less.', 'system');
  }

  console.log('[NINDO Tactics v2] Engine initialized — Height, Stealth, AI Scoring active.');
}

// ── Hook initializeTacticsEngine into initCombat ──
// We do this by patching the CS object after combat starts
// showScreen hook removed — initializeTacticsEngine called directly from initCombat

// ── Add Shadow Step to canvas click handler (action type) ──
const _origCanvasClick = document.getElementById('combatCanvas').onclick;
document.getElementById('combatCanvas').addEventListener('click', function(e) {
  if (CS.selectedAction === 'shadow_step' && CS.phase === 'player' && CS.activeUnit) {
    const rect = this.getBoundingClientRect();
    const cs2 = CS.cellSize;
    const gx = Math.floor((e.clientX - rect.left) / cs2);
    const gy = Math.floor((e.clientY - rect.top) / cs2);
    const ally = CS.allies.find(a => a.gridId === CS.activeUnit);
    if (!ally) return;
    const reachable = CS.highlightedTiles.find(t => t.x === gx && t.y === gy);
    if (!reachable) { toast('Cannot shadow-step there.', 'error'); e.stopPropagation(); return; }
    ally.x = gx; ally.y = gy;
    ally.facing = 'south';
    CS.unitMoved = true;
    CS.selectedAction = null;
    CS.highlightedTiles = [];
    addLog(ally.name + ' shadow-steps into the darkness!', 'special');
    STEALTH.processStealthChecks();
    renderCombat();
    e.stopPropagation();
  }
}, true); // capture phase

// Stealth checks run via STEALTH.processStealthChecks() in runEnemyUnitTurn directly

// ── Expose shadow step button in combat controls ──
window.shadowStep = function() {
  if (CS.phase !== 'player' || !CS.activeUnit) return;
  const ally = CS.allies.find(a => a.gridId === CS.activeUnit);
  if (!ally) return;
  executeShadowStep(ally);
};

// ── Add height info to selected unit display ──
// ── Standalone height/terrain info appender — called from renderSelectedInfo ──
function _appendHeightInfoToSelected() {
  if (!CS.grid || !CS.activeUnit) return;
  const ally = CS.allies.find(a => a.gridId === CS.activeUnit);
  if (!ally) return;
  const terrainKey = CS.grid[ally.y]?.[ally.x] || 'empty';
  const tileData = TERRAIN_TILES[terrainKey] || TERRAIN_TILES.empty;
  const h = tileData.height || 0;
  const light = tileData.light ?? 1.0;
  const heightStr = h > 0 ? ' · <span style="color:#ffcc44">H:' + h + '</span>' : '';
  const lightStr = light < 0.5 ? ' · <span style="color:#8888cc">Shadow</span>' : '';
  const coverStr = (tileData.cover || 0) > 0 ? ' · <span style="color:#44aa77">Cover</span>' : '';
  const statusLine = '<div style="font-size:0.55rem;color:var(--mist);margin-top:2px;font-family:Cinzel,serif">' + terrainKey.toUpperCase() + heightStr + lightStr + coverStr + '</div>';
  ['selectedInfo','selectedInfoMobile'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.innerHTML += statusLine;
  });
}

console.log('[NINDO Tactics v2] Systems loaded: Terrain · Height · Movement · Combat · AI · Stealth · Maps');
