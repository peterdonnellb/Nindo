// ===== COMBAT INTERACTION =====
// ==========================================

function selectAlly(gridId) {
  if (CS.phase !== 'player') return;
  // Allow clicking doomed allies to remind player to use items
  const clicked = CS.allies.find(a => a.gridId === gridId);
  if (clicked && clicked.doomed && clicked.gridId !== CS.activeUnit) {
    toast(clicked.name + ' is DYING (' + clicked.doomCountdown + ' turns)! Use a healing item to revive!', 'error');
    return;
  }
  if (gridId && gridId !== CS.activeUnit) return;
  CS.selectedAlly = gridId;
  CS.selectedAction = null;
  CS.highlightedTiles = [];
  document.getElementById('actionLabel').textContent = '';
  renderCombat();
}

const FACING_LABEL = { south: '↓ South', east: '→ East', west: '← West', north: '↑ North' };

function setFacing(dir) {
  const ally = CS.allies.find(a => a.gridId === CS.activeUnit);
  if (!ally || ally.hp <= 0 || CS.phase !== 'player' || ally.gridId !== CS.activeUnit) return;
  ally.facing = dir;
  syncFacingUI(dir);
  drawCanvas();
}

function syncFacingUI(dir) {
  ['north','south','east','west'].forEach(d => {
    const btn = document.getElementById('facing' + d.charAt(0).toUpperCase() + d.slice(1));
    if (btn) btn.classList.toggle('active', d === dir);
  });
  const lbl = document.getElementById('facingLabel');
  if (lbl) lbl.textContent = dir ? ('Facing ' + FACING_LABEL[dir]) : '';
}

function setAction(action) {
  if (CS.phase !== 'player' || !CS.activeUnit) return;
  const ally = CS.allies.find(a => a.gridId === CS.activeUnit);
  if (!ally || ally.hp <= 0) return;

  CS.selectedAction = action;
  CS.highlightedTiles = [];

  const label = { move: '⊕ Click tile to Move', attack: '⚔ Click enemy to Attack', special: `✦ ${ally.specialMove.name} — click target`, item: '⊛ Using item...' };
  document.getElementById('actionLabel').textContent = label[action] || '';

  if (action === 'move') {
    const range = getEffectiveMoveRange(ally);
    CS.highlightedTiles = getReachableTiles(ally.x, ally.y, range, ally.gridId);
  } else if (action === 'attack') {
    const range = ally.weapon?.range || 1;
    CS.highlightedTiles = getAttackTiles(ally.x, ally.y, range);
  } else if (action === 'special') {
    const range = ally.weapon?.range || 2;
    CS.highlightedTiles = getAttackTiles(ally.x, ally.y, range + 1);
  } else if (action === 'item') {
    useItem(ally);
  }

  renderCombat();
}


function buildEnemySpriteImg(typeKey, emoji, size) {
  const src = getEnemySpriteDataURL(typeKey, size);
  if (!src) return '<span style="font-size:' + (size * 0.7) + 'px">' + emoji + '</span>';
  return '<img src="' + src + '" width="' + size + '" height="' + size + '" style="border-radius:50%;border:1px solid rgba(220,80,80,0.45);object-fit:cover">';
}

function buildEnemySpriteImgLg(typeKey, emoji, size) {
  const src = getEnemySpriteDataURL(typeKey, size);
  if (!src) return '<span style="font-size:' + Math.round(size * 0.8) + 'px">' + emoji + '</span>';
  return '<img src="' + src + '" width="' + size + '" height="' + size + '" style="border-radius:4px;border:1px solid rgba(255,255,255,0.1);object-fit:cover">';
}

// Bresenham line-of-sight check — returns false if a wall blocks the path between two tiles.
// Tiles on non-passable terrain block LoS; forest/rubble do NOT (they're concealing, not blocking).
function hasLineOfSight(x1, y1, x2, y2) {
  if (x1 === x2 && y1 === y2) return true;
  const dx = Math.abs(x2 - x1), dy = Math.abs(y2 - y1);
  const sx = x1 < x2 ? 1 : -1, sy = y1 < y2 ? 1 : -1;
  let err = dx - dy;
  let cx = x1, cy = y1;
  while (true) {
    // Don't check the start or end tile themselves
    if (!(cx === x1 && cy === y1) && !(cx === x2 && cy === y2)) {
      const tile = CS.grid?.[cy]?.[cx];
      const passable = TERRAIN_TILES[tile]?.passable !== false;
      if (tile && !passable) {
        return false; // wall blocks LoS
      }
    }
    if (cx === x2 && cy === y2) break;
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; cx += sx; }
    if (e2 <  dx) { err += dx; cy += sy; }
  }
  return true;
}

function getReachableTiles(startX, startY, range, excludeId) {
  // BFS with movement costs — respects terrain and height differences
  const unit = [...CS.allies, ...CS.enemies].find(u => u.gridId === excludeId || u.id === excludeId);
  const jumpStat = getUnitJump(unit);
  const ignoreDifficult = unit ? hasMovementAbility(unit, 'ignore_difficult') : false;

  const visited = new Map();
  const queue = [{ x: startX, y: startY, cost: 0 }];
  visited.set(startX + ',' + startY, 0);
  const tiles = [];
  let qi = 0; // index pointer — avoids O(n) shift()

  while (qi < queue.length) {
    const cur = queue[qi++];
    const DIRS = [{dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1}];
    for (const { dx, dy } of DIRS) {
      const nx = cur.x + dx, ny = cur.y + dy;
      const key = nx + ',' + ny;
      if (!isPosEmpty(nx, ny, excludeId)) continue;
      const tile = TERRAIN_TILES[CS.grid[ny]?.[nx] || 'empty'];
      let moveCost = (ignoreDifficult && tile.moveCost === 2) ? 1 : (tile.moveCost || 1);
      // Height climbing cost
      const fromH = getTileHeight(cur.x, cur.y);
      const toH = getTileHeight(nx, ny);
      const hDiff = toH - fromH;
      if (hDiff > jumpStat) continue; // too high to climb
      if (hDiff > 0) moveCost += hDiff; // climbing costs extra
      const newCost = cur.cost + moveCost;
      if (newCost > range) continue;
      if (visited.has(key) && visited.get(key) <= newCost) continue;
      visited.set(key, newCost);
      // Height tint: blue for high ground, green for same, yellow for low
      const heightDiff = toH - getTileHeight(startX, startY);
      const col = heightDiff > 0 ? 'rgba(80,160,255,0.28)' : heightDiff < 0 ? 'rgba(200,170,50,0.22)' : 'rgba(61,170,125,0.25)';
      tiles.push({ x: nx, y: ny, color: col, cost: newCost });
      queue.push({ x: nx, y: ny, cost: newCost });
    }
  }
  return tiles;
}

function getAttackTiles(cx, cy, range) {
  const tiles = [];
  const needsLoS = range > 1;
  CS.enemies.filter(e => e.hp > 0).forEach(e => {
    const dist = Math.abs(e.x-cx)+Math.abs(e.y-cy);
    if (dist > range) return;
    if (needsLoS && !hasLineOfSight(cx,cy,e.x,e.y)) return;
    tiles.push({ x:e.x, y:e.y, color:'rgba(192,57,43,0.3)' });
  });
  CS.allies.filter(a => a.hp > 0).forEach(a => {
    const dist = Math.abs(a.x-cx)+Math.abs(a.y-cy);
    if (dist > range || a.gridId===CS.activeUnit) return;
    if (needsLoS && !hasLineOfSight(cx,cy,a.x,a.y)) return;
    tiles.push({ x:a.x, y:a.y, color:'rgba(61,170,125,0.2)' });
  });
  return tiles;
}

document.getElementById('combatCanvas').addEventListener('click', function(e) {
  const rect = this.getBoundingClientRect();
  // Use raw pixel position relative to canvas — works correctly with scroll
  const cs = CS.cellSize;
  const gx = Math.floor((e.clientX - rect.left) / cs);
  const gy = Math.floor((e.clientY - rect.top) / cs);

  // If no action selected and player phase: check for enemy click to show ranges
  if (CS.phase === 'player' && !CS.selectedAction) {
    const clickedEnemy = CS.enemies.find(en => en.hp > 0 && en.x === gx && en.y === gy);
    if (clickedEnemy) {
      // Toggle: click same enemy again to deselect
      if (CS.selectedEnemy === clickedEnemy.id) {
        CS.selectedEnemy = null;
        CS.highlightedTiles = [];
      } else {
        CS.selectedEnemy = clickedEnemy.id;
        // Build range overlay: move range in blue, attack range in red
        const moveTiles = [], atkTiles = [];
        for (let dy = -clickedEnemy.moveRange; dy <= clickedEnemy.moveRange; dy++) {
          for (let dx2 = -clickedEnemy.moveRange; dx2 <= clickedEnemy.moveRange; dx2++) {
            if (Math.abs(dx2) + Math.abs(dy) <= clickedEnemy.moveRange) {
              const nx = clickedEnemy.x + dx2, ny = clickedEnemy.y + dy;
              if (nx >= 0 && nx < CS.gridW && ny >= 0 && ny < CS.gridH)
                moveTiles.push({ x: nx, y: ny, color: 'rgba(80,130,220,0.18)' });
            }
          }
        }
        for (let dy = -clickedEnemy.attackRange; dy <= clickedEnemy.attackRange; dy++) {
          for (let dx2 = -clickedEnemy.attackRange; dx2 <= clickedEnemy.attackRange; dx2++) {
            if (Math.abs(dx2) + Math.abs(dy) <= clickedEnemy.attackRange) {
              const nx = clickedEnemy.x + dx2, ny = clickedEnemy.y + dy;
              if (nx >= 0 && nx < CS.gridW && ny >= 0 && ny < CS.gridH)
                atkTiles.push({ x: nx, y: ny, color: 'rgba(220,60,60,0.22)' });
            }
          }
        }
        // Attack tiles override move tiles for clarity
        CS.highlightedTiles = [...moveTiles, ...atkTiles];
      }
      renderCombat();
      return;
    } else {
      // Clicked empty space: deselect any enemy
      if (CS.selectedEnemy) {
        CS.selectedEnemy = null;
        CS.highlightedTiles = [];
        renderCombat();
      }
    }
    return;
  }

  if (CS.phase !== 'player' || !CS.selectedAction || !CS.activeUnit) return;

  const ally = CS.allies.find(a => a.gridId === CS.activeUnit);
  if (!ally || ally.hp <= 0) return;

  // Clear enemy range overlay when taking an action
  CS.selectedEnemy = null;

  if (CS.selectedAction === 'move') {
    handleMove(ally, gx, gy);
  } else if (CS.selectedAction === 'attack') {
    handleAttack(ally, gx, gy);
  } else if (CS.selectedAction === 'special') {
    handleSpecial(ally, gx, gy);
  }
});

// Touch support for canvas
document.getElementById('combatCanvas').addEventListener('touchstart', function(e) {
  e.preventDefault();
  const touch = e.touches[0];
  // Dispatch click with touch coordinates — canvas rect accounts for scroll
  this.dispatchEvent(new MouseEvent('click', {
    clientX: touch.clientX, clientY: touch.clientY, bubbles: true, cancelable: true
  }));
}, { passive: false });

function handleMove(ally, tx, ty) {
  if (CS.unitMoved) { toast('Already moved this turn.', 'error'); return; }
  const reachable = CS.highlightedTiles.find(t => t.x === tx && t.y === ty);
  if (!reachable) { toast('Cannot move there.', 'error'); return; }

  // Snapshot position for undo (before any side-effects)
  CS.savedMove = { x: ally.x, y: ally.y, facing: ally.facing };

  // Auto-update facing based on movement direction
  const dx = tx - ally.x, dy = ty - ally.y;
  if (Math.abs(dx) >= Math.abs(dy)) {
    ally.facing = dx > 0 ? 'east' : 'west';
  } else {
    ally.facing = dy > 0 ? 'south' : 'north';
  }
  ally.x = tx; ally.y = ty;
  CS.unitMoved = true;
  CS.selectedAction = null;
  CS.highlightedTiles = [];
  addLog(`${ally.name} moves to (${tx},${ty}).`);

  // ── RESCUE: prisoner follows the ally who freed them ──
  if (CS.prisoner && CS.prisoner.freed && CS.prisonerFreed) {
    // Prisoner moves to where the ally just came from (one step behind)
    const _prevX = ally.x - (tx - ally.x);  // ally.x is already updated, recalculate old pos
    // Simpler: prisoner just snaps to adjacent-to-ally in direction ally came from
    // We stored ally's old pos before move — we need to track it
    // Instead: prisoner moves toward ally each time any ally moves
    const _distP = Math.abs(CS.prisoner.x - ally.x) + Math.abs(CS.prisoner.y - ally.y);
    if (_distP > 1) {
      const _pdx = Math.sign(ally.x - CS.prisoner.x);
      const _pdy = Math.sign(ally.y - CS.prisoner.y);
      if (Math.abs(ally.x - CS.prisoner.x) >= Math.abs(ally.y - CS.prisoner.y)) {
        CS.prisoner.x += _pdx;
        CS.prisoner.facing = _pdx > 0 ? 'east' : 'west';
      } else {
        CS.prisoner.y += _pdy;
        CS.prisoner.facing = _pdy > 0 ? 'south' : 'north';
      }
    }
  }

  // ── DOOM BAG: step on a fallen ally's bag to recover it ──
  const doomBag = getDoomBagAt(tx, ty);
  if (doomBag) pickupDoomBag(ally, doomBag);

  // ── GOLD BAG: step on a collector's dropped coin bag ──
  const goldBagIdx = CS.goldPickups.findIndex(g => g.x === tx && g.y === ty);
  if (goldBagIdx !== -1) {
    const goldBag = CS.goldPickups[goldBagIdx];
    GS.gold += goldBag.amount;
    CS.goldPickups.splice(goldBagIdx, 1);
    updateGoldDisplay();
    saveGame();
    addLog('💰 ' + ally.name + ' collects ' + goldBag.amount + 'G from the tax bag!', 'heal');
    toast('+' + goldBag.amount + 'G collected!', 'success');
  }

  // ── RESCUE: key-holder walks onto prisoner tile to free them ──
  if (CS.prisoner && !CS.prisoner.freed && ally.hasLoot
      && tx === CS.prisoner.x && ty === CS.prisoner.y) {
    CS.prisoner.freed = true;
    CS.prisonerFreed = true;
    ally.hasLoot = false;       // key consumed
    CS.allyWithLoot = null;
    CS.exitsActive = true;
    CS.objectivePhase = 'extract';
    addLog('⛓ Prisoner freed! Guide them to the exit!', 'system');
    toast('Prisoner freed — reach the exit!', 'success');
    // Spawn reinforcements on prisoner freed
    spawnReinforcements('rescue_freed');
    renderCombat();
    // DON'T return — let unitMoved stay true so turn can be ended normally
  }

  // ── THEFT: step on dropped loot to pick it up ──
  if (CS.lootOnFloor && tx === CS.lootOnFloor.x && ty === CS.lootOnFloor.y) {
    ally.hasLoot = true;
    CS.allyWithLoot = ally.gridId;
    const lootName = CS.lootOnFloor.name;
    CS.lootOnFloor = null;
    // Activate exits now that loot is secured
    CS.exitsActive = true;
    addLog(`${ally.name} picks up the ${lootName}! Reach the exit!`, 'system');
    toast(`${lootName} secured — reach the exit!`, 'success');
  }

  // ── ESCAPE: step onto active exit tile ──
  const onExit = CS.exitTiles.some(e => e.x === tx && e.y === ty);
  if (onExit && CS.exitsActive && !CS.alliesEscaped.includes(ally.gridId)) {
    CS.alliesEscaped.push(ally.gridId);
    ally.escaped = true;

    // If on rescue floor, prisoner exits with this ally if freed
    if (CS.prisonerFreed && CS.prisoner && CS.prisoner.freed) {
      CS.prisoner.escaped = true;
      addLog(`✓ ${ally.name} escapes with the prisoner!`, 'system');
      CS.objectivePhase = 'done';
    } else if (ally.gridId === CS.allyWithLoot) {
      CS.objectivePhase = 'done';
      addLog(`✓ ${ally.name} escapes with the loot!`, 'system');
    } else {
      addLog(`✓ ${ally.name} reaches the exit!`, 'system');
    }
    toast(`${ally.name} escaped!`, 'success');

    // Multi-floor: advance when all alive allies escaped
    const _mission = CS.mission;
    const _isMulti = !!(_mission.floors && _mission.floors.length > 1);
    const _isLastFloor = !_isMulti || CS.currentFloor >= CS.totalFloors - 1;
    if (_isMulti && !_isLastFloor) {
      const _remaining = CS.allies.filter(a => isAllyAlive(a) && !a.escaped);
      if (_remaining.length === 0) setTimeout(advanceFloor, 600);
    } else {
      checkCombatEnd();
    }
  }

  renderCombat();
}

// Apply on-hit weapon effects (bleed, stun, poison, armor_break, stun_chance)
function applyWeaponEffect(weapon, target) {
  if (!weapon || !weapon.effect || !target || target.hp <= 0) return;

  const effect = weapon.effect;
  const name = weapon.name;

  if (effect === 'bleed' && weapon.bleedDmg) {
    // Stack bleed — store highest bleedDmg
    const existing = target.bleeds || 0;
    target.bleeds = Math.max(existing, weapon.bleedDmg);
    target.bleedTurns = 3;
    addLog(`\u{1FA78} ${target.name} is bleeding! (${target.bleeds} HP/turn)`, 'damage');
  }

  if (effect === 'stun' || (effect === 'stun_chance' && Math.random() < (weapon.stunChance || 0.25))) {
    target.status = 'stunned';
    target.stunTurns = weapon.stunTurns || 1;
    addLog(`\u{1F4AB} ${target.name} is stunned by ${name}!`, 'special');
  }

  if (effect === 'armor_break') {
    // Remove one armor_passive buff if present
    if (target.buffs) {
      const idx = target.buffs.findIndex(b => b.type === 'armor_passive');
      if (idx !== -1) {
        target.buffs.splice(idx, 1);
        addLog(`\u{1F6E1} ${name} shatters ${target.name}'s armor!`, 'special');
      }
    }
  }

  // Secondary effect
  if (weapon.secondEffect) {
    if (weapon.secondEffect === 'poison' && target.status !== 'poisoned') {
      target.status = 'poisoned';
      addLog(`☠ ${target.name} is poisoned by ${name}!`, 'special');
    }
    if (weapon.secondEffect === 'stun_chance' && Math.random() < (weapon.stunChance || 0.3)) {
      target.status = 'stunned';
      target.stunTurns = 1;
      addLog(`\u{1F4AB} ${target.name} is stunned!`, 'special');
    }
  }
}


// ── UNARMED ATTACK SYSTEM ──
// Per-class unarmed flavour and damage. Returns { name, icon, dmg:[min,max], range:1 }
const UNARMED_PROFILES = {
  shinobi:   { name: 'Palm Strike',    icon: '🤜', dmg: [4,  8],  desc: 'A swift open-palm strike.' },
  kunoichi:  { name: 'Nerve Strike',   icon: '🤜', dmg: [3,  7],  desc: 'Precise pressure-point hit.' },
  ronin:     { name: 'Iaijutsu Kick',  icon: '🦵', dmg: [6,  11], desc: 'A powerful samurai kick.' },
  monk:      { name: 'Iron Fist',      icon: '👊', dmg: [8,  14], desc: 'Channelled chi into the fist.' },
  shadow:    { name: 'Void Touch',     icon: '🖐', dmg: [5,  10], desc: 'Dark energy discharged on contact.' },
  berserker: { name: 'Haymaker',       icon: '💢', dmg: [10, 18], desc: 'A wild crushing haymaker.' },
};

function getUnarmedProfile(classKey) {
  return UNARMED_PROFILES[classKey] || { name: 'Punch', icon: '👊', dmg: [3, 6], desc: 'A basic strike.' };
}

function isEffectivelyUnarmed(ally) {
  // No weapon at all, OR weapon exists but is broken/empty
  return !ally.weapon || !weaponUsable(ally);
}

// Discard a weapon during combat — pops a confirmation, then drops the weapon
function combatDiscardWeapon() {
  const ally = CS.allies.find(a => a.gridId === CS.activeUnit);
  if (!ally || !ally.weapon) { toast('No weapon to discard.', 'error'); return; }
  if (CS.unitActed) { toast('Already acted this turn.', 'error'); return; }

  const w = ally.weapon;
  const broken = !weaponUsable(ally);
  const label  = broken ? w.name + ' (depleted)' : w.name;

  openModal(
    broken ? 'Discard Depleted Weapon?' : 'Discard Weapon?',
    '<b style="color:var(--gold)">' + w.icon + ' ' + label + '</b><br><br>' +
    (broken
      ? 'This weapon is out of ammo or broken. Discard it and fight unarmed?'
      : '<span style="color:var(--crimson-bright)">⚠ Weapon still has uses remaining.</span> Discard it anyway?<br><br>' +
        'You will fight unarmed for the rest of this mission.'),
    [
      {
        label: 'Discard',
        cls: 'danger',
        fn: () => {
          addLog(ally.name + ' discards ' + w.name + ' and fights unarmed!', 'system');
          ally.weapon = null;
          closeModal();
          renderCombat();
          updateActionButtons();
        }
      },
      { label: 'Keep', cls: '', fn: closeModal }
    ]
  );
}

function handleAttack(ally, tx, ty) {
  if (CS.unitActed) { toast('Already acted this turn.', 'error'); return; }
  const target = CS.enemies.find(e => e.x === tx && e.y === ty && e.hp > 0);
  if (!target) { toast('No valid target there.', 'error'); return; }
  // Unarmed fighting: if weapon is broken/empty, fight with fists
  // (player must explicitly discard if they want to switch mid-useful-weapon)
  const unarmedMode = isEffectivelyUnarmed(ally);
  const range = (!unarmedMode && ally.weapon?.range) ? ally.weapon.range : 1;
  const dist = Math.abs(target.x - ally.x) + Math.abs(target.y - ally.y);
  if (dist > range) { toast('Out of range.', 'error'); return; }
  // Line-of-sight check for ranged weapons
  if (range > 1 && !hasLineOfSight(ally.x, ally.y, target.x, target.y)) {
    toast('No line of sight to target!', 'error'); return;
  }
  // Cover miss chance for ranged attacks
  let missFromCover = false;
  if (range > 1) {
    const tKey = CS.grid[target.y]?.[target.x] || 'empty';
    const cover = (TERRAIN_TILES[tKey] || TERRAIN_TILES.empty).cover || 0;
    if (cover > 0 && Math.random() < cover * 0.08) {
      missFromCover = true;
      addLog(ally.name + ' fires at ' + target.name + ' — blocked by cover!', 'system');
    }
  }
  const adx = target.x - ally.x, ady = target.y - ally.y;
  if (Math.abs(adx) >= Math.abs(ady)) ally.facing = adx > 0 ? 'east' : 'west';
  else ally.facing = ady > 0 ? 'south' : 'north';
  if (!missFromCover) {
    const dmg = calcDamage(ally, target);
    const hitLabel = unarmedMode
      ? getUnarmedProfile(ally.class).icon + ' ' + ally.name + ' (' + getUnarmedProfile(ally.class).name + ')'
      : ally.name;
    applyDamage(target, dmg, hitLabel);
    if (!unarmedMode) {
      applyWeaponEffect(ally.weapon, target);
      checkOnHitPoison(ally, target);
    }
  }
  if (!unarmedMode) consumeWeaponUse(ally);
  CS.unitActed = true;
  CS.savedMove = null;
  CS.selectedAction = null;
  CS.highlightedTiles = [];
  const wasKill = !missFromCover && target.hp <= 0;
  giveJP(ally, wasKill ? JP_AWARDS.kill + JP_AWARDS.attack : JP_AWARDS.attack, 'attack');
  checkCombatEnd();
  renderCombat();
  if (CS.unitMoved && CS.unitActed) setTimeout(finishAllyTurn, 400);
}

const SPECIAL_RANGES = {
  triple_dmg:1, heavy_strike:1, spin_attack:1, stomp:1, charge:3,
  aoe_thrown:2, multi_thrown:5, poison:2, stun:2, confuse:3, paralyze:2,
  chi_bolt:3, void_bolt:4, life_drain:2, execute:1, heal_ally:1,
  decoy:0, invisible:0, blind_all:0, rage:0, defend:0, iron_body:0,
  battle_cry:0, meditate:0, bloodlust:0, mirror:0, darkness:3,
  teleport:5, phase_walk:5, counter:0, last_stand:0,
};
function handleSpecial(ally, tx, ty) {
  if (CS.unitActed) { toast('Already acted this turn.', 'error'); return; }
  const move = ally.specialMove;
  if (ally.chi < move.chi) { toast('Not enough Chi. Need ' + move.chi + '.', 'error'); return; }
  const specRange = SPECIAL_RANGES[move.effect] ?? 2;
  const dist = Math.abs(tx - ally.x) + Math.abs(ty - ally.y);
  const isSelf = specRange === 0;
  if (!isSelf && dist > specRange) {
    toast(move.name + ' is out of range (max ' + specRange + ' tiles).', 'error'); return;
  }
  if (!isSelf && specRange > 1 && dist > 1) {
    const hasEnemyTarget = CS.enemies.some(e => e.x === tx && e.y === ty && e.hp > 0);
    const hasAllyTarget = CS.allies.some(a => a.x === tx && a.y === ty && a.hp > 0);
    if ((hasEnemyTarget || hasAllyTarget) && !hasLineOfSight(ally.x, ally.y, tx, ty)) {
      toast('No line of sight for ' + move.name + '!', 'error'); return;
    }
  }
  ally.chi = Math.max(0, ally.chi - move.chi);
  CS.unitActed = true;
  CS.savedMove = null;
  CS.selectedAction = null;
  CS.highlightedTiles = [];
  const target = CS.enemies.find(e => e.x === tx && e.y === ty && e.hp > 0);
  const allyTarget = CS.allies.find(a => a.x === tx && a.y === ty && a.hp > 0 && a.gridId !== ally.gridId);
  const sfx = tx - ally.x, sfy = ty - ally.y;
  if (sfx !== 0 || sfy !== 0) {
    if (Math.abs(sfx) >= Math.abs(sfy)) ally.facing = sfx > 0 ? 'east' : 'west';
    else ally.facing = sfy > 0 ? 'south' : 'north';
  }
  executeSpecial(ally, move, target, allyTarget);
  checkCombatEnd();
  renderCombat();
  giveJP(ally, JP_AWARDS.special, 'special');
  if (CS.unitMoved && CS.unitActed) setTimeout(finishAllyTurn, 400);
}

function executeSpecial(caster, move, target, allyTarget) {
  switch (move.effect) {
    case 'triple_dmg':
      if (target) { const d = calcDamage(caster, target) * 3; applyDamage(target, d, caster.name); addLog(`✦ ${move.name}: ${d} damage!`, 'special'); } break;
    case 'heavy_strike':
      if (target) { const d = Math.floor(calcDamage(caster, target) * 2.5); applyDamage(target, d, caster.name); addLog(`✦ ${move.name}: ${d} damage!`, 'special'); } break;
    case 'spin_attack':
      CS.enemies.filter(e => e.hp > 0).forEach(e => {
        if (Math.abs(e.x - caster.x) <= 1 && Math.abs(e.y - caster.y) <= 1) {
          const d = calcDamage(caster, e); applyDamage(e, d, caster.name);
        }
      });
      addLog(`✦ ${move.name}: hits all nearby enemies!`, 'special'); break;
    case 'aoe_thrown': {
      // Level-scaled base damage — works with or without a thrown weapon equipped
      const _aoeBaseDmg = 8 + (caster.level || 1) * 3;
      const hitsAoe = CS.enemies.filter(e => e.hp > 0 && Math.abs(e.x - caster.x) <= 2 && Math.abs(e.y - caster.y) <= 2);
      if (hitsAoe.length === 0) { addLog('✦ ' + move.name + ': no enemies in range!', 'system'); break; }
      hitsAoe.forEach(e => {
        const d = Math.floor((caster.weapon && weaponUsable(caster) ? calcDamage(caster, e) : _aoeBaseDmg) * 0.5);
        applyDamage(e, Math.max(1, d), caster.name);
      });
      if (caster.weapon && weaponUsable(caster)) consumeWeaponUse(caster, hitsAoe.length);
      addLog('✦ ' + move.name + ': ' + hitsAoe.length + ' target' + (hitsAoe.length > 1 ? 's' : '') + ' hit!', 'special'); break;
    }
    case 'poison':
      if (target) { target.status = 'poisoned'; target._poisonedByClass = caster.class; addLog(`✦ ${move.name}: ${target.name} poisoned!`, 'special'); } break;
    case 'stun':
      if (target) { target.status = 'stunned'; addLog(`✦ ${move.name}: ${target.name} stunned!`, 'special'); } break;
    case 'confuse':
      if (target) { target.status = 'confused'; addLog(`✦ ${move.name}: ${target.name} confused!`, 'special'); } break;
    case 'paralyze':
      if (target) { target.status = 'stunned'; addLog(`✦ ${move.name}: ${target.name} paralyzed!`, 'special'); } break;
    case 'heal_ally': {
      const healTarget = allyTarget || caster;
      if (healTarget.doomed) {
        reviveAlly(healTarget, 30);
        addLog('✦ ' + move.name + ': ' + healTarget.name + ' revived!', 'heal');
      } else {
        const h = 30; healTarget.hp = Math.min(healTarget.maxHp, healTarget.hp + h);
        addLog('✦ ' + move.name + ': ' + healTarget.name + ' healed ' + h + ' HP.', 'heal');
      }
      break; }
    case 'chi_bolt':
    case 'void_bolt':
      if (target) { const d = 25 + Math.floor(Math.random() * 15); applyDamage(target, d, caster.name); addLog(`✦ ${move.name}: ${d} chi damage!`, 'special'); } break;
    case 'life_drain':
      if (target) { const d = 20; applyDamage(target, d, caster.name); caster.hp = Math.min(caster.maxHp, caster.hp + d); addLog(`✦ ${move.name}: drained ${d} HP!`, 'special'); } break;
    case 'multi_thrown': {
      const _multiBaseDmg = 10 + (caster.level || 1) * 4;
      const _multiTargets = CS.enemies.filter(e => e.hp > 0);
      if (!_multiTargets.length) { addLog('✦ ' + move.name + ': no enemies!', 'system'); break; }
      let hits = 0;
      for (let i = 0; i < 5; i++) {
        const _alive = CS.enemies.filter(e => e.hp > 0);
        if (!_alive.length) break;
        const e = _alive[Math.floor(Math.random() * _alive.length)];
        const d = Math.floor((caster.weapon && weaponUsable(caster) ? calcDamage(caster, e) : _multiBaseDmg) * 0.65);
        applyDamage(e, Math.max(1, d), caster.name); hits++;
      }
      if (hits && caster.weapon && weaponUsable(caster)) consumeWeaponUse(caster, hits);
      addLog('✦ ' + move.name + ': ' + hits + ' shurikens fly!', 'special'); break;
    }
    case 'rage':
      caster.buffs.push({ type: 'rage', turns: 2 }); addLog(`✦ ${move.name}: ${caster.name} enters RAGE!`, 'special'); break;
    case 'defend':
      caster.buffs.push({ type: 'defend', turns: 2 }); addLog(`✦ ${move.name}: ${caster.name} hardens!`, 'special'); break;
    case 'iron_body':
      caster.buffs.push({ type: 'iron_body', turns: 2 }); addLog(`✦ ${move.name}: ${caster.name} becomes iron!`, 'special'); break;
    case 'battle_cry':
      CS.allies.forEach(a => { if (a.hp > 0) a.buffs.push({ type: 'damage_up', turns: 2 }); });
      addLog(`✦ ${move.name}: all allies empowered!`, 'special'); break;
    case 'meditate':
      caster.chi = Math.min(caster.maxChi, caster.chi + 5); addLog(`✦ ${move.name}: ${caster.name} restores 5 Chi!`, 'special'); break;
    case 'teleport':
      if (isPosEmpty(tx, ty, caster.gridId)) { caster.x = tx; caster.y = ty; addLog(`✦ ${move.name}: ${caster.name} teleports!`, 'special'); } break;
    case 'execute':
      if (target && target.hp < target.maxHp * 0.3) { applyDamage(target, target.hp, caster.name); addLog(`✦ ${move.name}: EXECUTED!`, 'special'); } break;
    case 'charge':
      if (target) { const d = calcDamage(caster, target) * 1.5; applyDamage(target, Math.floor(d), caster.name); addLog(`✦ ${move.name}: charge hit!`, 'special'); } break;
    case 'stomp':
      CS.enemies.filter(e => e.hp > 0).forEach(e => {
        if (Math.abs(e.x - caster.x) <= 1 && Math.abs(e.y - caster.y) <= 1) {
          e.stamina = Math.max(0, (e.moveRange || 2) - 2); addLog(`${e.name} stumbles!`, 'damage');
        }
      });
      addLog(`✦ ${move.name}: ground shakes!`, 'special'); break;
    case 'bloodlust':
      caster.buffs.push({ type: 'bloodlust', turns: 2 }); addLog(`✦ ${move.name}: bloodlust!`, 'special'); break;
    case 'decoy': case 'invisible': case 'blind_all': case 'mirror': case 'darkness': case 'phase_walk': case 'counter': case 'last_stand': case 'rage':
      addLog(`✦ ${move.name} activated! Effect applied.`, 'special'); break;
    default:
      addLog(`✦ ${move.name} — effect activates!`, 'special');
  }
}

function calcDamage(attacker, defender) {
  const weapon = attacker.weapon;
  let baseDmg;
  if (weapon) {
    baseDmg = weapon.dmg[0] + Math.floor(Math.random() * (weapon.dmg[1] - weapon.dmg[0] + 1));
    const profType = getWeaponProfType(weapon);
    const prof = attacker.proficiency?.[profType] || 1;
    baseDmg = Math.floor(baseDmg * (1 + (prof - 3) * 0.05));
  } else {
    // Unarmed: use per-class profile
    const up = getUnarmedProfile(attacker.class);
    baseDmg = up.dmg[0] + Math.floor(Math.random() * (up.dmg[1] - up.dmg[0] + 1));
  }
  if (attacker.buffs?.some(b => b.type === 'rage' || b.type === 'damage_up')) baseDmg = Math.floor(baseDmg * 2);
  if (attacker.buffs?.some(b => b.type === 'last_stand')) baseDmg = Math.floor(baseDmg * 3);
  if (attacker.buffs?.some(b => b.type === 'bloodlust')) baseDmg = Math.floor(baseDmg * 1.3);
  if (attacker.buffs?.some(b => b.type === 'invisible')) baseDmg = Math.floor(baseDmg * 1.5);
  // Support damage bonus (Attack Up ability)
  if (attacker.gridId) baseDmg = Math.floor(baseDmg * getSupportDmgBonus(attacker));

  // Directional bonus on enemy (ally attacking enemy from behind/side)
  if (attacker.gridId && defender && defender.x !== undefined) {
    const dirMult = getDirDamageMult(defender, attacker.x, attacker.y);
    if (dirMult !== 1) baseDmg = Math.round(baseDmg * dirMult);
  }
  // ── CLASS STRENGTHS ──
  if (attacker.class === 'ronin' && weapon && (weapon.type === 'blades' || weapon.type === 'blunt')) {
    baseDmg = Math.floor(baseDmg * 1.20); // +20% with blades/blunt
  }
  if (attacker.class === 'berserker') {
    const hpLost = Math.max(0, attacker.maxHp - attacker.hp);
    const berserkBonus = 1 + Math.floor(hpLost / 10) * 0.05;
    baseDmg = Math.floor(baseDmg * berserkBonus); // +5% per 10 HP lost
  }
  if (attacker.class === 'kunoichi' && weapon && weapon.type === 'thrown') {
    baseDmg = Math.floor(baseDmg * 1.10); // +10% with thrown (proficiency speciality)
  }
  if (defender.buffs?.some(b => b.type === 'defend' || b.type === 'iron_body')) baseDmg = Math.floor(baseDmg * 0.33);
  // Armor passive: apply reduction while durability > 0
  const armorBuff = defender.buffs?.find(b => b.type === 'armor_passive');
  if (armorBuff) {
    if (armorBuff.effect === 'armor' || armorBuff.effect === 'shadow_armor') {
      baseDmg = Math.floor(baseDmg * (1 - armorBuff.value / 100));
    }
  }
  // ── CLASS STRENGTHS (attacker bonuses) ──
  if (attacker.class === 'ronin' && weapon && (weapon.type === 'blades' || weapon.type === 'blunt')) {
    baseDmg = Math.floor(baseDmg * 1.20); // Ronin: +20% with blades/blunt
  }
  if (attacker.class === 'berserker') {
    const hpLost = Math.max(0, (attacker.maxHp||0) - (attacker.hp||0));
    const berserkBonus = 1 + (Math.floor(hpLost / 10) * 0.05);
    baseDmg = Math.floor(baseDmg * berserkBonus); // Berserker: +5% per 10 HP lost
  }
  if (attacker.class === 'kunoichi' && weapon && weapon.type === 'thrown') {
    baseDmg = Math.floor(baseDmg * 1.10); // Kunoichi: +10% with thrown
  }
  return Math.max(1, baseDmg);
}

function getWeaponProfType(weapon) {
  const type = weapon.type || Object.keys(WEAPONS).find(k => WEAPONS[k].items.find(i => i.id === weapon.id));
  return type || 'blades';
}

// ── REINFORCEMENT SYSTEM ──
// Returns how many reinforcements to send based on current arc
function getReinforcementCount() {
  const curArc = getCurrentArc();
  return curArc ? curArc.arc : 1;  // Arc 1=1, Arc 2=2, ... Arc 5=5
}

// Spawn reinforcement enemies from the right-side "door" tile
// trigger: 'loot_dropped' | 'rescue_freed'
function spawnReinforcements(trigger) {
  const mission = CS.mission;
  // Only on rescue (floor 1 key drop / floor 2 freed) and theft loot drop
  const isRescue = mission?.type === 'rescue' || CS.mission?.floors?.[CS.currentFloor]?.isRescueFloor;
  const isTheft  = mission?.type === 'theft';
  if (!isRescue && !isTheft) return;

  const count = getReinforcementCount();
  if (count <= 0) return;

  // Pick a reinforcement enemy type from living enemies or use 'guard' fallback
  const aliveTypes = CS.enemies.filter(e => e.hp > 0).map(e => e.type);
  const baseType = aliveTypes.length ? aliveTypes[Math.floor(Math.random() * aliveTypes.length)] : 'guard';
  const type = ENEMY_TYPES[baseType] || ENEMY_TYPES.guard;

  addLog('⚠ Reinforcements incoming! (' + count + ' enemy' + (count > 1 ? 's' : '') + ')', 'system');
  toast('Reinforcements incoming!', 'error');

  // Spawn from right-edge "door" tiles (top and bottom area on right side)
  const doorX = CS.gridW - 1;
  const doorYs = [1, Math.floor(CS.gridH / 2), CS.gridH - 2];
  let ec = CS.enemies.length;

  for (let i = 0; i < count; i++) {
    const dy = doorYs[i % doorYs.length];
    // Find nearest empty tile on the right edge
    let rx = doorX, ry = dy;
    for (let attempt = 0; attempt < 8; attempt++) {
      if (isPosEmpty(rx, ry, null)) break;
      ry = (ry + 1) % (CS.gridH - 1);
      if (ry < 1) ry = 1;
    }

    const w = spawnEnemyWeapon(baseType, mission.difficulty || 1);
    const ar = w && (w.type === 'ranged' || w.type === 'thrown') ? Math.max(type.attackRange, w.range || 3) : type.attackRange;

    CS.enemies.push({
      id: 'reinforce_' + ec++,
      name: type.name, emoji: type.emoji,
      hp: type.hp, maxHp: type.hp, dmg: [...type.dmg],
      moveRange: type.moveRange, attackRange: ar,
      x: rx, y: ry,
      gold: Math.floor(type.gold * 0.5), exp: Math.floor(type.exp * 0.5),
      ai: type.ai, isBoss: false, isRecruitTarget: false,
      status: null, type: baseType,
      weapon: w, facing: 'west',
      ct: 20 + Math.floor(Math.random() * 30),
      spd: type.spd || 5,
      isReinforcement: true
    });

    // Flash the entry tile briefly
    CS.highlightedTiles.push({ x: rx, y: ry, color: 'rgba(220,50,50,0.5)' });
  }

  renderCombat();
  setTimeout(() => { CS.highlightedTiles = CS.highlightedTiles.filter(t => !CS.enemies.some(e => e.x === t.x && e.y === t.y && e.isReinforcement)); renderCombat(); }, 800);
}

function applyDamage(target, dmg, attackerName = '') {
  target.hp = Math.max(0, target.hp - dmg);
  addLog(`${attackerName ? attackerName + ' → ' : ''}${target.name}: ${dmg} damage. (${target.hp}/${target.maxHp} HP)`, 'damage');
  if (target.hp <= 0) {
    addLog(`${target.name} is defeated!`, 'death');
    recordKill(target); // reputation tracking
    if (target.gold) { GS.gold += target.gold; updateGoldDisplay(); }
    if (target.exp) {
      const ally = CS.allies.find(a => a.gridId === CS.activeUnit);
      if (ally) giveExp(ally, target.exp);
    }
    // ── ASSASSINATION: target killed → open exits ──
    if (target.isTarget) {
      CS.objectivePhase = 'extract';
      CS.exitsActive = true;
      addLog('🎯 TARGET ELIMINATED. Reach the exit!', 'system');
      toast('Target eliminated — escape now!', 'success');
    }
    // ── THEFT/RESCUE: carrier killed → drop loot on floor ──
    if (target.isCarrier && target.carriedLoot) {
      CS.lootOnFloor = { x: target.x, y: target.y, ...target.carriedLoot };
      target.carriedLoot = null;
      addLog('\u{1F4E6} Loot dropped at (' + target.x + ',' + target.y + ')! Move onto it to pick up.', 'system');
      toast('Loot dropped — pick it up!', 'success');
      setTimeout(() => spawnReinforcements('loot_dropped'), 400);
    }

    // ── COLLECTOR: drops a bonus gold bag on the floor ──
    if (target.type === 'collector') {
      const bonusGold = target.gold + Math.floor(Math.random() * 31) + 20; // 20-50 extra on top of base gold
      CS.goldPickups.push({ x: target.x, y: target.y, amount: bonusGold });
      addLog('💰 Gold bag dropped at (' + target.x + ',' + target.y + ')! Walk over it to collect ' + bonusGold + 'G!', 'system');
      toast('💰 Gold bag dropped — collect the gold!', 'success');
      schedulePulseRedraw(); // keep canvas animating until picked up
    }
  }
}

// JP per action: attack=10, special=15, kill=20, move only=3, use item=5
const JP_AWARDS = { attack: 10, special: 15, kill: 20, move: 3, item: 5 };

// Job level thresholds: level 1-5, unlock new ability slots at levels 2 and 4
const JOB_LEVEL_XP = [0, 150, 400, 800, 1400, 2200];

// ── Helpers ──

function getNinjaJobData(n) {
  if (!n.jobs) n.jobs = {};
  if (!n.jobs[n.class]) n.jobs[n.class] = { jp: 0, totalSp: 0, level: 1 };
  const jd = n.jobs[n.class];
  // Migrate: ensure totalSp exists on old saves
  if (jd.totalSp === undefined) jd.totalSp = jd.jp;
  return jd;
}

function getUnlockedAbilities(n) {
  return n.unlockedAbilities || [];
}

function getEquippedSlots(n) {
  if (!n.equippedAbilities) n.equippedAbilities = { reaction: null, support: null, movement: null };
  return n.equippedAbilities;
}

function getAbilitiesForSlot(n, slot) {
  return getUnlockedAbilities(n)
    .map(id => JOB_ABILITIES[id])
    .filter(a => a && a.slot === slot);
}

function canLearnAbility(n, abilityId) {
  const ab = JOB_ABILITIES[abilityId];
  if (!ab) return false;
  if (getUnlockedAbilities(n).includes(abilityId)) return false;
  if (ab.classReq && !ab.classReq.includes(n.class)) return false;
  const jd = getNinjaJobData(n);
  return jd.jp >= ab.jpCost;
}

function learnAbility(n, abilityId) {
  const ab = JOB_ABILITIES[abilityId];
  if (!ab) return false;
  const jd = getNinjaJobData(n);
  if (jd.jp < ab.jpCost) { toast('Not enough SP!', 'error'); return false; }
  jd.jp -= ab.jpCost;  // spend from spendable pool only — totalSp unchanged
  if (!n.unlockedAbilities) n.unlockedAbilities = [];
  n.unlockedAbilities.push(abilityId);
  // Auto-equip if slot is empty
  const slots = getEquippedSlots(n);
  if (!slots[ab.slot]) slots[ab.slot] = abilityId;
  saveGame();
  toast(n.name + ' learned ' + ab.name + '!', 'success');
  return true;
}

function equipAbility(n, slot, abilityId) {
  const slots = getEquippedSlots(n);
  slots[slot] = abilityId || null;
  saveGame();
}

function giveJP(n, amount, actionType) {
  const jd = getNinjaJobData(n);
  jd.jp += amount;        // spendable SP
  jd.totalSp += amount;   // lifetime SP (never decreases — drives level/meter)
  // Level up based on lifetime SP earned, not spendable
  const nextThreshold = JOB_LEVEL_XP[jd.level];
  if (nextThreshold && jd.totalSp >= nextThreshold && jd.level < 5) {
    jd.level++;
    const gn = GS.clan.find(x => x.id === n.id);
    if (gn) { if (!gn.jobs) gn.jobs = {}; gn.jobs[n.class] = { ...jd }; }
    addLog('★ ' + n.name + ' Skill Level ' + jd.level + ' (' + n.class + ')!', 'system');
    toast(n.name + ': ' + n.class + ' Skill Lv' + jd.level + '!', 'success');
  }
  const gn = GS.clan.find(x => x.id === n.id);
  if (gn) { if (!gn.jobs) gn.jobs = {}; gn.jobs[n.class] = { ...jd }; }
}

// ── Compute effective stats with support passives ──
function getEffectiveMoveRange(ally) {
  const cls = CLASSES[ally.class];
  let range = cls.moveRange;
  const slots = getEquippedSlots(ally);
  if (slots.movement) {
    const ab = JOB_ABILITIES[slots.movement];
    if (ab?.effect === 'move_range') range += ab.value;
  }
  return range;
}

function hasMovementAbility(ally, effectId) {
  const slots = getEquippedSlots(ally);
  if (!slots.movement) return false;
  return JOB_ABILITIES[slots.movement]?.effect === effectId;
}

function hasSupportAbility(ally, effectId) {
  const slots = getEquippedSlots(ally);
  if (!slots.support) return false;
  return JOB_ABILITIES[slots.support]?.effect === effectId;
}

function hasWeaponUnlock(ally, weaponType) {
  const slots = getEquippedSlots(ally);
  if (!slots.support) return false;
  const ab = JOB_ABILITIES[slots.support];
  return ab?.effect === 'unlock_weapon' && ab.weaponType === weaponType;
}

function getSupportDmgBonus(ally) {
  const slots = getEquippedSlots(ally);
  if (!slots.support) return 1;
  const ab = JOB_ABILITIES[slots.support];
  return ab?.effect === 'stat_dmg' ? (1 + ab.value) : 1;
}

// ── REACTION hooks ──

// Called before ally takes damage — returns modified damage after reactions
function triggerReaction(ally, rawDmg, attackerUnit) {
  const slots = getEquippedSlots(ally);
  const reactionId = slots?.reaction;
  if (!reactionId) return rawDmg;
  const ab = JOB_ABILITIES[reactionId];
  if (!ab) return rawDmg;

  switch (ab.effect) {
    case 'counter': {
      if (attackerUnit && attackerUnit.hp > 0) {
        const counterDmg = Math.max(1, Math.floor(rawDmg * ab.value));
        if (attackerUnit.gridId) {
          // Attacker is an ally (shouldn't happen normally)
        } else {
          attackerUnit.hp = Math.max(0, attackerUnit.hp - counterDmg);
          addLog(ally.name + ' COUNTERS ' + attackerUnit.name + ' for ' + counterDmg + '!', 'special');
        }
      }
      return rawDmg;
    }
    case 'auto_heal': {
      const hpAfter = ally.hp - rawDmg;
      if (hpAfter / ally.maxHp < ab.threshold) {
        const healItem = ally.carriedItems?.find(i => i.effect === 'heal' || i.effect === 'full_heal');
        if (healItem) {
          const healed = Math.min(ally.maxHp - ally.hp, healItem.value || 25);
          ally.hp = Math.min(ally.maxHp, ally.hp + healed);
          const idx = ally.carriedItems.indexOf(healItem);
          if (idx !== -1) ally.carriedItems.splice(idx, 1);
          addLog(ally.name + ': Auto-Potion activates! +' + healed + ' HP', 'heal');
        }
      }
      return rawDmg;
    }
    case 'evade_step': {
      if (Math.random() < ab.chance) {
        // Try to step to adjacent empty tile
        const dirs = [{dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1}];
        for (const d of dirs) {
          if (isPosEmpty(ally.x + d.dx, ally.y + d.dy, ally.gridId)) {
            ally.x += d.dx; ally.y += d.dy;
            addLog(ally.name + ' redirects and dodges!', 'special');
            return 0; // evaded
          }
        }
      }
      return rawDmg;
    }
    case 'nullify_blade': {
      if (attackerUnit?.weapon?.type === 'blades' && Math.random() < ab.chance) {
        addLog(ally.name + ' grasps the blade — nullified!', 'special');
        return 0;
      }
      return rawDmg;
    }
    case 'chi_absorb': {
      if (ally.chi >= ab.chiCost) {
        ally.chi -= ab.chiCost;
        const absorbed = Math.floor(rawDmg * ab.value);
        addLog(ally.name + ' chi barrier absorbs ' + absorbed + ' dmg!', 'special');
        return rawDmg - absorbed;
      }
      return rawDmg;
    }
  }
  return rawDmg;
}

// Check iron_will support ability
function checkIronWill(ally, dmg) {
  // Berserker innate: cannot be one-shot from above 25% HP
  if (ally.class === 'berserker' && ally.hp - dmg <= 0 && ally.hp > ally.maxHp * 0.25) {
    addLog(ally.name + ': Berserker will — survives at 1 HP!', 'special');
    return ally.hp - 1;
  }
  if (!hasSupportAbility(ally, 'survive_lethal')) return dmg;
  if (ally.hp - dmg <= 0 && ally.hp > 10) {
    addLog(ally.name + ': Iron Will activates! Survives at 1 HP!', 'special');
    return ally.hp - 1; // survive at 1 HP
  }
  return dmg;
}

// Check poison_touch on_hit support
function checkOnHitPoison(ally, target) {
  if (!hasSupportAbility(ally, 'on_hit_poison')) return;
  if (target && target.hp > 0 && Math.random() < 0.3) {
    target.status = 'poisoned';
    addLog(ally.name + ': Poison Touch! ' + target.name + ' poisoned!', 'special');
  }
}

function swapSpecialMove(ninjaId, moveName) {
  const n = GS.clan.find(x => x.id === ninjaId);
  if (!n) return;
  const jd = getNinjaJobData(n);
  const SWAP_COST = 200;
  if (jd.jp < SWAP_COST) { toast('Need ' + SWAP_COST + ' SP to swap special move.', 'error'); return; }
  const cls = CLASSES[n.class];
  const newMove = cls?.specialMoves.find(m => m.name === moveName);
  if (!newMove) { toast('Special move not found.', 'error'); return; }
  openModal('Swap Special Move?',
    '<b style="color:var(--gold)">' + n.name + '</b> will replace <b>' + n.specialMove.name + '</b> with <b style="color:var(--jade-bright)">' + newMove.name + '</b> (' + newMove.chi + ' ☯).<br><br>'
    + '<span class="text-mist">' + newMove.desc + '</span><br><br>'
    + 'Cost: <b style="color:var(--gold)">' + SWAP_COST + ' SP</b>',
    [
      { label: 'Swap (' + SWAP_COST + ' SP)', fn: () => {
        jd.jp -= SWAP_COST;
        n.specialMove = { ...newMove };
        // Sync to GS
        const gn = GS.clan.find(x => x.id === n.id);
        if (gn) { gn.specialMove = { ...newMove }; if (!gn.jobs) gn.jobs = {}; gn.jobs[n.class] = { ...jd }; }
        saveGame(); closeModal();
        toast(n.name + ' learned ' + newMove.name + '!', 'success');
        renderJobShop(); renderClan();
      }, cls: 'confirm' },
      { label: 'Cancel', fn: closeModal }
    ]
  );
}

function learnAbilityUI(ninjaId, abilityId) {

function giveExp(ninja, exp) {
  ninja.exp += exp;
  if (ninja.exp >= ninja.expToNext) {
    ninja.level++;
    ninja.exp -= ninja.expToNext;
    ninja.expToNext = Math.floor(ninja.expToNext * 1.5);
    ninja.maxHp += 10; ninja.hp = ninja.maxHp;
    ninja.maxChi = Math.min(ninja.maxChi + 1, 15);
    addLog('✦ ' + ninja.name + ' reached Level ' + ninja.level + '!', 'system');
    toast(ninja.name + ' leveled up to Level ' + ninja.level + '!', 'success');
    const gn = GS.clan.find(x => x.id === ninja.id);
    if (gn) { gn.level = ninja.level; gn.exp = ninja.exp; gn.expToNext = ninja.expToNext; gn.maxHp = ninja.maxHp; gn.maxChi = ninja.maxChi; }
  }
}
